[package]
name = "torshield_ir"
version = "9.0.0"
edition = "2021"

[lib]
name = "torshield_ir"
path = "src/lib.rs"

[features]
default = []
smart-detection = []
network = []

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
chrono = "0.4"
thiserror = "1.0"
regex = "1.10"

[[bin]]
name = "bridge-probe"
path = "bridge-probe/src/main.rs"

[[bin]]
name = "scraper"
path = "src/scraper.rs"

[[bin]]
name = "pipeline"
path = "src/bin/sync_bridge_outputs.rs"

[[bin]]
name = "ai_gateway_health_check"
path = "src/bin/ai_gateway_health_check.rs"

[[bin]]
name = "self_heal"
path = "src/self_heal.rs"

[[bin]]
name = "ai_bridge_reranker"
path = "src/iran_bridge_prioritizer.rs"

[[bin]]
name = "auto_debug"
path = "src/auto_debug_system.rs"

[[bin]]
name = "ooni_correlator"
path = "src/ooni_correlator.rs"

[[bin]]
name = "ml_predictor"
path = "src/ml_predictor.rs"

[[bin]]
name = "dpi_evasion_advanced"
path = "src/dpi_evasion_advanced.rs"

[[bin]]
name = "ech_fingerprint_evasion"
path = "src/ech_fingerprint_evasion.rs"

[[bin]]
name = "anti_ai_dpi"
path = "src/anti_ai_dpi.rs"

[[bin]]
name = "iran_anti_siam"
path = "src/iran_anti_siam.rs"

[[bin]]
name = "zero_trust_routing"
path = "src/zero_trust_bridge_routing.rs"

[[bin]]
name = "quantum_obfuscator"
path = "src/quantum_resistant_obfuscator.rs"
