# Egress Diagnostic Worker config — TEMPORARY companion to wrangler.toml.
#
# Deployed ONLY on demand by .github/workflows/egress-diagnostic.yml (never
# by the main pipeline), under a DIFFERENT worker name so the production
# probe relay (tor-bridge-probe-relay, wrangler.toml) is never touched.
# The diagnostic workflow deletes this worker at the end of each run.
#
# Purpose: run one primitive network operation per request from the real
# Cloudflare edge (bare TCP / TLS / startTls split / DoH / fetch) so the
# meek/conjure TLS-connect timeouts observed in CI can be attributed to
# DNS, TCP, or the TLS handshake specifically. See src/diag.ts.
name = "tor-bridge-probe-relay-diag"
main = "src/diag.ts"
compatibility_date = "2025-08-09"

[observability]
enabled = false

# DIAG_TOKEN is set per-deploy via `wrangler deploy --var DIAG_TOKEN:...`
# (fresh random value generated by the diagnostic workflow each run).
