[package]
name = "tbc-prober"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Handshake-level bridge prober: drives the transport codecs over TCP with timeouts, retries, and verdict mapping."

[dependencies]
tbc-core = { path = "../core" }
tbc-transports = { path = "../transports" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["net"] }
rand = "=0.8.6"
sha1 = "=0.10.7"
sha2 = "=0.10.9"
hmac = "=0.12.1"
base64 = "=0.22.1"
url = "=2.5.8"

[dev-dependencies]
tbc-core = { path = "../core" }
tbc-transports = { path = "../transports" }
tokio = { workspace = true, features = ["net"] }
chrono = { workspace = true }
hmac = "=0.12.1"
sha2 = "=0.10.9"

# TLS-based transport probes (vanilla ORPort link protocol, WebTunnel HTTPS
# upgrade) need a client TLS stack. Mirror the root crate's target gate: the
# ARM-musl CI job is a type-check with no C toolchain, so ring must stay out
# of that target; on every runtime target (x86_64 glibc/musl, ARM GNU) the
# same rustls/tokio-rustls versions as the root crate are linked.
[target.'cfg(not(all(target_arch = "arm", target_env = "musl")))'.dependencies]
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
rustls = { workspace = true }
