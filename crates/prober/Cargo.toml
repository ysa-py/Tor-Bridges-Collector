[package]
name = "tbc-prober"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
description = "Handshake-level bridge prober: drives the transport codecs over TCP with timeouts, retries, and verdict mapping."

[dependencies]
tbc-core = { path = "../core" }
tbc-transports = { path = "../transports" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["net"] }
rand = "=0.8.6"
sha1 = "=0.10.7"
sha2 = "=0.10.9"
hmac = "=0.12.1"
base64 = "=0.22.1"
url = "=2.5.8"

[dev-dependencies]
tbc-core = { path = "../core" }
tbc-transports = { path = "../transports" }
tokio = { workspace = true, features = ["net"] }
chrono = { workspace = true }
hmac = "=0.12.1"
sha2 = "=0.10.9"
