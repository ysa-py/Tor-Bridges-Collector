[package]
name = "tbc-consent"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
description = "Explicit, unskippable volunteer consent gate (Phase-2 item 1)."

[[bin]]
name = "consent-check"
path = "src/bin/consent-check.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }

[dev-dependencies]
serde_json = { workspace = true }
