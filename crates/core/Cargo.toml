[package]
name = "tbc-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
description = "Shared domain model, error taxonomy, clock, and metrics for the Tor Bridges Collector."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "=0.4.41", default-features = false, features = ["std", "clock", "serde"] }
base64 = "=0.22.1"
url = "=2.5.8"

[dev-dependencies]
proptest = "=1.4.0"
