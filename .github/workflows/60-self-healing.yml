---
name: "60 · AI Self-Healing Engine"
# Reusable workflow — invoked by 00-orchestrator.yml.
# Owns: failure categorization, AI-powered auto-debug with additive-only patch
#       policy (NEVER deletes code, only adds fixes).
# FIX from original: scoped workflow_run trigger — no longer fires on its own
# completion (recursive trigger eliminated).

'on':
  workflow_call:
  workflow_run:
    workflows:
      - "00 · Tor-Bridges-Collector Orchestrator"
      - "40 · TorShield-IR Pipeline"
      - "10 · Rust Quality Gate"
      - "20 · Build Binaries"
    types: [completed]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_NO_WARNINGS: '1'
  PYTHONPATH: ${{ github.workspace }}

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-self-healing
  cancel-in-progress: false

jobs:
  auto-diagnose-and-fix:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      failure_category: ${{ steps.categorize-failure.outputs.category }}
      is_fixable: ${{ steps.categorize-failure.outputs.is_fixable }}
      should_run_autodebug: ${{ steps.categorize-failure.outputs.should_run_autodebug }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap environment defaults
        run: |
          set -euo pipefail
          if [ -f scripts/github_actions_env_bootstrap.sh ]; then
            bash scripts/github_actions_env_bootstrap.sh
          else
            echo "bootstrap script absent — continuing with defaults"
          fi
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies (parity fallback path)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pyyaml requests aiohttp structlog tenacity rich
          fi

      - name: Ensure output dir
        run: mkdir -p data

      - name: Set up Rust (preferred native path)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'stable'

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Categorize Failure
        id: categorize-failure
        env:
          GH_PAT_AUTOFIX: ${{ secrets.GH_PAT_AUTOFIX }}
          GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
          GH_REPO_NAME: ${{ secrets.GH_REPO_NAME }}
        env:
          PARENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'manual' }}
        run: |
          set -euo pipefail
          echo "═══ Failure Categorization ═══"
          python3 - <<'ENDSCRIPT'
          import json, os, sys, re
          sys.path.insert(0, ".")
          try:
              from monitoring.structured_logging import FailureAnalytics
              analytics = FailureAnalytics()
          except ImportError:
              analytics = None
          token = os.environ.get("GH_PAT_AUTOFIX", "")
          owner = os.environ.get("GH_REPO_OWNER", "")
          repo  = os.environ.get("GH_REPO_NAME", "")
          workflow_name = os.environ.get("GITHUB_WORKFLOW", "unknown")
          parent_conclusion = os.environ.get("PARENT_CONCLUSION", "manual")
          category = "unknown"; is_fixable = "false"; should_run_autodebug = "true"
          if parent_conclusion not in {"failure", "manual"}:
              category = "no_failure"; is_fixable = "false"; should_run_autodebug = "false"
              with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
                  f.write(f"category={category}\n"); f.write(f"is_fixable={is_fixable}\n")
                  f.write(f"should_run_autodebug={should_run_autodebug}\n")
              os.makedirs("data", exist_ok=True)
              with open("data/failure_categorization.json", "w") as f:
                  json.dump({"workflow_name": workflow_name, "failure_category": category,
                             "is_fixable": False, "should_run_autodebug": False}, f, indent=2)
              sys.exit(0)
          fixable_patterns = {
              "syntax_error": ["SyntaxError", "IndentationError", "syntax error", "invalid syntax"],
              "auth_failure": ["401", "403", "Unauthorized", "Forbidden", "invalid api key"],
              "model_error": ["model not found", "invalid model", "wrong response", "ValueError"],
          }
          transient_patterns = {
              "network_error": ["ConnectionError", "TimeoutError", "connection refused", "502", "503", "504"],
              "timeout": ["timeout", "timed out", "deadline exceeded", "ETIMEDOUT"],
          }
          log_content = ""
          if token and owner and repo:
              import urllib.request
              try:
                  event_path = os.environ.get("GITHUB_EVENT_PATH", "")
                  parent_run_id = ""
                  if event_path and os.path.exists(event_path):
                      with open(event_path) as f: event_data = json.load(f)
                      parent_run_id = str(event_data.get("workflow_run", {}).get("id", ""))
                  if parent_run_id:
                      url = f"https://api.github.com/repos/{owner}/{repo}/actions/runs/{parent_run_id}/logs"
                      req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"})
                      try:
                          with urllib.request.urlopen(req, timeout=30) as r:
                              content = r.read()
                              if content[:2] == b"PK":
                                  import zipfile, io
                                  with zipfile.ZipFile(io.BytesIO(content)) as z:
                                      texts = [z.read(n).decode("utf-8", errors="replace") for n in z.namelist() if n.endswith(".txt")]
                                      log_content = "\n".join(texts)[-5000:]
                              else:
                                  log_content = content.decode("utf-8", errors="replace")[-5000:]
                      except Exception as e: print(f"Could not fetch parent logs: {e}")
              except Exception as e: print(f"Event parsing error: {e}")
          combined_text = (workflow_name + " " + log_content).lower()
          for cat, patterns in transient_patterns.items():
              if any(p.lower() in combined_text for p in patterns):
                  category = cat; break
          if category == "unknown":
              for cat, patterns in fixable_patterns.items():
                  if any(p.lower() in combined_text for p in patterns):
                      category = cat; break
          if category == "unknown": category = "unknown_fixable"
          fixable_categories = {"syntax_error", "auth_failure", "model_error", "unknown_fixable"}
          if category in fixable_categories:
              is_fixable = "true"; should_run_autodebug = "true"
          elif category in {"network_error", "timeout"}:
              is_fixable = "false"; should_run_autodebug = "true"
          else:
              is_fixable = "false"; should_run_autodebug = "true"
          if analytics:
              analytics.record_failure(provider="self_healing", error_message=f"workflow_failure:{workflow_name}")
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write(f"category={category}\n"); f.write(f"is_fixable={is_fixable}\n")
              f.write(f"should_run_autodebug={should_run_autodebug}\n")
          with open("data/failure_categorization.json", "w") as f:
              json.dump({"workflow_name": workflow_name, "failure_category": category,
                         "is_fixable": is_fixable == "true",
                         "should_run_autodebug": should_run_autodebug == "true",
                         "has_logs": bool(log_content)}, f, indent=2)
          ENDSCRIPT

      - name: Run AutoDebugEngine (Rust first, Python fallback)
        if: steps.categorize-failure.outputs.should_run_autodebug == 'true'
        env:
          GH_PAT_AUTOFIX: ${{ secrets.GH_PAT_AUTOFIX }}
          GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
          GH_REPO_NAME: ${{ secrets.GH_REPO_NAME }}
          CEREBRAS_API_KEY_1: ${{ secrets.CEREBRAS_API_KEY_1 }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
          PORTKEY_API_KEY_1: ${{ secrets.PORTKEY_API_KEY_1 }}
          PORTKEY_GATEWAY_URL: ${{ secrets.PORTKEY_GATEWAY_URL }}
          CF_ACCOUNT_ID_1: ${{ secrets.CF_ACCOUNT_ID_1 }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CF_ACCOUNT_ID_3 }}
          CF_ACCOUNT_ID_4: ${{ secrets.CF_ACCOUNT_ID_4 }}
          CF_ACCOUNT_ID_5: ${{ secrets.CF_ACCOUNT_ID_5 }}
          CF_ACCOUNT_ID_6: ${{ secrets.CF_ACCOUNT_ID_6 }}
          CF_ACCOUNT_ID_7: ${{ secrets.CF_ACCOUNT_ID_7 }}
          CF_ACCOUNT_ID_8: ${{ secrets.CF_ACCOUNT_ID_8 }}
          CF_ACCOUNT_ID_9: ${{ secrets.CF_ACCOUNT_ID_9 }}
          CF_ACCOUNT_ID_10: ${{ secrets.CF_ACCOUNT_ID_10 }}
          CF_ACCOUNT_ID_11: ${{ secrets.CF_ACCOUNT_ID_11 }}
          CF_API_TOKEN_1: ${{ secrets.CF_API_TOKEN_1 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          CF_API_TOKEN_3: ${{ secrets.CF_API_TOKEN_3 }}
          CF_API_TOKEN_4: ${{ secrets.CF_API_TOKEN_4 }}
          CF_API_TOKEN_5: ${{ secrets.CF_API_TOKEN_5 }}
          CF_API_TOKEN_6: ${{ secrets.CF_API_TOKEN_6 }}
          CF_API_TOKEN_7: ${{ secrets.CF_API_TOKEN_7 }}
          CF_API_TOKEN_8: ${{ secrets.CF_API_TOKEN_8 }}
          CF_API_TOKEN_9: ${{ secrets.CF_API_TOKEN_9 }}
          CF_API_TOKEN_10: ${{ secrets.CF_API_TOKEN_10 }}
          CF_API_TOKEN_11: ${{ secrets.CF_API_TOKEN_11 }}
          CF_AI_GATEWAY_URL_1: ${{ secrets.CF_AI_GATEWAY_URL_1 }}
          CF_AI_GATEWAY_URL_2: ${{ secrets.CF_AI_GATEWAY_URL_2 }}
          CF_AI_GATEWAY_URL_3: ${{ secrets.CF_AI_GATEWAY_URL_3 }}
          CF_AI_GATEWAY_URL_4: ${{ secrets.CF_AI_GATEWAY_URL_4 }}
          CF_AI_GATEWAY_URL_5: ${{ secrets.CF_AI_GATEWAY_URL_5 }}
          CF_AI_GATEWAY_URL_6: ${{ secrets.CF_AI_GATEWAY_URL_6 }}
          CF_AI_GATEWAY_URL_7: ${{ secrets.CF_AI_GATEWAY_URL_7 }}
          CF_AI_GATEWAY_URL_8: ${{ secrets.CF_AI_GATEWAY_URL_8 }}
          CF_AI_GATEWAY_URL_9: ${{ secrets.CF_AI_GATEWAY_URL_9 }}
          CF_AI_GATEWAY_URL_10: ${{ secrets.CF_AI_GATEWAY_URL_10 }}
          CF_AI_GATEWAY_URL_11: ${{ secrets.CF_AI_GATEWAY_URL_11 }}
        env:
          PARENT_WORKFLOW_NAME: ${{ github.event.workflow_run.name || github.workflow }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
        run: |
          set +e
          if cargo build --release --bin auto_debug 2>/dev/null; then
            ./target/release/auto_debug "$PARENT_WORKFLOW_NAME" "$PARENT_RUN_ID"
          else
            python -m torshield_ai_gateway.auto_debug "$PARENT_WORKFLOW_NAME" "$PARENT_RUN_ID" || true
          fi

      - name: Upload categorization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-categorization-${{ github.run_id }}
          path: data/failure_categorization.json
          retention-days: 7
          if-no-files-found: ignore

