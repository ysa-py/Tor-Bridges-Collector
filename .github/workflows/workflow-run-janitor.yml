name: workflow-run-janitor

# Keeps the Actions history small and debuggable, fully automatically:
#   * per workflow: newest SUCCESS (reference) + newest FAILURE (what you debug) are kept,
#   * runs that are still running are never touched; stuck ones (> 6 h) are force-cancelled,
#   * everything else is deleted, in rate-limit-aware batches (the backlog drains hour by hour).
# Policy + tests: scripts/lib/run_cleanup_plan.mjs, scripts/test_run_cleanup_plan.mjs.
# The older "AI Ultra-Pro Cleanup" workflow stays as a reusable no-op guard for CI validation.

on:
  schedule:
    # twice an hour: the API budget (1000 req/h for GITHUB_TOKEN) drains a big backlog in ~2 h,
    # afterwards a pass costs only a handful of requests
    - cron: "23,53 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      max_delete:
        description: "Maximum deletions in this pass"
        required: false
        default: "700"
      chain_depth:
        description: "Internal: how many self-dispatched follow-up passes already ran"
        required: false
        default: "0"
  push:
    branches: [main]
    paths:
      - "scripts/cleanup_workflow_runs.mjs"
      - "scripts/lib/run_cleanup_plan.mjs"
      - ".github/workflows/workflow-run-janitor.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: workflow-run-janitor
  cancel-in-progress: false

jobs:
  janitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Self-test (retention policy)
        run: node scripts/test_run_cleanup_plan.mjs

      - name: Clean up workflow runs
        id: janitor
        env:
          # Optional repository secret RUN_CLEANUP_TOKEN (fine-grained PAT, Actions: read+write)
          # raises the budget from 1000 to 5000 requests/hour; without it GITHUB_TOKEN is used.
          GITHUB_TOKEN: ${{ secrets.RUN_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_DELETE: ${{ github.event.inputs.max_delete || '700' }}
        run: |
          set -euo pipefail
          args=(--max-delete "$MAX_DELETE" --json "$RUNNER_TEMP/janitor-report.json")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry); fi
          node scripts/cleanup_workflow_runs.mjs "${args[@]}"

      # Backlog drain: dispatch the next pass right away while work is left (max 6 follow-ups).
      - name: Chain next pass while a backlog remains
        if: steps.janitor.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ secrets.RUN_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
          DEPTH: ${{ github.event.inputs.chain_depth || '0' }}
          MAX_DELETE: ${{ github.event.inputs.max_delete || '700' }}
        run: |
          set -euo pipefail
          if [ "${DEPTH}" -ge 6 ]; then
            echo "chain depth limit reached - the next scheduled pass continues"
            exit 0
          fi
          gh workflow run workflow-run-janitor.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME}" \
            -f dry_run=false -f max_delete="$MAX_DELETE" -f chain_depth="$((DEPTH + 1))" \
            || echo "::notice::could not chain a follow-up pass (token cannot dispatch) - the schedule continues"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-run-janitor-report
          path: ${{ runner.temp }}/janitor-report.json
          if-no-files-found: ignore
          retention-days: 3
