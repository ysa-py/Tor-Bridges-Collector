---
# ══════════════════════════════════════════════════════════════════════════
# ⚠ STATUS UNCONFIRMED (flagged during 2026-08-01 consolidation)
# This file previously carried a banner claiming CircleCI (.circleci/config.yml)
# is the primary CI/CD platform and that GitHub Actions is a dormant fallback
# "not currently gating anything." That claim could NOT be verified against
# the repository snapshot used for this consolidation: no .circleci/ directory
# exists anywhere in it (only two orphaned support scripts,
# scripts/circleci_env_bootstrap.sh and scripts/circleci_packaging.sh,
# reference CircleCI at all). ZERO_ERROR_ENGINEERING_PROMPT.md assumes the
# opposite — that GitHub Actions IS the live system to watch via `gh run
# list`. Please confirm directly in the repo's Actions tab which system is
# actually running before trusting either document, and update whichever one
# is stale.
# ══════════════════════════════════════════════════════════════════════════
# TorShield-IR AI Self-Healing Engine v9.0
# FIXED v8.1:
#   - Added pip install -r requirements.txt (was missing entirely)
#   - Uses pip cache to avoid re-downloading on every trigger
# FIXED v9.0:
#   - Added failure categorization step before AutoDebugEngine
#   - Only runs AutoDebugEngine for fixable categories (syntax_error, auth_failure, model_error)
#   - Skips for transient failures (network_error, timeout) that will self-resolve
#   - Logs the failure category to workflow output
# MERGED v9.1 (2026-08-01 consolidation) — absorbed self-heal.yml:
#   - self-heal.yml ran only after "Zero-Error Enterprise CI" (a strict
#     subset of this file's workflow_run: ["*"]), on a 6h schedule, and on
#     push to main/master — all now covered by this file's own triggers plus
#     the "workspace-diagnostics" step added below.
#   - self-heal.yml called the Windows `powershell` binary directly on an
#     ubuntu-latest runner. The Rust validate_workflows binary already flags this
#     exact pattern by name (the "incident #73 / Exit-127" class) and
#     ZERO_ERROR_ENGINEERING_PROMPT.md explicitly lists it as a rejected
#     anti-pattern — `powershell` does not exist on Linux runners, only
#     `pwsh` might, and even then the source script used backslash paths
#     (.\\scripts\\self_heal.ps1) that don't resolve on Linux either. Fixed
#     by calling the already-existing Linux-native scripts/self_heal.sh,
#     which performs the identical fmt/clippy/audit/test + diagnostics
#     collection as scripts/self_heal.ps1, verbatim, no behaviour lost.
#   - The original self-heal.yml is preserved unmodified at
#     .github/workflows/_archived/self-heal.yml for reference; it no longer
#     runs (GitHub Actions only executes workflows directly inside
#     .github/workflows/, not subfolders), so it can't double-run alongside
#     this file.
# Triggers on ANY workflow failure. Diagnoses + patches automatically.
# Additive-only policy enforced in AutoDebugEngine.apply_patch_to_repo().
name: AI Self-Healing Engine

# Serialize diagnosis per upstream ref while allowing independent branches to
# heal concurrently; cancel obsolete callbacks to avoid queue amplification.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_NO_WARNINGS: '1'

'on':
  workflow_run:
    workflows: ["*"]
    types: [completed]
  schedule:
    # Merged from self-heal.yml — independent 6h heartbeat, does not depend
    # on any workflow_run event firing.
    - cron: '0 */6 * * *'
  push:
    # Merged from self-heal.yml
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  auto-diagnose-and-fix:
    # Unchanged scope: this job only ever made sense for a workflow_run
    # (something finished, go categorize why) or a manual dispatch. The
    # schedule/push triggers above are new additions for the merged
    # workspace-diagnostics job below and were never meant to also fire
    # this job — its steps read github.event.workflow_run.* throughout,
    # which is empty on schedule/push events.
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.name != github.workflow) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      failure_category: ${{ steps.categorize-failure.outputs.category }}
      is_fixable: ${{ steps.categorize-failure.outputs.is_fixable }}
      should_run_autodebug: ${{ steps.categorize-failure.outputs.should_run_autodebug }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bootstrap environment defaults
        run: |
          set -euo pipefail
          bash scripts/github_actions_env_bootstrap.sh

      # 2026-08-02: setup-python/pip removed — the failure categorizer is now
      # the Rust `ai_workflow_tools categorize-failure` binary; no workflow
      # step in this file needs a Python runtime any more.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure output dirs
        run: mkdir -p data diagnostics

      # Download the complete parent-run log, not only the first failing job
      # excerpt. The Rust classifier reads every line and records swallowed
      # fallbacks, empty source results, skipped toolchains, and non-zero exits.
      - name: Whole-run detect diagnose repair verify
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set +e
          gh run view "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --log > data/parent_run.log
          FETCH_STATUS=$?
          if [ "$FETCH_STATUS" -ne 0 ] || [ ! -s data/parent_run.log ]; then
            echo "::warning::complete parent log could not be downloaded (status=$FETCH_STATUS)"
            printf 'parent log unavailable; GitHub API fetch failed with status %s\n' "$FETCH_STATUS" > data/parent_run.log
          fi
          cargo run --quiet --bin self_heal -- \
            --log data/parent_run.log \
            --heal \
            --output data/whole_run_diagnostics.json
          DIAGNOSTIC_STATUS=$?
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -s data/whole_run_diagnostics.json ]; then
            {
              echo "## Whole-run diagnostics"
              jq -r '.diagnostics // {} | "status=\(.status // \"unavailable\") errors=\(.errors // 0) warnings=\(.warnings // 0) failsafe_triggers=\(.failsafe_triggers // 0) unresolved=\(.unresolved // 0) total_lines=\(.total_lines // 0)"' data/whole_run_diagnostics.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "whole-run diagnostics exit status: $DIAGNOSTIC_STATUS"
          exit 0

      # ════════════════════════════════════════════════════════════════════════
      # FAILURE CATEGORIZATION: Classify the failure type before attempting
      # auto-debug. This prevents wasted resources on transient failures
      # that will self-resolve, and focuses AutoDebugEngine on fixable issues.
      #
      # Categories:
      #   fixable:     syntax_error, auth_failure, model_error
      #   transient:   network_error, timeout (skip AutoDebugEngine)
      # ════════════════════════════════════════════════════════════════════════
      - name: Categorize Failure
        id: categorize-failure
        env:
          GH_PAT_AUTOFIX: ${{ secrets.GH_PAT_AUTOFIX }}
          GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
          GH_REPO_NAME: ${{ secrets.GH_REPO_NAME }}
          PARENT_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'manual' }}
        run: |
          echo "═══ Failure Categorization ═══"
          # 2026-08-02: inline Python replaced by the Rust-native
          # `ai_workflow_tools categorize-failure` subcommand. Same contract:
          # identical pattern tables/priority, identical $GITHUB_OUTPUT keys
          # (category / is_fixable / should_run_autodebug), identical
          # data/failure_categorization.json schema. Built with the `network`
          # feature so it can pull the parent run's logs from the GitHub API.
          cargo run --quiet --features network --bin ai_workflow_tools -- categorize-failure

      - name: Display Failure Category
        run: |
          echo "═══ Failure Categorization Result ═══"
          echo "  Category:  ${{ steps.categorize-failure.outputs.category }}"
          echo "  Fixable:   ${{ steps.categorize-failure.outputs.is_fixable }}"
          if [ "${{ steps.categorize-failure.outputs.category }}" = "no_failure" ]; then
            echo "  ✅ Parent workflow succeeded — no repair needed"
          elif [ "${{ steps.categorize-failure.outputs.should_run_autodebug }}" = "true" ]; then
            echo "  🔧 Running AutoDebugEngine — internal AI diagnosis enabled"
          else
            echo "  ⏭ Skipping AutoDebugEngine — no repair needed"
          fi

      - name: Run AutoDebugEngine
        if: steps.categorize-failure.outputs.should_run_autodebug == 'true'
        env:
          GH_PAT_AUTOFIX: ${{ secrets.GH_PAT_AUTOFIX }}
          GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
          GH_REPO_NAME: ${{ secrets.GH_REPO_NAME }}
          CEREBRAS_API_KEY_1: ${{ secrets.CEREBRAS_API_KEY_1 }}
          CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
          CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
          PORTKEY_API_KEY_1: ${{ secrets.PORTKEY_API_KEY_1 }}
          PORTKEY_GATEWAY_URL: ${{ secrets.PORTKEY_GATEWAY_URL }}
          CF_ACCOUNT_ID_1: ${{ secrets.CF_ACCOUNT_ID_1 }}
          CF_API_TOKEN_1: ${{ secrets.CF_API_TOKEN_1 }}
          CF_AI_GATEWAY_URL_1: ${{ secrets.CF_AI_GATEWAY_URL_1 }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          CF_AI_GATEWAY_URL_2: ${{ secrets.CF_AI_GATEWAY_URL_2 }}
          CF_ACCOUNT_ID_3: ${{ secrets.CF_ACCOUNT_ID_3 }}
          CF_API_TOKEN_3: ${{ secrets.CF_API_TOKEN_3 }}
          CF_AI_GATEWAY_URL_3: ${{ secrets.CF_AI_GATEWAY_URL_3 }}
          CF_ACCOUNT_ID_4: ${{ secrets.CF_ACCOUNT_ID_4 }}
          CF_API_TOKEN_4: ${{ secrets.CF_API_TOKEN_4 }}
          CF_AI_GATEWAY_URL_4: ${{ secrets.CF_AI_GATEWAY_URL_4 }}
          CF_ACCOUNT_ID_5: ${{ secrets.CF_ACCOUNT_ID_5 }}
          CF_API_TOKEN_5: ${{ secrets.CF_API_TOKEN_5 }}
          CF_AI_GATEWAY_URL_5: ${{ secrets.CF_AI_GATEWAY_URL_5 }}
          CF_ACCOUNT_ID_6: ${{ secrets.CF_ACCOUNT_ID_6 }}
          CF_API_TOKEN_6: ${{ secrets.CF_API_TOKEN_6 }}
          CF_ACCOUNT_ID_7: ${{ secrets.CF_ACCOUNT_ID_7 }}
          CF_API_TOKEN_7: ${{ secrets.CF_API_TOKEN_7 }}
          CF_AI_GATEWAY_URL_7: ${{ secrets.CF_AI_GATEWAY_URL_7 }}
          CF_ACCOUNT_ID_8: ${{ secrets.CF_ACCOUNT_ID_8 }}
          CF_API_TOKEN_8: ${{ secrets.CF_API_TOKEN_8 }}
          CF_AI_GATEWAY_URL_8: ${{ secrets.CF_AI_GATEWAY_URL_8 }}
          CF_ACCOUNT_ID_9: ${{ secrets.CF_ACCOUNT_ID_9 }}
          CF_API_TOKEN_9: ${{ secrets.CF_API_TOKEN_9 }}
          CF_AI_GATEWAY_URL_9: ${{ secrets.CF_AI_GATEWAY_URL_9 }}
          CF_ACCOUNT_ID_10: ${{ secrets.CF_ACCOUNT_ID_10 }}
          CF_API_TOKEN_10: ${{ secrets.CF_API_TOKEN_10 }}
          CF_AI_GATEWAY_URL_10: ${{ secrets.CF_AI_GATEWAY_URL_10 }}
          CF_ACCOUNT_ID_11: ${{ secrets.CF_ACCOUNT_ID_11 }}
          CF_API_TOKEN_11: ${{ secrets.CF_API_TOKEN_11 }}
          CF_AI_GATEWAY_URL_11: ${{ secrets.CF_AI_GATEWAY_URL_11 }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          cargo run --quiet --bin auto_debug -- \
            "${{ github.event.workflow_run.name || github.workflow }}" \
            "${{ github.event.workflow_run.id || github.run_id }}" \
            --output data/auto_debug_report.json \
          || true

      - name: Skip AutoDebug (No Failure)
        if: steps.categorize-failure.outputs.should_run_autodebug == 'false'
        run: |
          echo "⏭ AutoDebugEngine SKIPPED"
          if [ "${{ steps.categorize-failure.outputs.category }}" = "no_failure" ]; then
            echo "Parent workflow completed successfully — no automated patch needed"
          else
            echo "Failure category '${{ steps.categorize-failure.outputs.category }}' is transient — will self-resolve"
          fi
          echo "No automated patch will be applied"

      - name: Report Outcome
        if: always()
        run: |
          echo "Auto-debug completed for: ${{ github.event.workflow_run.name || github.workflow }}"
          echo "Original run ID: ${{ github.event.workflow_run.id || github.run_id }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion || 'manual' }}"
          echo "Failure category: ${{ steps.categorize-failure.outputs.category }}"
          echo "Was fixable: ${{ steps.categorize-failure.outputs.is_fixable }}"
          echo "AutoDebug executed: ${{ steps.categorize-failure.outputs.should_run_autodebug }}"

      - name: Upload Categorization Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: failure-categorization-${{ github.run_id }}
          path: |
            data/failure_categorization.json
            data/whole_run_diagnostics.json
          retention-days: 7
          if-no-files-found: ignore

  # NOTE (consolidation, 2026-08-01): rust-parity-gate + cleanup removed from
  # here for the same reason as ai_gateway_health_check.yml — rust fmt/
  # clippy/test now runs once, in main-ci.yml, on every push/PR; cleanup
  # already self-schedules every 6h independently.

  workspace-diagnostics:
    name: Workspace Self-Heal Diagnostics
    # MERGED from self-heal.yml (2026-08-01). Original condition, unchanged:
    # always run on schedule/push; on workflow_run, only when the upstream
    # workflow actually failed.
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.name != github.workflow)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bootstrap environment defaults
        run: |
          set -euo pipefail
          bash scripts/github_actions_env_bootstrap.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'stable'
          components: rustfmt, clippy

      # FIX (was: hardcoded `powershell` on ubuntu-latest — `powershell` is
      # the Windows-only binary and does not exist on Linux runners; this is
      # the exact pattern the Rust validate_workflows binary flags by name as the
      # "incident #73 / Exit-127" class, and that
      # ZERO_ERROR_ENGINEERING_PROMPT.md lists as a rejected anti-pattern.
      # The original .\\scripts\\self_heal.ps1 backslash path also does not
      # resolve on Linux even where pwsh is present. scripts/self_heal.sh is
      # the pre-existing Linux-native twin of self_heal.ps1 — same
      # fmt/clippy/audit/test validation, same diagnostics/<timestamp>/
      # output layout — so this is a same-behavior fix, not a new script.)
      - name: Ensure self-heal script is present
        run: |
          set -euo pipefail
          test -f scripts/self_heal.sh || { echo "::error::Missing scripts/self_heal.sh"; exit 1; }

      - name: Run self-heal diagnostics (bash)
        run: bash scripts/self_heal.sh
        continue-on-error: true

      - name: Collect diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: self-heal-diagnostics-${{ github.run_id }}
          path: diagnostics/
          retention-days: 7
          if-no-files-found: ignore
