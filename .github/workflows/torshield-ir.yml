  scrape-and-test-finalize:
    name: scrape-and-test (finalize)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
    - scrape-and-test
    - analytics-ml-zig
    - analytics-scoring
    - analytics-ech
    - analytics-nin-advanced
    - analytics-nin
    - analytics-static
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Bootstrap environment defaults
      run: |
        set -euo pipefail
        bash scripts/github_actions_env_bootstrap.sh

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 'stable'

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
         # Scope the cache to the FULL workspace: any crate manifest or
          # lockfile change invalidates the key. Hashing only the root
          # 'Cargo.toml'/'Cargo.lock' missed member manifests under crates/,
          # bridge-probe/ and rust/, so an unchanged lockfile with a changed
          # member manifest silently reused a stale compiled target.
        key: ${{ runner.os }}-cargo-pipeline-${{ hashFiles('**/Cargo.toml', 
          '**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-pipeline-
          ${{ runner.os }}-cargo-

    - uses: actions/download-artifact@v8
      with:
        name: bridge-snapshot
        path: snapshot
    - uses: actions/download-artifact@v8
      with:
        name: analytics-ml-zig
        path: analytics/ml-zig
    - uses: actions/download-artifact@v8
      with:
        name: analytics-ech
        path: analytics/ech
    - uses: actions/download-artifact@v8
      with:
        name: analytics-nin-advanced
        path: analytics/nin-advanced
    - uses: actions/download-artifact@v8
      with:
        name: analytics-static
        path: analytics/static
    - uses: actions/download-artifact@v8
      with:
        name: analytics-scoring
        path: analytics/scoring
    - uses: actions/download-artifact@v8
      with:
        name: analytics-nin
        path: analytics/nin
    - name: Merge parallel stage outputs (deterministic precedence)
      run: "\nset -euo pipefail\necho \"Restoring snapshot baseline\"\ncp -a snapshot/.
        .\necho \"Merging analytics outputs in precedence order\"\n# ml-zig first
        (updates data/latest-results.json + model/transport/zig files)\ncp -a analytics/ml-zig/.
        . || true\ncp -a analytics/ech/. . || true\n# nin-advanced BEFORE nin so 8p's
        final nin_cut_bridges.txt / nin_eligible /\n# bridge/iran_likely_working_nin.txt
        / iran_cut_pack.txt win where they overlap.\ncp -a analytics/nin-advanced/.
        . || true\ncp -a analytics/static/. . || true\n# scoring last: anti_ai_dpi_report,
        iran_siam_report, smart_iran_results,\n# ja3_rotation_plan (after 8n->8r),
        and all SIAM exports are authoritative.\ncp -a analytics/scoring/. . || true\n\
        # nin LAST so the 8p classifier outputs (bridge/iran_likely_working_nin.txt,\n\
        # export/nin_cut_bridges.txt, data/nin_eligible.json) are authoritative.\n\
        cp -a analytics/nin/. . || true\necho \"Merge complete\"\n"
    - name: Stage 8s — Iran Anti-DPI Elite fusion (AI-consensus pack)
      continue-on-error: true
      timeout-minutes: 5
      env:
        AI_ANTI_DPI_TOP_N: ${{ vars.AI_ANTI_DPI_TOP_N }}
      run: |
        set -euo pipefail
        bash scripts/build_iran_anti_dpi_elite.sh
        test -s export/iran_anti_dpi_elite.txt || { echo "::error::Stage 8s produced no elite pack"; exit 1; }
        echo "✅ Iran Anti-DPI Elite pack: $(wc -l < export/iran_anti_dpi_elite.txt) bridges"

      # Stage 8t produces the two auxiliary manifests the
      # bridge-intelligence-report upload has always advertised but no stage
      # ever wrote: data/pq_bridge_scores.json (post-quantum safety per
      # bridge, mapped from Stage 8e transport scores onto the Stage 8i pool)
      # and export/nin_recommended_transport.json (per-regime recommended
      # transports with evidence counts from the NIN-cut artifacts). Both are
      # deterministic, regenerated every run, advisory.
    - name: Stage 8t — PQ bridge scores + NIN recommended-transport manifests
      continue-on-error: true
      timeout-minutes: 5
      run: |
        set -euo pipefail
        bash scripts/build_pq_bridge_scores.sh
        test -s data/pq_bridge_scores.json || { echo "::error::Stage 8t produced no pq_bridge_scores.json"; exit 1; }
        bash scripts/build_nin_recommended_transport.sh
        test -s export/nin_recommended_transport.json || { echo "::error::Stage 8t produced no nin_recommended_transport.json"; exit 1; }

      # Dual persist, one verified payload: the Rust publisher atomically
      # rewrites ALL 55 public bridge/ files, re-renders README.md from the
      # verified snapshot, byte-verifies tor_bridges.zip, and then delivers
      # that exact ZIP to Telegram — GitHub and Telegram always store the
      # same bytes. Delivery defaults to ON; the bash guard below degrades
      # gracefully to repo-only persistence when secrets are absent or the
      # run is a pull_request preview (Stage 11's commit is skipped there too).
    - name: Stage 9 — Dual persist ALL bridge/ files + README.md + Telegram 
        archive
      timeout-minutes: 8
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Precedence (resolved in bash below, where 'false' stays a real
          # string): dispatch input > TELEGRAM_AUTO_UPLOAD repo variable > ON.
        TELEGRAM_INPUT: ${{ github.event.inputs.upload_to_telegram }}
        TELEGRAM_REPO_VAR: ${{ vars.TELEGRAM_AUTO_UPLOAD }}
        REPO_URL: https://raw.githubusercontent.com/${{ github.repository 
          }}/refs/heads/${{ github.ref_name }}
      run: |
        set -euo pipefail
        cargo run --quiet --bin pipeline -- --stage results --report data/results_writer_report.json
        UPLOAD="$(printf '%s' "${TELEGRAM_INPUT:-${TELEGRAM_REPO_VAR:-true}}" | tr '[:upper:]' '[:lower:]')"
        if [ "$UPLOAD" = "true" ] && [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
          echo "pull_request run — publication preview only; Telegram delivery deferred"
          echo "to the main-branch run (mirrors the skipped Stage 11 git commit)."
          UPLOAD=false
        fi
        if [ "$UPLOAD" = "true" ] && { [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; }; then
          echo "::warning::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID not configured — Telegram"
          echo "::warning::delivery skipped; the identical verified payload is still"
          echo "::warning::committed to bridge/ + README.md by Stage 11."
          UPLOAD=false
        fi
        echo "Telegram dual-persist mode: $UPLOAD"
        cargo run --quiet --features network --bin sync_bridge_outputs -- \
          --bridge-dir bridge \
          --readme README.md \
          --repo-url "$REPO_URL" \
          --retries 3 \
          --telegram-upload "$UPLOAD"
        echo "═══ README.md re-rendered from the verified snapshot ═══"
        sed -n '1,8p' README.md

      # Real self-test of the publication: re-validates all 55 required files,
      # the JSON shapes, every SHA-256 entry in telegram_manifest.json, and
      # byte-compare each tor_bridges.zip entry against its repository
      # counterpart. Any drift fails the run before anything is committed.
    - name: Stage 9b — Verify publication contract (all 55 files, byte-identical
        ZIP)
      timeout-minutes: 3
      run: |
        set -euo pipefail
        cargo run --quiet --bin sync_bridge_outputs -- \
          --bridge-dir bridge \
          --verify-only
        echo "✅ Publication contract verified: every required file present,"
        echo "   manifest hashes match, archive contents byte-identical."

      # Post-execution FAILSAFE — positioned immediately before Stage 10
      # (per directive §4: FAILSAFE must run after every scraper/tester/export
      # stage and right before publication). Two layers of guarantee:
      #
      #   1. The Rust failsafe_bridges engine force-populates every missing or
      #      0-byte transport *.txt from the compiled-in static fallback lines
      #      of its family, and re-initialises any empty *.json to a valid [].
      #   2. The explicit audit loop below re-checks every projection that has
      #      a valid static fallback. WebTunnel is intentionally omitted:
      #      URL-only metadata cannot be converted into a client bridge, so its
      #      projection may remain empty when no literal endpoint exists.
      #      Empty JSON files are still repaired to valid [] documents.
      #
      #      Stage 10 permits an empty WebTunnel projection and reports it as
      #      an advisory warning rather than fabricating a bridge line.

    - name: FAILSAFE — post-execution pre-publication guarantee (Rust port)
      timeout-minutes: 3
      run: |
        set -euo pipefail
        cargo run --quiet --bin failsafe_bridges
        # ── Explicit audit + last-resort repopulation for valid fallbacks ──
        mkdir -p bridge
        FALLBACK_SRC="bridge/iran_likely_working_all.txt"
        REPOP=0
        for glob in 'bridge/obfs4*.txt' 'bridge/vanilla*.txt' \
                    'bridge/conjure*.txt' 'bridge/meek*.txt' \
                    'bridge/meek-azure*.txt' 'bridge/snowflake*.txt'; do
          for f in $glob; do
            [ -e "$f" ] || continue
            if [ "$(stat -c %s "$f" 2>/dev/null || echo 0)" -eq 0 ]; then
              echo "FAILSAFE: $f is 0 bytes — writing fallback line"
              if [ -s "$FALLBACK_SRC" ]; then
                cp "$FALLBACK_SRC" "$f"
              else
                echo "::error::Rust FAILSAFE produced no valid fallback source; refusing to invent a placeholder bridge"
                exit 1
              fi
              REPOP=$((REPOP + 1))
            fi
          done
        done
        # Any empty *.json output is re-initialised to a valid empty array.
        for f in bridge/*.json; do
          [ -e "$f" ] || continue
          if [ "$(stat -c %s "$f" 2>/dev/null || echo 0)" -eq 0 ]; then
            echo "FAILSAFE: $f is 0 bytes — writing valid []"
            printf '[]\n' > "$f"
          fi
        done
        echo "✅ FAILSAFE complete: repopulated $REPOP transport .txt file(s); every *.json is a valid document."

    - name: Stage 10 — Full bridge/ inventory (all 55 required files)
      timeout-minutes: 3
      run: |
        set -euo pipefail
        REQUIRED="bridge_history.json bridge_list_for_testing.json bridge_scores.json \
          conjure.txt conjure_72h.txt conjure_tested.txt \
          iran_blocked.txt iran_likely_working_all.txt iran_likely_working_nin.txt \
          iran_likely_working_obfs4.txt iran_likely_working_snowflake.txt \
          iran_likely_working_vanilla.txt iran_likely_working_webtunnel.txt \
          iran_results.json \
          meek-azure.txt meek-azure_72h.txt meek-azure_tested.txt \
          meek_lite.txt meek_lite_72h.txt meek_lite_72h_ipv6.txt \
          meek_lite_ipv6.txt meek_lite_ipv6_tested.txt meek_lite_tested.txt \
          obfs4.txt obfs4_72h.txt obfs4_72h_ipv6.txt \
          obfs4_ipv6.txt obfs4_ipv6_72h.txt obfs4_ipv6_tested.txt obfs4_tested.txt \
          snowflake.txt snowflake_72h.txt snowflake_72h_ipv6.txt \
          snowflake_ipv6.txt snowflake_ipv6_tested.txt snowflake_tested.txt \
          telegram_manifest.json \
          tested_global_obfs4.txt tested_global_vanilla.txt tested_global_webtunnel.txt \
          tor_bridges.zip \
          vanilla.txt vanilla_72h.txt vanilla_72h_ipv6.txt \
          vanilla_ipv6.txt vanilla_ipv6_72h.txt vanilla_ipv6_tested.txt vanilla_tested.txt \
          webtunnel.txt webtunnel_72h.txt webtunnel_72h_ipv6.txt \
          webtunnel_ipv6.txt webtunnel_ipv6_72h.txt webtunnel_ipv6_tested.txt webtunnel_tested.txt"
        echo "═══ Full bridge/ publication inventory ═══"
        MISSING=0
        TOTAL=0
        for name in $REQUIRED; do
          TOTAL=$((TOTAL + 1))
          f="bridge/$name"
          if [ ! -f "$f" ]; then
            printf '❌ %-42s MISSING\n' "$name"
            MISSING=$((MISSING + 1))
            continue
          fi
          size=$(stat -c %s "$f")
          case "$name" in
            *.txt)
              count=$(grep -c . "$f" 2>/dev/null) || count=0
              count=${count//[$'\t\r\n ']/}
              count=${count:-0}
              printf '✅ %-42s %8d lines (%d bytes)\n' "$name" "$count" "$size"
              ;;
            *.json) printf '✅ %-42s   json   (%d bytes)\n' "$name" "$size" ;;
            *.zip)  printf '✅ %-42s   zip    (%d bytes)\n' "$name" "$size" ;;
          esac
        done
        echo "═══════════════════════════════════════════"
        if [ "$MISSING" -gt 0 ]; then
          echo "::error::$MISSING of $TOTAL required bridge/ file(s) missing — publication contract broken"
          exit 1
        fi
        echo "✅ All $TOTAL required bridge/ files present."
        ALL_OK=true
        for req in iran_likely_working_all.txt iran_likely_working_obfs4.txt \
                   iran_likely_working_webtunnel.txt iran_likely_working_snowflake.txt \
                   iran_likely_working_nin.txt; do
          fpath="bridge/$req"
          count=$(grep -c . "$fpath" 2>/dev/null) || count=0
          count=${count//[$'\t\r\n ']/}
          count=${count:-0}
          if [ "$count" -gt 0 ]; then
            echo "✅ $req: $count bridges"
          else
            echo "⚠️  $req: 0 bridges"
            ALL_OK=false
          fi
        done
        if [ "$ALL_OK" = "true" ]; then
          echo "✅ All advisory bridge sets populated."
        else
          echo "⚠️  Some advisory sets empty — check scraper/tester logs above."
        fi

      # Stage 8p2 rebuilds the USER-FACING export/iran_cut_pack.txt (the file
      # README points Iranian users to during a شبکه ملی / national internet
      # cut) from every NIN-cut artifact produced so far — nin_eligible.json
      # (8d), iran_likely_working_nin.txt + nin_cut_bridges.txt (8p),
      # iran_nin_pack.txt (8d2), nin_cut_survivable.txt (8k). Earlier stages
      # can overwrite the pack with a strict (often empty) filter; this
      # finalizer guarantees the published pack always carries the full
      # survivable candidate set. Deterministic; advisory (runner-side).
      #
      # This MUST run after Stage 9 (dual-persist bridge/ files), Stage 9b
      # and the FAILSAFE step: those stages rewrite the 55 committed bridge/
      # projection files (including bridge/iran_likely_working_nin.txt) from
      # the final verified snapshot. Running the finalizer before them
      # published a cut-pack built from an intermediate bridge set, which the
      # invariant audit (C11 cutpack-freshness) then correctly rejected.
    - name: Stage 8p2 — NIN cut-pack finalizer (user-facing iran_cut_pack.txt)
      continue-on-error: true
      timeout-minutes: 5
      run: |
        set -euo pipefail
        bash scripts/build_iran_cut_pack.sh
        echo "✅ Iran internet-cut pack: $(grep -c '^[^#]' export/iran_cut_pack.txt) bridges"

      # Commits are only possible from first-party push/schedule/dispatch
      # runs on the default branch — pull requests (especially forks) have a
      # read-only token and a detached HEAD, so the step is skipped there.
    - name: Stage 11 — Commit and push
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      timeout-minutes: 5
      run: |
        set -euo pipefail
        git config --global user.name  "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git pull origin main --rebase --autostash
        # Stage ONLY paths that exist in the tree. A single missing
        # pathspec (e.g. core/, which is absent) makes `git add` fail
        # atomically and stage NOTHING — hidden by the old `|| true`,
        # that silently turned this step into a permanent no-op and
        # blocked every bridge/ + README.md commit for days.
        PATHS="bridge/ data/ docs/ export/ README.md go.mod go.sum \
               src/bin/sync_bridge_outputs.rs cmd/ internal/ zig-scanner/ \
               generate_quantum_project.sh scripts/"
        for opt in core bridge-probe/Cargo.lock; do
          [ -e "$opt" ] && PATHS="$PATHS $opt"
        done
        echo "Staging paths: $PATHS"
        git add $PATHS
        git status --porcelain -- bridge/ README.md | head -20
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          WORKING=$(grep -c . bridge/iran_likely_working_all.txt 2>/dev/null || echo 0)
          WORKING=${WORKING//[$'\t\r\n ']/}
          git commit -m "chore: dual-persist bridge/ + README.md (advisory working: ${WORKING:-0}, run ${GITHUB_RUN_ID}) [skip ci]"
          git push
        fi

    - uses: actions/upload-artifact@v6
      if: always()
      with:
        name: bridge-intelligence-report
        path: |
          data/latest-results.json
          data/pt_results.json
          data/best_transports.json
          data/transport_weight_history.json
          data/quantum_safe_report.json
          data/warp_status.json
          data/dpi_intelligence.json
          data/next_gen_bridges.json
          data/ech_report.json
          data/nin_advanced_report.json
          data/anti_ai_dpi_report.json
          data/iran_siam_report.json
          data/smart_iran_results.json
          docs/iran-bridge-status.md
          docs/iran-siam-analysis.md
          bridge/iran_results.json
          export/iran_cut_pack.txt
          export/iran_phantom_bridges.txt
          export/iran_stealth_bridges.txt
          export/iran_siam_best_bridges.txt
          export/warp_bridges.txt
          export/ech_top_bridges.txt
          export/nin_cut_bridges.txt
          export/anti_ai_dpi_bridges.txt
          export/iran_anti_dpi_elite.txt
          export/iran_anti_dpi_elite.json
          data/nin_cut_report.json
          data/reality_report.json
          data/ai_consensus_report.json
          data/pq_bridge_scores.json
          data/ja3_rotation_plan.json
          data/ja3_rotation_report.md
          data/ct_monitor_report.json
          data/zig_scan.json
          data/collector_yield_report.json
          data/collector_yield_summary.md
          data/collector_yield_history.json
          data/failsafe_activations.json
          diagnostics/torshield_ir_self_heal.json
          export/nin_cut_survivable.txt
          export/reality_configs.json
          export/nin_recommended_transport.json
          export/ct_flagged_domains.txt
          export/ct_clean_bridges.txt
          docs/ebpf_xdp_blueprint.md
        retention-days: 7
        if-no-files-found: ignore

