# ══════════════════════════════════════════════════════════════════════════
# TorShield-IR Bridge Intelligence — RUST-NATIVE EDITION (2026-08-02)
#
# FIX: this workflow previously declared ONLY `schedule` + `workflow_dispatch`
# triggers, so `git push` and pull requests never started a run (the workflow
# appeared "dead" in the Actions tab). `push` (all branches) and
# `pull_request` triggers have been added.
#
# Python→Rust migration: the last 0.4% of Python has been ported to Rust.
# Every inline Python heredoc and every `actions/setup-python` / `pip` step
# has been replaced by a Rust binary built from this workspace:
#   _yaml_lint.py              -> quality_gate yaml-lint      (src/quality_gate.rs)
#   _validate_requirements.py  -> quality_gate requirements   (src/quality_gate.rs)
#   py_compile sweep           -> quality_gate py-check       (src/quality_gate.rs)
#   _quality_report.py         -> quality_gate report         (src/quality_gate.rs)
#   _failsafe_bridges.py       -> failsafe_bridges            (src/failsafe_bridges.rs)
#   _vercel_cleanup.py         -> vercel_cleanup              (src/vercel_cleanup.rs)
#   scripts/ai_bridge_reranker.py (retired) -> ai_bridge_reranker binary
#
# build-go: the `iran_tester` and `probe_scheduler` binaries are now built
# from source by the scrape-and-test job (via `go build`) before Stages 2
# and 3 every run — no longer trusting committed pre-built binaries. Go
# source vetting/tests remain fully covered by main-ci.yml.
#
# NOTHING ELSE WAS DROPPED: every pipeline stage (0→11), every artifact,
# every output path (bridge/, data/, export/, docs/), the Telegram sync,
# the release packaging, and the cleanup call are preserved.
#
# DUAL PUBLICATION CONTRACT (bridge/ + README.md + Telegram, one verified payload):
#   Stage 9 rebuilds and verifies ALL 55 public files in bridge/ — every
#   transport .txt plus its _72h/_ipv6/_72h_ipv6/_tested variants, all
#   iran_likely_working_* advisory sets, bridge_history.json,
#   bridge_list_for_testing.json, bridge_scores.json, iran_results.json,
#   telegram_manifest.json and tor_bridges.zip — via the Rust publisher
#   (src/bridge_publication.rs, driven by sync_bridge_outputs). The same
#   step re-renders README.md from the verified snapshot and, when the
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are configured, delivers
#   the byte-identical verified tor_bridges.zip to Telegram inside the very
#   same run whose Stage 11 commits the payload to git ("dual persist":
#   GitHub and Telegram always receive the same bytes).
#   Telegram delivery is ON by default (schedule/push/dispatch). It can be
#   disabled per-run with the upload_to_telegram=false dispatch input or
#   repo-wide by setting the TELEGRAM_AUTO_UPLOAD repository variable to
#   false. Runs without the secrets configured skip delivery with a warning
#   instead of failing, and pull_request runs never deliver (preview only,
#   mirroring the skipped Stage 11 git commit).
#   Stage 9b re-verifies the complete contract with --verify-only (JSON
#   shapes, every SHA-256 manifest entry, byte-identical ZIP contents), and
#   Stage 10 inventories all 55 files and fails the run if any is missing —
#   a broken publication can never reach the commit step.
# ══════════════════════════════════════════════════════════════════════════
name: TorShield-IR Bridge Intelligence

'on':
  push:
    branches: ["**"]
  pull_request:
  schedule:
  - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      upload_to_telegram:
        # Default ON: scheduled/push/dispatch runs dual-persist the verified
        # tor_bridges.zip to Telegram (same bytes as the git commit). Pick
        # 'false' for a repo-only run, or set the TELEGRAM_AUTO_UPLOAD
        # repository variable to false to disable delivery repo-wide.
        description: 'Upload the verified bridge package to Telegram (requires TELEGRAM_BOT_TOKEN
          + TELEGRAM_CHAT_ID secrets)'
        required: false
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
      bridge_file:
        # Merged from ai_bridge_reranker.yml's own workflow_dispatch.
        description: 'AI re-rank job: path to the bridge JSON file to re-rank'
        required: false
        default: 'bridge/iran_results.json'
      rerank_only:
        # Merged from ai_bridge_reranker.yml. Lets you re-run just the
        # AI re-rank job (against bridge_file above, or whatever
        # bridge/iran_results.json is already committed) without repeating
        # the full ~50-minute collection pipeline. quality-gate, build-rust,
        # rust-parity-tests and scrape-and-test all skip themselves when
        # this is true; ai-rerank runs regardless.
        description: 'Skip collection — only run the AI re-rank job'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_NO_WARNINGS: '1'

permissions:
  actions: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  quality-gate:
    # Skips on a rerank_only dispatch (see workflow_dispatch.inputs above).
    # Python tooling (py_compile / PyYAML lint / mypy / ruff / pytest) is
    # retired: the tree is 100% Rust now, and `cargo fmt`/`clippy`/`test` in
    # the rust-parity-tests job below are the strict superset of those gates.
    name: "Quality Gate"
    if: github.event_name != 'workflow_dispatch' || inputs.rerank_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v5

    - name: Bootstrap environment defaults
      run: |
        set -euo pipefail
        bash scripts/github_actions_env_bootstrap.sh

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 'stable'

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-gate-${{ hashFiles('Cargo.toml', 
          'Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Build quality-gate tooling (Rust)
      run: |
        set -euo pipefail
        cargo build --bin quality_gate --bin security_scan --bin validate_workflows

      # ── Python-free tree check (replaces the py_compile sweep) ────────────
    - name: Python-free gate (py-check)
      run: cargo run --quiet --bin quality_gate -- py-check .

      # ── YAML linting (replaces the PyYAML heredoc) ────────────────────────
    - name: YAML linting
      run: cargo run --quiet --bin quality_gate -- yaml-lint .

      # ── Workflow structural validation (port of validate_workflows.py) ────
    - name: Validate GitHub Actions workflows (structure + platform-shell rules)
      run: cargo run --quiet --bin validate_workflows -- .github/workflows

      # ── Requirements.txt validation (unchanged schema, Rust engine) ───────
    - name: Validate requirements.txt
      run: cargo run --quiet --bin quality_gate -- requirements requirements.txt

      # ── Secrets static scan (port of security_scan.py) ────────────────────
    - name: Security scan (dangerous sinks + hard-coded credentials)
      continue-on-error: true
      run: cargo run --quiet --bin security_scan -- .

      # ── Secret presence check (pure bash — unchanged) ─────────────────────
    - name: Secret presence check
      env:
        CEREBRAS_API_KEY_1: ${{ secrets.CEREBRAS_API_KEY_1 }}
        PORTKEY_API_KEY_1: ${{ secrets.PORTKEY_API_KEY_1 }}
        CF_ACCOUNT_ID_1: ${{ secrets.CF_ACCOUNT_ID_1 }}
        CF_API_TOKEN_1: ${{ secrets.CF_API_TOKEN_1 }}
        GH_PAT_AUTOFIX: ${{ secrets.GH_PAT_AUTOFIX }}
      run: |
        echo "═══ Secret Presence Check ═══"
        SECRETS_FOUND=0
        SECRETS_TOTAL=5
        for var in CEREBRAS_API_KEY_1 PORTKEY_API_KEY_1 CF_ACCOUNT_ID_1 CF_API_TOKEN_1 GH_PAT_AUTOFIX; do
          eval "VAL=\${$var:-}"
          if [ -n "$VAL" ]; then
            echo "  ✓ $var is set"
            SECRETS_FOUND=$((SECRETS_FOUND + 1))
          else
            echo "  ✗ $var is EMPTY"
          fi
        done
        echo "  Secrets found: ${SECRETS_FOUND}/${SECRETS_TOTAL}"
        if [ "$SECRETS_FOUND" -eq 0 ]; then
          echo "::warning::No optional AI/provider secrets configured; continuing with offline Rust-native checks."
        fi

      # ── Generate quality report (same data/quality_report.json schema) ────
    - name: Generate quality report
      if: always()
      run: cargo run --quiet --bin quality_gate -- report .

    - name: Upload quality report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: quality-report-${{ github.run_id }}
        path: data/quality_report.json
        retention-days: 7
        if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────────
  build-rust:
    # Builds the bridge-probe pluggable-transport prober (unchanged).
    if: github.event_name != 'workflow_dispatch' || inputs.rerank_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5

    - name: Bootstrap environment defaults
      run: |
        set -euo pipefail
        bash scripts/github_actions_env_bootstrap.sh

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 'stable'
        components: rustfmt, clippy

      # Cargo.lock is kept deterministic so the cache key below is stable.
    - name: Generate Cargo.lock (required for deterministic builds + cache)
      working-directory: bridge-probe
      run: |
        set -euo pipefail
        if [ ! -f Cargo.lock ]; then
          cargo generate-lockfile
          echo "Cargo.lock generated"
        else
          echo "Cargo.lock already present"
        fi

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          bridge-probe/target
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('bridge-probe/Cargo.lock', 
          'bridge-probe/Cargo.toml', 'Cargo.toml', 'Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Build bridge-probe (release)
      working-directory: bridge-probe
      env:
        RUSTFLAGS: "-D warnings"
      run: |
        set -euo pipefail
        cargo build --release 2>&1

    - name: Stage bridge-probe artifact
      run: |
        set -euo pipefail
        rm -rf artifact-bin
        mkdir -p artifact-bin
        if [ -x bridge-probe/target/release/bridge-probe ]; then
          cp bridge-probe/target/release/bridge-probe artifact-bin/bridge-probe
        elif [ -x target/release/bridge-probe ]; then
          cp target/release/bridge-probe artifact-bin/bridge-probe
        else
          echo "::error::bridge-probe binary not found in member or workspace target directory"
          find . -path '*/release/bridge-probe' -type f -print || true
          exit 1
        fi
        cp bridge-probe/Cargo.lock artifact-bin/Cargo.lock

    - uses: actions/upload-artifact@v6
      with:
        name: bridge-probe-bin
        path: artifact-bin/
        retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  rust-parity-tests:
    # Pure Rust gate: fmt + clippy -D warnings + the full cargo test suite
    # (686+ module tests and all integration contracts). The Python originals
    # are retired, so no Python runtime is needed here any more.
    if: github.event_name != 'workflow_dispatch' || inputs.rerank_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v5

    - name: Bootstrap environment defaults
      run: |
        set -euo pipefail
        bash scripts/github_actions_env_bootstrap.sh

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 'stable'
        components: rustfmt, clippy

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-parity-${{ hashFiles('Cargo.toml', 
          'Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Clippy (all features, deny warnings)
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Full Rust test suite (all features)
      run: cargo test --workspace --all-targets --all-features

    - name: Release build verification
      run: cargo build --workspace --release

  # ────────────────────────────────────────────────────────────────────────────
  scrape-and-test:
    # Full bridge collection + testing pipeline. All stages preserved.
    # iran_tester / probe_scheduler are built from source via `go build` before
    # Stages 2 and 3 every run — no longer trusting committed pre-built binaries.
    # NOTE: timeout raised from 50→90 min because the full pipeline
    # (collect → test → probe → nin-advanced → scoring → export) needs
    # ~74+ min; the old 50-min budget killed Stage 8h before it finished.
    runs-on: ubuntu-latest
    needs: [quality-gate, build-rust, rust-parity-tests]
    timeout-minutes: 90
    name: scrape-and-test (core)
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Bootstrap environment defaults
      run: |
        set -euo pipefail
        bash scripts/github_actions_env_bootstrap.sh

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 'stable'

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
         # Scope the cache to the FULL workspace: any crate manifest or
          # lockfile change invalidates the key. Hashing only the root
          # 'Cargo.toml'/'Cargo.lock' missed member manifests under crates/,
          # bridge-probe/ and rust/, so an unchanged lockfile with a changed
          # member manifest silently reused a stale compiled target.
        key: ${{ runner.os }}-cargo-pipeline-${{ hashFiles('**/Cargo.toml', 
          '**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-pipeline-
          ${{ runner.os }}-cargo-

    - name: Remove Vercel secrets (cleanup — additive step, Rust port)
      env:
        GH_PAT_AUTOFIX: ${{ secrets.GH_PAT_AUTOFIX }}
        GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
        GH_REPO_NAME: ${{ secrets.GH_REPO_NAME }}
      run: cargo run --quiet --features network --bin vercel_cleanup

      # IPv4 obfs4 verification is protocol-level: the collector starts this
      # client and confirms SOCKS CONNECT after the obfs4 layer. Package names
      # vary between Ubuntu releases, so absence is explicitly safe and the
      # collector applies its OBFS4_VERIFY_MIN_FRACTION TCP fallback.
    - name: Install obfs4proxy / lyrebird for protocol verification
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y obfs4proxy || true
        if ! command -v obfs4proxy >/dev/null 2>&1; then
          echo "obfs4proxy unavailable; attempting lyrebird"
          sudo apt-get install -y lyrebird || echo "lyrebird unavailable; collector will use documented safe fallback"
        fi

    - name: Build unified collector (release)
      run: cargo build --release --bin tor-bridges-collector

    - name: Stage 00 — Autonomous self-heal pipeline diagnostics
      timeout-minutes: 5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
        CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: cargo run --quiet --bin self_heal -- --heal --strict --output 
        diagnostics/torshield_ir_self_heal.json

    - uses: actions/download-artifact@v8
      with:
        name: bridge-probe-bin
        path: downloaded-bin/

    - name: Restore bridge-probe artifact
      run: |
        set -euo pipefail
        mkdir -p bridge-probe/target/release
        cp downloaded-bin/bridge-probe bridge-probe/target/release/bridge-probe

    - name: Set executable permissions
      run: |
        set -euo pipefail
        for file in \
          bridge-probe/target/release/bridge-probe; do
          if ! test -f "$file"; then
            echo "::error::Missing expected executable: $file"
            find bridge-probe -maxdepth 5 -type f -print
            find . -maxdepth 2 -type f \( -name iran_tester -o -name probe_scheduler \) -print
            exit 1
          fi
          chmod +x "$file"
        done

      # High-volume seeding — runs BEFORE the collector stages to guarantee the
      # full 1500+ real-bridge pool is ingested. refresh_bridge_seed.sh fetches
      # fresh real Tor bridges from the public Delta-Kronecker mirror (via
      # api.github.com) and merges them into bridge/bridge_history.json, which
      # the publisher rebuilds every bridge/*.txt projection from. Non-fatal:
      # an unreachable mirror leaves the existing history untouched. Set the
      # BRIDGE_MIRRORS_REPO repository variable to override the mirror.
    - name: Stage 0s — High-volume bridge seeding (1500+ real bridges)
      continue-on-error: true
      timeout-minutes: 10
      env:
        BRIDGE_MIRRORS_REPO: ${{ vars.BRIDGE_MIRRORS_REPO }}
      run: |
        set -euo pipefail
        bash scripts/refresh_bridge_seed.sh
        echo "✅ Seeded the high-volume real-bridge pool into bridge_history.json"

    - name: Stage 0 — Direct scraper (bridges.torproject.org seed)
      continue-on-error: true
      timeout-minutes: 5
      run: cargo run --quiet --features network --bin scraper

      # One Rust entry point merges OnionHop.py's source/protocol behavior and
      # vip.py's history/README/ZIP/Telegram behavior. No Python collector is
      # invoked and no capability is duplicated in a second scraper stage.
    - name: Stage 0b — Unified OnionHop + VIP bridge collector
      continue-on-error: true
      timeout-minutes: 12
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_UPLOAD: ${{ secrets.TELEGRAM_UPLOAD }}
        RUST_LOG: info
      run: |
        set -euo pipefail
        DETECTED_WORKERS=$(( $(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4) * 8 ))
        [ "$DETECTED_WORKERS" -lt 16 ] && DETECTED_WORKERS=16
        [ "$DETECTED_WORKERS" -gt 512 ] && DETECTED_WORKERS=512
        ./target/release/tor-bridges-collector \
          --max-workers "${MAX_WORKERS:-$DETECTED_WORKERS}" \
          --max-test-per-list "${MAX_TEST_PER_LIST:-0}"

      # Kept as a separate broad-source enrichment pass: it consumes the
      # collector's output and contributes pipeline-specific sources, but no
      # longer duplicates legacy VIP collection/notification behavior.
    - name: Stage 0c — Broad source enrichment scraper
      continue-on-error: true
      timeout-minutes: 5
      run: cargo run --quiet --bin scraper

    - name: Stage 1 — Scraper (all sources)
      timeout-minutes: 10
      run: |
        set -euo pipefail
        cargo run --quiet --features network --bin scraper

    - name: FAILSAFE — ensure bridge files always have content (Rust port)
      timeout-minutes: 3
      run: |
        set -euo pipefail
        cargo run --quiet --bin failsafe_bridges

    - uses: actions/setup-go@v6
      with:
        go-version: '1.24'
        # Enable Go module + build-cache reuse across runs. go.sum is
        # intentionally empty (the Go tools use only stdlib), so a
        # go.sum-derived cache key would be a constant; key off the actual
        # dependency manifest instead.
        cache: true
        cache-dependency-path: go.mod

    - name: Build iran_tester and probe_scheduler from source
      run: |
        set -euo pipefail
        CGO_ENABLED=0 GOOS=linux go build -o iran_tester ./cmd/iran_tester/
        CGO_ENABLED=0 GOOS=linux go build -o probe_scheduler ./cmd/probe_scheduler/
        echo "✅ iran_tester and probe_scheduler built from source"

    - name: Stage 2 — iran_tester (TCP/ASN/OONI/CDN analysis)
      timeout-minutes: 12
      run: |
        set -euo pipefail
        ./iran_tester \
          --input  bridge/bridge_list_for_testing.json \
          --output bridge/iran_results.json \
          --workers 100 \
          --timeout 8s

      # probe_scheduler starts an HTTP server that never exits on its own:
      # `timeout 300` force-kills it after 5 min, the PID is captured for
      # the explicit cleanup step, and /tmp/sched_started marks liveness.
    - name: Stage 3 — probe_scheduler (RIPE Atlas + MOAT merge)
      continue-on-error: true
      timeout-minutes: 12
      env:
        RIPE_ATLAS_API_KEY: ${{ secrets.RIPE_ATLAS_API_KEY }}
      run: |
        timeout 300 ./probe_scheduler \
          --bridges data/iran_bridges.json \
          --port 8742 &
        SCHED_PID=$!
        echo "$SCHED_PID" > /tmp/probe_sched.pid
        echo "probe_scheduler PID=$SCHED_PID"
        touch /tmp/sched_started
        sleep 10

      # ── Stage 4-prep — Deploy probe relay Worker + smoke test ─────────────
      #
      # BEFORE the 1447-bridge batch, we:
      #   1. Deploy the probe-relay Cloudflare Worker (in case it drifted)
      #      using the dedicated CF_WORKER_ACCOUNT_ID / CF_WORKER_API_TOKEN
      #      secrets (NEVER the CF_ACCOUNT_ID_1..11 / CF_API_TOKEN_1..11
      #      slots, which belong to the AI Gateway provider rotation system).
      #   2. Run a live smoke-test curl to confirm the Worker is alive and
      #      returns 200 — fail loudly if it does not.
      #   3. If CF_WORKER_ACCOUNT_ID or PROBE_RELAY_URL is unset, skip
      #      Stage 4 cleanly (exit 0, logged as SKIPPED) rather than burning
      #      10+ minutes on guaranteed HTTP 404s.
    - name: Stage 4-prep — Deploy probe relay + live smoke test
      id: relay_prep
      env:
        PROBE_RELAY_URL: ${{ secrets.PROBE_RELAY_URL }}
        PROBE_RELAY_TOKEN: ${{ secrets.PROBE_RELAY_TOKEN }}
        CF_WORKER_ACCOUNT_ID: ${{ secrets.CF_WORKER_ACCOUNT_ID }}
        CF_WORKER_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
      run: |
        set -euo pipefail
        echo "═══ Stage 4-prep: Probe Relay Deployment + Smoke Test ═══"

        # ── Secret validation helper ───────────────────────────────
        # Validates each secret with three distinct failure modes:
        #   1. UNSET: the secret was never created (env var absent)
        #   2. EMPTY: secret exists but value is empty string or whitespace
        #   3. INVALID: secret set but fails format validation
        #
        # Outputs a clear, actionable error for each failure mode so the
        # owner knows exactly what to fix — no more confusing "not set"
        # messages when the secret exists but is blank.
        validate_secret() {
          local name="$1"
          local raw_val="$2"
          local format_check="${3:-}"

          # Mode 1: secret variable does not exist at all
          if [ -z "${raw_val+set}" ]; then
            echo "::error::SECRET UNSET: '${name}' was never created. Go to GitHub → Settings → Secrets and variables → Actions → New repository secret, name it exactly '${name}'."
            return 1
          fi

          # Mode 2: secret exists but value is empty or only whitespace
          local trimmed
          trimmed="$(printf '%s' "${raw_val}" | xargs)"
          if [ -z "${trimmed}" ]; then
            echo "::error::SECRET EMPTY: '${name}' exists in GitHub Secrets but its value is blank (empty string or whitespace only). Go to GitHub → Settings → Secrets and variables → Actions → edit '${name}' and set a real value."
            return 1
          fi

          # Mode 3: format validation (optional, caller-specified)
          if [ -n "${format_check}" ]; then
            case "${format_check}" in
              HTTPS_URL)
                if ! printf '%s' "${trimmed}" | grep -qE '^https://[a-zA-Z0-9.-]+(\.[a-zA-Z]{2,})+(/.*)?$'; then
                  echo "::error::SECRET INVALID: '${name}' is set to '${trimmed}' but does not look like a valid HTTPS URL (must start with https:// and contain a valid hostname). Update the secret value."
                  return 1
                fi
                ;;
              CF_ACCOUNT_ID)
                if ! printf '%s' "${trimmed}" | grep -qE '^[a-f0-9]{32}$'; then
                  echo "::error::SECRET INVALID: '${name}' is set but does not look like a Cloudflare Account ID (32 hex chars). Update the secret value."
                  return 1
                fi
                ;;
              CF_API_TOKEN)
                if [ "${#trimmed}" -lt 20 ]; then
                  echo "::error::SECRET INVALID: '${name}' is set but too short to be a valid Cloudflare API token (< 20 chars). Update the secret value."
                  return 1
                fi
                ;;
              NONEMPTY)
                # Already validated by the empty check above
                ;;
            esac
          fi

          echo "  ✓ ${name} is valid (length=${#trimmed})"
          return 0
        }

        # ── Validate all four Stage 4 secrets ─────────────────────
        ERRORS=0
        validate_secret "PROBE_RELAY_URL"     "${PROBE_RELAY_URL:-}"     "HTTPS_URL"      || ERRORS=$((ERRORS + 1))
        validate_secret "PROBE_RELAY_TOKEN"   "${PROBE_RELAY_TOKEN:-}"   "NONEMPTY"       || ERRORS=$((ERRORS + 1))
        validate_secret "CF_WORKER_ACCOUNT_ID" "${CF_WORKER_ACCOUNT_ID:-}" "CF_ACCOUNT_ID" || ERRORS=$((ERRORS + 1))
        validate_secret "CF_WORKER_API_TOKEN" "${CF_WORKER_API_TOKEN:-}" "CF_API_TOKEN"   || ERRORS=$((ERRORS + 1))

        if [ "$ERRORS" -gt 0 ]; then
          echo ""
          echo "::error::❌ ${ERRORS} Stage 4 secret(s) failed validation. Stage 4 will be skipped."
          echo "::notice::Fix the secrets listed above, then re-run this workflow."
          echo "PROBE_RELAY_SKIP=true" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        echo "Relay URL: ${PROBE_RELAY_URL}"

        # ── Deploy / re-deploy the Worker via wrangler ──────────────
        # Uses ONLY the dedicated CF_WORKER_ACCOUNT_ID / CF_WORKER_API_TOKEN
        # secrets. The CF_ACCOUNT_ID_1..11 / CF_API_TOKEN_1..11 slots are
        # reserved for the AI Gateway provider rotation system and must not
        # be referenced here.
        if [ -z "${CF_WORKER_ACCOUNT_ID:-}" ] || [ -z "${CF_WORKER_API_TOKEN:-}" ]; then
          echo "::warning::CF_WORKER_ACCOUNT_ID/TOKEN not configured — skipping wrangler deploy"
          echo "::warning::The probe relay Worker may be stale if redeployed outside CI"
        elif ! command -v npx >/dev/null 2>&1; then
          echo "::warning::npx not available — skipping wrangler deploy; using existing Worker deployment"
        else
          echo "Deploying probe-relay Worker via wrangler…"
          export CLOUDFLARE_ACCOUNT_ID="${CF_WORKER_ACCOUNT_ID}"
          export CLOUDFLARE_API_TOKEN="${CF_WORKER_API_TOKEN}"

          # Sync the PROBE_RELAY_TOKEN secret to the Worker so that
          # X-Probe-Token authentication matches between CI (sender)
          # and Worker (validator). This keeps the two in sync
          # automatically every deploy cycle — the owner never needs
          # to run `wrangler secret put` by hand.
          if [ -n "${PROBE_RELAY_TOKEN:-}" ]; then
            echo "Syncing PROBE_RELAY_TOKEN to Worker secret…"
            echo "${PROBE_RELAY_TOKEN}" | npx wrangler@latest secret put PROBE_RELAY_TOKEN --config probe-relay/wrangler.toml 2>&1 || \
              echo "::warning::wrangler secret put FAILED — Worker may reject probes with 401"
          else
            echo "::notice::PROBE_RELAY_TOKEN not set — Worker will run in auth-less mode if its secret is also unset"
          fi

          if npx wrangler@latest deploy --config probe-relay/wrangler.toml 2>&1; then
            echo "✅ wrangler deploy succeeded"
          else
            echo "::warning::wrangler deploy FAILED — proceeding with existing Worker deployment"
          fi
        fi

        # ── Show the deployed Worker version (diagnostic) ───────────
        if [ -n "${CF_WORKER_API_TOKEN:-}" ] && command -v npx >/dev/null 2>&1; then
          export CLOUDFLARE_API_TOKEN="${CF_WORKER_API_TOKEN}"
          echo "--- wrangler whoami ---"
          npx wrangler@latest whoami 2>&1 || true
          echo "--- wrangler deployments list ---"
          npx wrangler@latest deployments list --config probe-relay/wrangler.toml 2>&1 || true
        fi

        # ── Live smoke test: single curl before the 49-chunk batch ──
        # Normalize URL: strip trailing slash, strip /probe suffix if
        # owner accidentally included it, then append /probe.
        # This makes the system format-tolerant so the owner can set:
        #   https://foo.workers.dev       → /probe
        #   https://foo.workers.dev/      → /probe
        #   https://foo.workers.dev/probe → /probe (no doubling)
        SMOKE_URL="${PROBE_RELAY_URL%/}"
        SMOKE_URL="${SMOKE_URL%/probe}"
        SMOKE_URL="${SMOKE_URL}/probe"
        echo "Smoke-testing ${SMOKE_URL} …"
        # The Worker expects {"host","port","transport"} — NOT "address".
        # Schema validated at: probe-relay/src/index.ts "Each bridge must have host, port, and transport fields"
        SMOKE_BODY='[{"host":"127.0.0.1","port":9999,"transport":"obfs4"}]'
        SMOKE_CODE=$(curl -s -o /tmp/smoke_resp.json -w "%{http_code}" \
          -X POST "$SMOKE_URL" \
          -H "Content-Type: application/json" \
          -H "X-Probe-Token: ${PROBE_RELAY_TOKEN:-}" \
          -d "$SMOKE_BODY" \
          --connect-timeout 15 --max-time 30 2>/dev/null || echo "000")
        echo "Smoke test HTTP status: ${SMOKE_CODE}"
        if [ -s /tmp/smoke_resp.json ]; then
          echo "Smoke test response body (first 5 lines):"
          head -5 /tmp/smoke_resp.json
        fi
        if [ "$SMOKE_CODE" != "200" ]; then
          echo "::error::Probe relay smoke test FAILED — HTTP ${SMOKE_CODE} (expected 200)"
          echo "::error::Check PROBE_RELAY_URL secret and Worker deployment status"
          echo "PROBE_RELAY_SKIP=true" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        echo "✅ Probe relay smoke test passed (HTTP 200) — Stage 4 will proceed"
        echo "PROBE_RELAY_SKIP=false" >> "${GITHUB_OUTPUT}"

      # Stage 4 — External Probe Relay (CI Egress Fix)
      #
      # GitHub Actions runners have restricted outbound egress and cannot
      # reliably complete raw TCP/TLS handshakes to arbitrary Tor bridge
      # IP:port pairs. The in-runner bridge-probe binary is preserved as a
      # fallback when the relay is unreachable, but the primary path now
      # delegates PT handshake verification to an external always-on relay
      # service (Cloudflare Worker, free tier) that has real outbound
      # network access via the cloudflare:sockets connect() API.
      #
      # The relay performs:
      #   - TCP connect for vanilla/obfs4 (prefilter) endpoints
      #   - TLS handshake for domain-fronted transports
      #   - TLS + HTTP WebSocket Upgrade (101 check) for WebTunnel bridges
      #
      # Full obfs4 PT handshake verification remains local (via
      # obfs4proxy/lyrebird SOCKS5 harness) against TCP-reachable endpoints
      # that the relay confirms.
    - name: Stage 4 — External Probe Relay (CI egress fix)
      if: steps.relay_prep.outputs.PROBE_RELAY_SKIP != 'true'
      timeout-minutes: 25
      env:
        PROBE_RELAY_URL: ${{ secrets.PROBE_RELAY_URL }}
        PROBE_RELAY_TOKEN: ${{ secrets.PROBE_RELAY_TOKEN }}
        # Chunks are submitted concurrently (deterministic merge preserves the
        # exact same result array/order as the old serial loop). 8 concurrent
        # requests keeps the free-tier Cloudflare Worker busy without bursting
        # it; the parent merges per-chunk results in chunk order afterwards.
        PROBE_RELAY_PARALLELISM: '8'
      run: |
        set -euo pipefail

        # The relay is supplementary and writes results after every completed
        # chunk.  Bound the client *inside* the 25-minute Actions step so a
        # slow/degraded Worker cannot let the platform kill the step and skip
        # every downstream stage.  On timeout we preserve valid partial
        # results; only an absent/invalid file is replaced with an empty array.
        relay_status=0
        timeout --signal=TERM --kill-after=30s 20m \
          bash scripts/probe_relay.sh \
            bridge/bridge_list_for_testing.json \
            data/pt_results.json || relay_status=$?

        if [ "$relay_status" -eq 124 ] || [ "$relay_status" -eq 137 ]; then
          echo "::warning::Probe relay reached its 20-minute budget; continuing with partial results"
        elif [ "$relay_status" -ne 0 ]; then
          echo "::warning::Probe relay exited with status ${relay_status}; continuing with available results"
        fi

        if ! jq -e 'type == "array"' data/pt_results.json >/dev/null 2>&1; then
          echo "::warning::Probe relay did not leave a valid result array; using an empty supplementary result set"
          printf '[]\n' > data/pt_results.json
        fi

        echo "Stage 4 completed with $(jq 'length' data/pt_results.json) relay observations"

      # Unconditional cleanup of the backgrounded probe_scheduler; three
      # escalating kill signals plus fuser as the final fallback for port 8742.
    - name: Stage 4 cleanup — kill probe_scheduler
      if: always()
      run: |
        if [ -f /tmp/probe_sched.pid ]; then
          PID=$(cat /tmp/probe_sched.pid)
          echo "Terminating probe_scheduler PID=$PID"
          kill -TERM "$PID" 2>/dev/null || true
          sleep 2
          kill -KILL "$PID" 2>/dev/null || true
          rm -f /tmp/probe_sched.pid
        fi
        fuser -k 8742/tcp 2>/dev/null || true
        echo "probe_scheduler cleanup complete."

    - name: Stage 5 — OONI correlator
      continue-on-error: true
      timeout-minutes: 8
      run: cargo run --quiet --features network --bin ooni_correlator

    - name: Stage 6a — Score bridges
      timeout-minutes: 8
      run: |
        set -euo pipefail
        cargo run --quiet --bin pipeline -- --stage ml --stage rotation --report data/stage6a_score_report.json

    - name: Stage 6b — Export bridge files
      timeout-minutes: 5
      run: |
        set -euo pipefail
        cargo run --quiet --bin pipeline -- --stage results --report data/stage6b_export_report.json

    - uses: actions/upload-artifact@v6
      with:
        name: bridge-snapshot
        path: "bridge/\ndata/\nexport/\ndocs/\ndiagnostics/"
        retention-days: 1
        if-no-files-found: ignore
  ai-rerank:
    # MERGED from ai_bridge_reranker.yml (2026-08-01 consolidation), ported to
    # the Rust-native ai_bridge_reranker binary (the retired
    # scripts/ai_bridge_reranker.py no longer exists). The standalone
    # "just re-rank an existing file" entry point is preserved via the
    # rerank_only workflow_dispatch input — quality-gate, build-rust,
    # rust-parity-tests and scrape-and-test all skip themselves in that mode,
    # and this job runs anyway (if: always()) against whatever
    # bridge/iran_results.json is already checked out.
    name: "AI Bridge Re-Ranker (Iran)"
    needs:
    - scrape-and-test-finalize
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Bootstrap environment defaults
      run: |
        set -euo pipefail
        bash scripts/github_actions_env_bootstrap.sh

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 'stable'

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-rerank-${{ hashFiles('Cargo.toml', 
          'Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

      # Same-run artifact pull — replaces the old cross-workflow
      # `gh run download`. Skipped in rerank_only mode or when
      # scrape-and-test failed; the next step then falls back to the
      # bridge/iran_results.json committed in the repo.
    - name: Download this run's bridge intelligence artifact
      if: needs.scrape-and-test-finalize.result == 'success'
      uses: actions/download-artifact@v8
      with:
        name: bridge-intelligence-report
        path: bridge-artifact-tmp/
      continue-on-error: true

    - name: Ensure bridge dir and fallback files
      run: |
        set -euo pipefail
        mkdir -p bridge data export
        if [ -f bridge-artifact-tmp/bridge/iran_results.json ]; then
          cp bridge-artifact-tmp/bridge/iran_results.json bridge/iran_results.json
          echo "Using this run's freshly-collected bridge/iran_results.json"
        elif [ -f bridge/iran_results.json ]; then
          echo "scrape-and-test produced no fresh artifact (skipped or failed) — using bridge/iran_results.json already committed in the repo"
        else
          echo '{"bridges":[],"summary":{"total_tested":0}}' > bridge/iran_results.json
          echo "WARNING: bridge/iran_results.json not found anywhere — created empty placeholder"
        fi

    - name: Run AI Re-Ranking (Rust-native scorer)
      timeout-minutes: 8
      env:
        GITHUB_RUN_ID: ${{ github.run_id }}
        BRIDGE_FILE: ${{ inputs.bridge_file || 'bridge/iran_results.json' }}
          # 0 = dynamic (documented default): rank/publish the whole
          # deduplicated pool. Cap via the AI_RERANK_TOP_N repository variable.
        AI_RERANK_TOP_N: ${{ vars.AI_RERANK_TOP_N }}
      run: |
        set -euo pipefail
        cargo run --quiet --bin ai_bridge_reranker -- \
          --input "$BRIDGE_FILE" \
          --output bridge/bridges_ai_iran_ranked.json \
          --censorship-level 4 \
          --top-n "${AI_RERANK_TOP_N:-0}" || {
            echo "::warning::ai_bridge_reranker failed (advisory rerank job) — not failing the workflow, but the failure is visible here"
          }
        if [ -f bridge/bridges_ai_iran_ranked.json ]; then
          echo "bridge/bridges_ai_iran_ranked.json written (see scorer summary above)"
        fi

    - name: Upload AI-Ranked Bridges
      uses: actions/upload-artifact@v6
      with:
        name: ai-iran-ranked-bridges-${{ github.run_id }}
        path: bridge/bridges_ai_iran_ranked.json
        retention-days: 30
        if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  package-final-artifact:
    name: "Package Final Artifact"
    needs:
    - scrape-and-test-finalize
    - ai-rerank
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Checkout full repo
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Bootstrap environment defaults
      run: |
        set -euo pipefail
        bash scripts/github_actions_env_bootstrap.sh

    - name: Download all stage artifacts
      uses: actions/download-artifact@v8
      with:
        path: all_artifacts/

    - name: Bundle everything into tar.gz
      run: |
        mkdir -p dist/
        tar --exclude='.git' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='bridge-probe/target' \
            --exclude='./dist' \
            --exclude='dist' \
            -czf dist/Tor-Bridges-Collector-main-ultra-quantum-vip-vip-super-ultra-vip-ultra-quantum-ultra-vip-ultra-quantum.tar.gz \
            . all_artifacts/
        echo "Archive size: $(du -sh dist/*.tar.gz | cut -f1)"

    - name: Upload Final Package
      uses: actions/upload-artifact@v6
      with:
        name: TorShield-IR-Final-Package-${{ github.run_id }}
        path: 
          dist/Tor-Bridges-Collector-main-ultra-quantum-vip-vip-super-ultra-vip-ultra-quantum-ultra-vip-ultra-quantum.tar.gz
        retention-days: 90

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: 
          dist/Tor-Bridges-Collector-main-ultra-quantum-vip-vip-super-ultra-vip-ultra-quantum-ultra-vip-ultra-quantum.tar.gz
        token: ${{ secrets.GH_PAT_AUTOFIX }}

  cleanup:
    name: AI Ultra-Pro Cleanup
    if: always()
    needs:
    - quality-gate
    - build-rust
    - rust-parity-tests
    - scrape-and-test-finalize
    - ai-rerank
    - package-final-artifact
    uses: ./.github/workflows/ai-ultra-pro-cleanup.yml
    secrets: inherit
    with:
      keep_last_n: '2'
      dry_run: true
  analytics-ml-zig:
    name: analytics-ml-zig
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
    - scrape-and-test
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Bootstrap environment defaults
      run: |
        set -euo pipefail
        bash scripts/github_actions_env_bootstrap.sh

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 'stable'

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
         # Scope the cache to the FULL workspace: any crate manifest or
          # lockfile change invalidates the key. Hashing only the root
          # 'Cargo.toml'/'Cargo.lock' missed member manifests under crates/,
          # bridge-probe/ and rust/, so an unchanged lockfile with a changed
          # member manifest silently reused a stale compiled target.
        key: ${{ runner.os }}-cargo-pipeline-${{ hashFiles('**/Cargo.toml', 
          '**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-pipeline-
          ${{ runner.os }}-cargo-

    - uses: actions/download-artifact@v8
      with:
        name: bridge-snapshot
        path: .
    - name: Stage 7 — ML blocking predictor
      continue-on-error: true
      timeout-minutes: 8
      run: cargo run --quiet --bin ml_predictor

    - name: Stage 8 — Adaptive transport engine
      continue-on-error: true
      timeout-minutes: 5
      run: cargo run --quiet --bin pipeline -- --stage adaptive --report 
        data/adaptive_transport_report.json

    - name: Restore Zig toolchain cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/zig-linux-x86_64-0.14.0
        key: ${{ runner.os }}-zig-toolchain-0.14.0

    - name: Install Zig toolchain for Stage 8q
      run: |
        set -euo pipefail
        ZIG_VERSION="0.14.0"
        ZIG_CACHE="${{ runner.temp }}/zig-linux-x86_64-${ZIG_VERSION}"
        if [ -x "${ZIG_CACHE}/zig" ]; then
          echo "Using cached Zig ${ZIG_VERSION} at ${ZIG_CACHE}"
        else
          ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz"
          echo "Fetching Zig ${ZIG_VERSION} from ${ZIG_URL}"
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/zig.tar.xz "${ZIG_URL}"
          rm -rf "${ZIG_CACHE}"
          tar -xJf /tmp/zig.tar.xz -C "${{ runner.temp }}"
          if [ ! -x "${ZIG_CACHE}/zig" ]; then
            echo "::error::Zig toolchain extraction did not produce ${ZIG_CACHE}/zig"
            exit 1
          fi
          rm -f /tmp/zig.tar.xz
          echo "Zig ${ZIG_VERSION} installed"
        fi
        echo "${ZIG_CACHE}" >> "${GITHUB_PATH}"
        # GITHUB_PATH only applies to the NEXT step, so within this step Zig
        # is not yet on PATH. Use the absolute path here so the toolchain is
        # still verified, then Stage 8q picks it up from GITHUB_PATH.
        "${ZIG_CACHE}/zig" version

      # Cache zig build outputs (source tree is unchanged when the scan is
      # re-run), so `zig build -Doptimize=ReleaseFast` in Stage 8q is an
      # incremental no-op instead of a cold rebuild. The scan itself still runs
      # every time and still produces data/zig_scan.json.
    - name: Restore Zig scanner build cache
      uses: actions/cache@v5
      with:
        path: |
          zig-scanner/.zig-cache
          zig-scanner/zig-cache
          zig-scanner/zig-out
        key: ${{ runner.os }}-zig-scanner-${{ hashFiles('zig-scanner/build.zig',
          'zig-scanner/src/*.zig') }}
        restore-keys: ${{ runner.os }}-zig-scanner-

    - name: Stage 8q — Zig ultra-fast TCP bridge pre-screener
      timeout-minutes: 6
      run: |
        set -euo pipefail
        test -d zig-scanner || { echo "::error::zig-scanner source is missing"; exit 1; }
        command -v zig >/dev/null || { echo "::error::Zig toolchain installation failed"; exit 1; }
        cd zig-scanner
        zig version
        zig build -Doptimize=ReleaseFast
        test -x zig-out/bin/zig-scanner || { echo "::error::zig-scanner binary was not built"; exit 1; }
        ./zig-out/bin/zig-scanner ../data/latest-results.json
        cd ..
        test -s data/zig_scan.json || { echo "::error::Stage 8q produced no scan report"; exit 1; }

      # Stage 8r scores every bridge against Iran's 8-layer SIAM DPI pipeline
      # and outputs PHANTOM + STEALTH tier bridges for maximum evasion.
    - uses: actions/upload-artifact@v6
      with:
        name: analytics-ml-zig
        path: "data/model_metadata.json\ndata/blocking_model.pkl\ndata/transport_weights.json\n\
          data/transport_weight_history.json\ndata/best_transports.json\ndata/adaptive_transport_report.json\n\
          data/zig_scan.json\ndata/latest-results.json"
        retention-days: 7
        if-no-files-found: ignore
  analytics-scoring:
    name: analytics-scoring
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
    - scrape-and-test
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Bootstrap environment defaults
      run: |
        set -euo pipefail
        bash scripts/github_actions_env_bootstrap.sh

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 'stable'

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
         # Scope the cache to the FULL workspace: any crate manifest or
          # lockfile change invalidates the key. Hashing only the root
          # 'Cargo.toml'/'Cargo.lock' missed member manifests under crates/,
          # bridge-probe/ and rust/, so an unchanged lockfile with a changed
          # member manifest silently reused a stale compiled target.
        key: ${{ runner.os }}-cargo-pipeline-${{ hashFiles('**/Cargo.toml', 
          '**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-pipeline-
          ${{ runner.os }}-cargo-

    - uses: actions/download-artifact@v8
      with:
        name: bridge-snapshot
        path: .
    - name: Stage 8b — DPI intelligence report
      continue-on-error: true
      timeout-minutes: 5
      run: cargo run --quiet --bin dpi_evasion_advanced

    - name: Stage 8n — JA3/TLS fingerprint rotation engine
      continue-on-error: true
      timeout-minutes: 5
      run: cargo run --quiet --bin pipeline -- --stage ja3 --report 
        data/ja3_pipeline_report.json

    - name: Stage 8i — Anti-AI DPI scoring
      continue-on-error: true
      timeout-minutes: 5
      run: cargo run --quiet --bin anti_ai_dpi

    - name: Stage 8i-smart — Smart Iran AI re-ranker (v9.0)
      continue-on-error: true
      timeout-minutes: 8
      env:
          # 0 = dynamic: rank/publish the whole deduplicated pool (documented
          # default); set the AI_RERANK_TOP_N repository variable to cap it.
        AI_RERANK_TOP_N: ${{ vars.AI_RERANK_TOP_N }}
      run: |
        set -euo pipefail
        cargo run --quiet --bin ai_bridge_reranker -- \
          --input bridge/iran_results.json \
          --output data/smart_iran_results.json \
          --top-n "${AI_RERANK_TOP_N:-0}"

      # Stage 8j reads data/dpi_intelligence.json from Stage 8b and rewrites
      # obfuscation parameters when active blocking patterns are detected.
    - name: Stage 8j — Agentic AI DPI mutator (self-heal loop)
      continue-on-error: true
      timeout-minutes: 10
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
        CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
