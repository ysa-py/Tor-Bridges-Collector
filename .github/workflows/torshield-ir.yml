        # export/nin_cut_bridges.txt, data/nin_eligible.json) are authoritative.\n\
        cp -a analytics/nin/. . || true\necho \"Merge complete\"\n"
    - name: Stage 8s — Iran Anti-DPI Elite fusion (AI-consensus pack)
      timeout-minutes: 5
      env:
        AI_ANTI_DPI_TOP_N: ${{ vars.AI_ANTI_DPI_TOP_N }}
      run: |
        set -euo pipefail
        bash scripts/build_iran_anti_dpi_elite.sh
        # An empty pack is a truthful zero-yield result (no surviving
        # PHANTOM/STEALTH/COVERT bridges this run). Require the file, not
        # a non-zero byte count — `test -s` previously emitted ::error::
        # on valid empty output.
        test -f export/iran_anti_dpi_elite.txt || {
          echo "::error::Stage 8s produced no elite pack file"
          exit 1
        }
        elite_count=0
        if [ -s export/iran_anti_dpi_elite.txt ]; then
          set +e
          elite_count=$(grep -c '^[^[:space:]#]' export/iran_anti_dpi_elite.txt)
          set -e
          elite_count=${elite_count:-0}
        fi
        echo "Iran Anti-DPI Elite pack: ${elite_count} bridges"

      # Stage 8t produces the two auxiliary manifests the
      # bridge-intelligence-report upload has always advertised but no stage
      # ever wrote: data/pq_bridge_scores.json (post-quantum safety per
      # bridge, mapped from Stage 8e transport scores onto the Stage 8i pool)
      # and export/nin_recommended_transport.json (per-regime recommended
      # transports with evidence counts from the NIN-cut artifacts). Both are
      # deterministic, regenerated every run, advisory.
    - name: Stage 8t — PQ bridge scores + NIN recommended-transport manifests
      continue-on-error: true
      timeout-minutes: 5
      run: |
        set -euo pipefail
        bash scripts/build_pq_bridge_scores.sh
        test -s data/pq_bridge_scores.json || { echo "::error::Stage 8t produced no pq_bridge_scores.json"; exit 1; }
        bash scripts/build_nin_recommended_transport.sh
        test -s export/nin_recommended_transport.json || { echo "::error::Stage 8t produced no nin_recommended_transport.json"; exit 1; }

      # Stage 8u (additive, 2026-09-08): drift & survivability advisories.
      # PURELY ADVISORY — writes only NEW files under data/ plus ::notice
      # annotations; it can never gate CI, edit any contracted
      # bridge/ files, or change a score/membership/ranking. Produces:
      #   data/bridge_drift_report.json        — per-bridge stale-positive
      #     cohort from the collector's existing EWMA health score (which
      #     nothing in the publication path consumed before)
      #   data/transport_success_history.json  — per-transport working/total
      #     per run (the series nothing in this repo accumulated before) +
      #     run-over-run anomaly flags + step-change scan, both explicitly
      #     framed as externally-observable reachability proxies, NOT claims
      #     about Iran's DPI mechanism
      #   data/front_domain_survivability.json — per-front-domain aggregate
      #     for domain-fronted transports (shared-front failure visibility)
    - name: Stage 8u — Drift & survivability advisories (additive, non-blocking)
      continue-on-error: true
      timeout-minutes: 5
      run: |
        set -euo pipefail
        cargo run --locked --quiet --bin drift_advisory

      # Stage 8v (ADDITIVE 2026-09-08): pipeline funnel advisory — turns the
      # Section-1 diagnostic funnel into a repeatable per-run artifact:
      #   data/funnel_advisory.json + ::notice annotations with
      #   * the full funnel table (sources → candidates → relay → TCP →
      #     published) computed from this run's real artifacts;
      #   * a non-routable endpoint census of the candidate pool (shared
      #     ip_guard policy table + reason labels);
      #   * the relay-coverage gap (candidates with no relay observation,
      #     split non-routable vs other) + an advisory retry plan derived
      #     from retry_engine's backoff curve;
      #   * the evidence-driven webtunnel front-domain health advisory
      #     (built ONLY from live probe-relay observations).
      # Advisory only: never gates CI, never edits contracted
      # bridge/ files, never changes a score or membership decision.
    - name: Stage 8v — Pipeline funnel advisory (additive, non-blocking)
      continue-on-error: true
      timeout-minutes: 10
      run: |
        set -euo pipefail
        cargo run --locked --quiet --bin funnel_advisory

      # Stage 8w (ADDITIVE 2026-10-13): runner-side transport handshake
      # verification. Before this stage the pipeline produced S1 (TCP) and
      # best-case S1 webtunnel front-check evidence only, so every evidence-
      # gated projection (`*_tested.txt`, `tested_global_*.txt`,
      # `iran_likely_working_*`) stayed structurally empty: the publication
      # contract requires typed S2+ protocol observations, the probe relay
      # canary fails closed without credentials, and the tbc-prober handshake
      # engine had no executable wiring at all. This stage runs the REAL
      # transport handshakes (vanilla VERSIONS/NETINFO, obfs4 framing
      # M_S/MAC_S, webtunnel RFC 6455 accept, meek envelope, snowflake broker)
      # against the S1-reachable, highest-scoring candidates seconds before
      # Stage 9, keeping observations inside the 10-minute evidence freshness
      # window at publish time. Evidence stays honest: failures remain typed
      # neutral S0 records, obfs4 is stamped S3 (framing handshake, ntor AUTH
      # out of scope per crates/prober), and no record is ever upgraded beyond
      # what was actually verified. Advisory: a probe failure must never gate
      # publication — the merge is additive and deduplicated into
      # data/pt_results.json, which `pipeline --stage results` already joins.
    - name: Stage 8w — Runner-side transport handshake verification (S2+ evidence)
      continue-on-error: true
      timeout-minutes: 12
      run: |
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
          echo "self no-op: live evidence probing stays on main (event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF})"
          exit 0
        fi
        set -euo pipefail
        # Quota 400 with stratified per-transport selection (handshake_probe):
        # worst-case wall clock is 400/24 waves * (connect+write+read = 3*8s)
        # ~ 400s < the 480s budget, and the probe loop stops at the budget
        # deadline, so an overrun degrades coverage honestly instead of lying.
        cargo run --locked --quiet --bin handshake_probe -- \
          --input bridge/iran_results.json \
          --output data/handshake_results.json \
          --merge-into data/pt_results.json \
          --max-bridges 400 \
          --workers 24 \
          --timeout-secs 8 \
          --budget-seconds 480
        if [ -f data/handshake_results.json ]; then
          HS_TOTAL=$(jq 'length' data/handshake_results.json 2>/dev/null || echo 0)
          HS_S2PLUS=$(jq '[.[] | select(.status == "connected" and (.stage == "S2" or .stage == "S3" or .stage == "S4"))] | length' data/handshake_results.json 2>/dev/null || echo 0)
          echo "Stage 8w completed: ${HS_S2PLUS} typed S2+ handshake observations from ${HS_TOTAL} records (merged into data/pt_results.json for the Stage 9 results join)"
        fi

      # Dual persist, one verified payload: the Rust publisher atomically
      # rewrites every REQUIRED_FILES bridge/ output, re-renders README.md from the
      # verified snapshot, byte-verifies tor_bridges.zip, and then delivers
      # that exact ZIP to Telegram — GitHub and Telegram always store the
      # same bytes. This production stage is main-only (enforced on its parent
      # job and again by the upload guard); PR/non-main runs execute validation
      # jobs but never collect, deploy, publish, or deliver production data.
    - name: Stage 9 — Dual persist ALL bridge/ files + README.md + Telegram
        archive
      timeout-minutes: 8
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Precedence (resolved in bash below, where 'false' stays a real
          # string): dispatch input > TELEGRAM_AUTO_UPLOAD repo variable > ON.
        TELEGRAM_INPUT: ${{ github.event.inputs.upload_to_telegram }}
        TELEGRAM_REPO_VAR: ${{ vars.TELEGRAM_AUTO_UPLOAD }}
        REPO_URL: https://raw.githubusercontent.com/${{ github.repository
          }}/refs/heads/${{ github.ref_name }}
        # Directive v43 §E: the run's evidence window + relay availability
        # feed the publisher's tier admission and empty-file reason codes.
        # Both signals come from the scrape-and-test job via needs outputs.
        TBC_RUN_FLOOR: ${{ needs.scrape-and-test.outputs.pipeline_run_floor }}
        TBC_RELAY_AVAILABLE: ${{ needs.scrape-and-test.outputs.relay_available }}
      run: |
        set -euo pipefail
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
          echo "self no-op: live publication rewrite stays on main (event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF})"
          if [ -f bridge/telegram_manifest.json ]; then
            # Stages above regenerate bridge/ projections from the committed
            # inputs, so this worktree no longer holds the published bytes. The
            # contract a non-main ref must satisfy is the committed one: nothing
            # from a PR is ever published, and every main run rewrites the whole
            # contract from freshly generated data. The worktree delta is
            # EXPECTED here (PR validation runs the same generators the main
            # publication uses, then restores the committed bytes below), so it
            # is reported in the step summary — not as ::warning:: annotations:
            # a by-design no-op difference must not page as a warning on every
            # validation run (runs 38613981417/38632675661: 4 annotations of
            # pure noise per PR). The ::error:: for a genuinely inconsistent
            # COMMITTED contract stays below and still fails the run.
            if ! git diff --quiet -- bridge/; then
              {
                echo "### Stage 9 — regenerated-vs-committed delta (expected on validation refs)"
                echo 'The PR path regenerates projections from committed inputs, then restores the committed publication. The delta is informational:'
                git diff --numstat -- bridge/ | sed -n '1,20p' | while read -r added removed path; do
                  echo "- \`${path}\` (+${added}/-${removed})"
                done
              } >> "${GITHUB_STEP_SUMMARY}"
              git diff --numstat -- bridge/ | sed -n '1,20p' | while read -r added removed path; do
                echo "regenerated payload differs from the committed publication (expected on validation refs): ${path} (+${added}/-${removed})"
              done
            fi
            git checkout -- bridge/
            if ! cargo run --locked --quiet --bin sync_bridge_outputs -- \
              --bridge-dir bridge \
              --verify-only; then
              echo "::error::committed publication contract is inconsistent (sync_bridge_outputs --verify-only failed)"
              exit 1
            fi
          else
            echo "declared: no committed publication contract on this ref"
            echo "missing: bridge/telegram_manifest.json (none committed)"
            echo "reason: validation_noop does not invent bridge/ rows"
          fi
          {
            echo "### Stage 9"
            echo "- publication: self no-op (main-only)"
            echo "- verify_only: committed tree or declared missing"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 0
        fi
        cargo run --locked --quiet --bin pipeline -- --stage results --report data/results_writer_report.json
        UPLOAD="$(printf '%s' "${TELEGRAM_INPUT:-${TELEGRAM_REPO_VAR:-true}}" | tr '[:upper:]' '[:lower:]')"
        if [ "$UPLOAD" = "true" ] && [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
          echo "pull_request run — publication preview only; Telegram delivery deferred"
          echo "to the main-branch run (mirrors the Stage 11 publication no-op)."
          UPLOAD=false
        fi
        if [ "$UPLOAD" = "true" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
          echo "non-main ref ${GITHUB_REF} — publication preview only; Telegram delivery deferred"
          echo "to the main-branch run where Stage 11 can commit the same verified payload."
          UPLOAD=false
        fi
        if [ "$UPLOAD" = "true" ] && { [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; }; then
          # Informational, not a warning: the caller deliberately did not
          # configure Telegram credentials, so delivery cannot run. The same
          # verified payload is still persisted/committed via bridge/ +
          # README.md (or artifact) by Stage 11, so no capability is removed —
          # this is a configuration-dependent notice. Single ::notice:: line
          # keeps the Actions annotations clean while keeping the reason in the
          # log.
          echo "::notice::TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID not configured — Telegram delivery skipped; the identical verified payload is still committed to bridge/ + README.md by Stage 11."
          UPLOAD=false
        fi
        echo "Telegram dual-persist mode: $UPLOAD"
        cargo run --locked --quiet --features network --bin sync_bridge_outputs -- \
          --bridge-dir bridge \
          --readme README.md \
          --repo-url "$REPO_URL" \
          --retries 3 \
          --telegram-upload "$UPLOAD"
        echo "═══ README.md re-rendered from the verified snapshot ═══"
        sed -n '1,8p' README.md

      # Real self-test of the publication: re-validates every required file,
      # the JSON shapes, every SHA-256 entry in telegram_manifest.json, and
      # byte-compare each tor_bridges.zip entry against its repository
      # counterpart. Any drift fails the run before anything is committed.
    - name: Stage 9b — Verify publication contract (all files, byte-identical
        ZIP)
      timeout-minutes: 3
      run: |
        set -euo pipefail
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
          echo "self no-op: publication contract verify stays on main (event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF})"
          exit 0
        fi
        cargo run --locked --quiet --bin sync_bridge_outputs -- \
          --bridge-dir bridge \
          --verify-only
        echo "✅ Publication contract verified: every required file present,"
        echo "   manifest hashes match, archive contents byte-identical."

      # Post-publication funnel refresh (2026-10-15, issue #270 follow-up).
      # Stage 8v computes data/funnel_advisory.json BEFORE Stage 9 rewrites
      # bridge/, so its published_advisory_working stage read the mid-pipeline
      # (pre-publication) working set and systematically reported 0 while the
      # run actually published hundreds of advisory-working bridges (run
      # 38702901771: funnel said 0, the dual-persist commit said 638). The
      # funnel advisory is re-run AFTER the verified publication on main so
      # the committed metric reflects the published bytes; the Stage 8v run
      # stays as the mid-pipeline observation. Advisory-only, non-blocking.
    - name: Stage 9d — Post-publication funnel refresh (truthful
        published_advisory_working)
      timeout-minutes: 5
      run: |
        set -euo pipefail
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
          echo "self no-op: post-publication funnel refresh stays on main (event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF})"
          exit 0
        fi
        if [ ! -f data/funnel_advisory.json ]; then
          echo "self no-op: no mid-pipeline funnel advisory to refresh"
          exit 0
        fi
        # The funnel advisory derives its live/noop semantics from
        # data/collection_mode.json, which the core job's snapshot wrote for
        # the COLLECTION decision. At this point the run has verified and
        # published the bridge/ contract (Stage 9b passed), so the
        # publication context is live: the funnel recounts the PUBLISHED
        # bytes, and zeroed this-run-collection semantics must not clobber
        # the published metric. The committed mode is republished as live by
        # this same publication run.
        jq -n '{mode: "live", live_collection: true, refreshed_by: "stage_9d_post_publication"}' > data/collection_mode.json
        cargo run --locked --quiet --bin funnel_advisory
        published=$(jq -r '[.funnel[]? | select(.stage == "published_advisory_working") | .count] | first // 0' data/funnel_advisory.json 2>/dev/null || echo 0)
        echo "Post-publication funnel: published_advisory_working=${published} (refreshed from the verified bridge/ bytes)"
        {
          echo "### Stage 9d — post-publication funnel refresh"
          echo "- published_advisory_working: \`${published}\` (recomputed from the published bridge/ payload, not the mid-pipeline state)"
        } >> "${GITHUB_STEP_SUMMARY}"

      # Directive v43 §H: freshness SLA + machine-readable metrics.
      #  * SLA — a published snapshot older than 3 hours at publication time
      #    means the hourly cadence broke (skipped/coalesced runs); emit a
      #    loud ::error:: so the run is visibly degraded rather than silently
      #    late. The 3-hour budget tolerates two missed hourly refreshes.
      #  * metrics — one deterministic, machine-readable summary of the run
      #    (funnel counts, evidence tiers, per-transport supply, manifest
      #    freshness, reason codes) at data/pipeline_metrics.json, consumed
      #    by dashboards and the post-run auditors instead of log scraping.
    - name: Stage 9c — Freshness SLA + machine-readable metrics
      if: ${{ !cancelled() }}
      timeout-minutes: 3
      run: |
        set -euo pipefail
        metrics_file=data/pipeline_metrics.json
        mkdir -p data
        generated_at="$(jq -r '.generated_at // empty' bridge/telegram_manifest.json 2>/dev/null || true)"
        age_seconds=""
        if [ -n "${generated_at}" ]; then
          age_seconds="$(( $(date -u +%s) - $(date -u -d "${generated_at}" +%s) ))"
        fi
        sla_breached=false
        if [ -n "${age_seconds}" ] && [ "${age_seconds}" -gt 10800 ]; then
          sla_breached=true
          echo "::error::Freshness SLA breached: the published snapshot was generated ${age_seconds}s ago (>${10800}s / 3h SLA) — the hourly cadence broke. generated_at=${generated_at}"
        elif [ -n "${age_seconds}" ]; then
          echo "Freshness SLA ok: snapshot age ${age_seconds}s (<= 3h)."
        else
          echo "::warning::Freshness SLA indeterminate: telegram_manifest.json carries no generated_at."
        fi
        relay_signal="${{ needs.scrape-and-test.outputs.relay_available }}"
        relay_signal="${relay_signal:-not_reported}"
        jq -n \
          --arg schema_version "1" \
          --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg run_id "${GITHUB_RUN_ID}" \
          --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          --arg manifest_generated_at "${generated_at}" \
          --arg snapshot_age_seconds "${age_seconds}" \
          --arg freshness_sla_breached "${sla_breached}" \
          --arg relay_available "${relay_signal}" \
          --argjson manifest "$(cat bridge/telegram_manifest.json)" \
          '{
            schema_version: ($schema_version | tonumber),
            kind: "pipeline_metrics",
            generated_at: $generated_at,
            run: {id: ($run_id | if length > 0 then tonumber else null end), url: $run_url},
            publication: {
              manifest_generated_at: $manifest_generated_at,
              snapshot_age_seconds: ($snapshot_age_seconds | if length > 0 then tonumber else null end),
              freshness_sla_breached: ($freshness_sla_breached == "true"),
              archive_sha256: ($manifest.archive.name | null) // null,
              file_count: ($manifest.files | length),
              summary: $manifest.summary
            },
            evidence: {
              relay_available: $relay_available,
              s2plus_files: ([$manifest.files[] | select(.evidence_tier == "s2plus_handshake") | .name]),
              runner_tcp_tls_files: ([$manifest.files[] | select(.evidence_tier == "runner_tcp_tls") | .name]),
              empty_files_with_reasons: ([$manifest.files[] | select(.reason_code != null) | {name: .name, reason_code: .reason_code}])
            },
            advisory_only: true
          }' > "${metrics_file}"
        echo "wrote ${metrics_file}"

      # Do not run the force-populating FAILSAFE after publication: empty
      # *_tested.txt or *_72h*.txt files are truthful when no qualifying
      # observation exists, and changing any file after Stage 9b would break
      # the manifest hashes and verified ZIP. The pre-probe FAILSAFE above
      # remains in place for collector inputs.

    - name: Stage 10 — Full bridge/ inventory (manifest contract)
      timeout-minutes: 3
      run: |
        set -euo pipefail
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
          echo "self no-op: bridge/ inventory contract stays on main (event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF})"
          exit 0
        fi
        MANIFEST=bridge/telegram_manifest.json
        test -s "$MANIFEST" || { echo "::error::Missing bridge publication manifest"; exit 1; }
        jq -e '.required_files | type == "array" and length > 0' "$MANIFEST" >/dev/null
        mapfile -t REQUIRED < <(jq -r '.required_files[]' "$MANIFEST")
        echo "═══ Full bridge/ publication inventory (${#REQUIRED[@]} required files) ═══"
        MISSING=0
        TOTAL=${#REQUIRED[@]}
        for name in "${REQUIRED[@]}"; do
          f="bridge/$name"
          if [ ! -f "$f" ]; then
            printf '❌ %-42s MISSING\n' "$name"
            MISSING=$((MISSING + 1))
            continue
          fi
          size=$(stat -c %s "$f")
          case "$name" in
            *.txt|snowflake_ipv6_tested)
              count=$(grep -c . "$f" 2>/dev/null) || count=0
              count=${count//[$'\t\r\n ']/}
              count=${count:-0}
              printf '✅ %-42s %8d lines (%d bytes)\n' "$name" "$count" "$size"
              ;;
            *.json) printf '✅ %-42s   json   (%d bytes)\n' "$name" "$size" ;;
            *.zip)  printf '✅ %-42s   zip    (%d bytes)\n' "$name" "$size" ;;
            *)      printf '✅ %-42s   text   (%d bytes)\n' "$name" "$size" ;;
          esac
        done
        echo "═══════════════════════════════════════════"
        if [ "$MISSING" -gt 0 ]; then
          echo "::error::$MISSING of $TOTAL required bridge/ file(s) missing — publication contract broken"
          exit 1
        fi
        echo "✅ All $TOTAL required bridge/ files present."
        ALL_OK=true
        for req in iran_likely_working_all.txt iran_likely_working_obfs4.txt \
                   iran_likely_working_webtunnel.txt iran_likely_working_snowflake.txt \
                   iran_likely_working_nin.txt; do
          fpath="bridge/$req"
          count=$(grep -c . "$fpath" 2>/dev/null) || count=0
          count=${count//[$'\t\r\n ']/}
          count=${count:-0}
          if [ "$count" -gt 0 ]; then
            echo "✅ $req: $count bridges"
          else
            echo "⚠️  $req: 0 bridges"
            ALL_OK=false
          fi
        done
        if [ "$ALL_OK" = "true" ]; then
          echo "✅ All advisory bridge sets populated."
        else
          echo "⚠️  Some advisory sets empty — check scraper/tester logs above."
        fi

    # Informational, additive: BEFORE/AFTER line counts for the low-supply
    # files, comparing this run's output (after Stage 9/9b/Stage 10)
    # against the committed tree the job started from (git HEAD). Emitted as
    # workflow notices so the numbers are visible on the run page. Purely
    # report-only: never alters files and never fails the job on a delta.
    - name: Stage 10y — Low-supply count deltas vs HEAD (informational, additive)
      timeout-minutes: 2
      run: |
        set -euo pipefail
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
          echo "self no-op: COUNT_DELTA vs HEAD stays on main (event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF})"
          exit 0
        fi
        FILES="webtunnel_tested.txt webtunnel.txt webtunnel_ipv6_tested.txt \
          snowflake_tested.txt snowflake.txt snowflake_ipv6_tested.txt \
          conjure_tested.txt conjure.txt \
          meek-azure_tested.txt meek-azure.txt \
          meek_lite_tested.txt meek_lite.txt meek_lite_ipv6_tested.txt \
          vanilla_ipv6_tested.txt vanilla_ipv6.txt \
          iran_likely_working_webtunnel.txt iran_likely_working_snowflake.txt"
        for name in $FILES; do
          file="bridge/$name"
          if [ ! -f "$file" ]; then
            echo "::notice::COUNT_DELTA $name before=0 after=0 file_missing"
            continue
          fi
          before=$(git show "HEAD:$file" 2>/dev/null | grep -c . || true)
          before=${before//[$'\t\r\n ']/}
          before=${before:-0}
          after=$(grep -c . "$file" 2>/dev/null) || after=0
          after=${after//[$'\t\r\n ']/}
          after=${after:-0}
          echo "::notice::COUNT_DELTA $name before=$before after=$after"
        done

      # Stage 8p2 rebuilds the USER-FACING export/iran_cut_pack.txt (the file
      # README points Iranian users to during a شبکه ملی / national internet
      # cut) from every NIN-cut artifact produced so far — nin_eligible.json
      # (8d), iran_likely_working_nin.txt + nin_cut_bridges.txt (8p),
      # iran_nin_pack.txt (8d2), nin_cut_survivable.txt (8k). Earlier stages
      # can overwrite the pack with a strict (often empty) filter; this
      # finalizer guarantees the published pack always carries the full
      # survivable candidate set. Deterministic; advisory (runner-side).
      #
      # This MUST run after Stage 9 (dual-persist bridge/ files) and Stage 9b:
      # those stages rewrite the complete REQUIRED_FILES inventory (including
      # bridge/iran_likely_working_nin.txt) from the final verified snapshot.
      # Running the finalizer before them
      # published a cut-pack built from an intermediate bridge set, which the
      # invariant audit (C11 cutpack-freshness) then correctly rejected.
    - name: Stage 8p2 — NIN cut-pack finalizer (user-facing iran_cut_pack.txt)
      continue-on-error: true
      timeout-minutes: 5
      run: |
        set -euo pipefail
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
          echo "self no-op: iran_cut_pack finalizer stays on main (event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF})"
          exit 0
        fi
        bash scripts/build_iran_cut_pack.sh
        echo "✅ Iran internet-cut pack: $(grep -c '^[^#]' export/iran_cut_pack.txt) bridges"

      # Publication commits stay on the default branch (read-only PR tokens /
      # detached HEAD cannot push). The step still runs and self-no-ops so it
      # is not recorded as a skipped step.
    - name: Stage 11 — Commit and push
      timeout-minutes: 5
      run: |
        set -euo pipefail
        if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_REF}" != "refs/heads/main" ]; then
          echo "self no-op: Stage 11 publication commits stay on main (event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF})"
          {
            echo "### Stage 11"
            echo "- publication_commit: self no-op (main-only)"
            echo "- event: \`${GITHUB_EVENT_NAME}\`"
            echo "- ref: \`${GITHUB_REF}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 0
        fi
        git config --global user.name  "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # ROOT-CAUSE FIX (2026-10-11): the old `git pull --rebase --autostash`
        # ran AFTER the pipeline had regenerated bridge/ + data/. Autostash
        # re-applied those fresh files on top of the previous hourly commit
        # that touched the same generated files, and git wrote
        # `<<<<<<< Updated upstream` conflict markers into 56 JSON/text
        # files, which `git add` then committed. Every later run read
        # corrupt bridge_history.json / iran_results.json and lost its
        # verification evidence (=> empty *_tested / iran_likely_working_*).
        # Now: heal -> validate -> COMMIT FIRST -> rebase -> restore the
        # generated output trees as whole blobs from that verified commit ->
        # re-verify -> push, retrying on non-fast-forward. No stash is used.
        # The healer is shell + jq on purpose: `quality_gate py-check` fails
        # the build while any Python source survives in this Rust-native tree.
        bash scripts/repair_conflict_markers.sh
        PATHS="bridge/ data/ docs/ export/ README.md go.mod go.sum \
               src/bin/sync_bridge_outputs.rs cmd/ internal/ zig-scanner/ \
               generate_quantum_project.sh scripts/"
        # Stage ONLY paths that exist in the tree. A single missing
        # pathspec makes `git add` fail atomically and stage NOTHING.
        for opt in core bridge-probe/Cargo.lock; do
          [ -e "$opt" ] && PATHS="$PATHS $opt"
        done
        echo "Staging paths: $PATHS"
        # v42 §A empty-output guard: on a degraded run, restore the
        # last-known-good version of any contract file this run would have
        # wiped, and write data/run_manifest.json (counts + SHA-256 per file)
        # BEFORE anything is staged. A healthy run is trusted as-is.
        bash scripts/guard_bridge_publication.sh --bridge-dir bridge --live true
        git add $PATHS
        # Publication guard: never commit a payload that does not parse.
        bash scripts/repair_conflict_markers.sh --validate-json bridge data export docs
        # Publication guard: never commit a conflict marker anywhere.
        bash scripts/repair_conflict_markers.sh --check
        if git diff --staged --quiet; then
          echo "No changes to commit."
          exit 0
        fi
        git status --porcelain -- bridge/ README.md | head -20
        WORKING=$(grep -c . bridge/iran_likely_working_all.txt 2>/dev/null || echo 0)
        WORKING=${WORKING//[$'\t\r\n ']/}
        git commit -m "chore: dual-persist bridge/ + README.md (advisory working: ${WORKING:-0}, run ${GITHUB_RUN_ID}) [skip ci]"
        # Keep the exact, pre-rebase verified snapshot as the publication source.
        # Git's -X theirs resolves conflicting hunks; it does NOT guarantee that
        # an entire JSON manifest or generated file comes from one run. Record
        # this commit so the artifact directories can be restored as whole blobs
        # after each rebase, preventing a mixed-run manifest/payload/ZIP.
        GENERATED_COMMIT="$(git rev-parse HEAD)"
        # Leftover tracked edits outside PATHS (build byproducts) would block
        # the rebase; they are never published, so drop them (no stash).
        git checkout -- . 2>/dev/null || true
        pushed=0
        for attempt in 1 2 3 4 5; do
          git fetch origin main
          if git rebase -X theirs origin/main; then
            # Restore all generated/publication outputs from the same verified
            # pre-rebase tree. Keep source/config merges made by the rebase.
            git checkout "$GENERATED_COMMIT" -- bridge/ data/ docs/ export/ README.md
            git add bridge/ data/ docs/ export/ README.md
            if ! git diff --cached --quiet; then
              git commit -m "chore: preserve atomic generated snapshot [skip ci]"
            fi
            bash scripts/repair_conflict_markers.sh --check
            bash scripts/repair_conflict_markers.sh --validate-json bridge data export docs
            bash scripts/publication_contract.sh --check
            cargo run --locked --quiet --bin sync_bridge_outputs -- \
              --bridge-dir bridge \
              --verify-only
            if git push origin HEAD:main; then pushed=1; break; fi
          else
            echo "rebase conflict on attempt ${attempt}; aborting and retrying"
            git rebase --abort || true
          fi
          sleep $((attempt * 7))
        done
        [ "$pushed" = "1" ] || { echo "::error::could not push publication commit after 5 attempts"; exit 1; }

    # Directive v43 §G: verify what the CDN actually serves after the push.
    # Re-downloads telegram_manifest.json + every payload file from
    # raw.githubusercontent.com and byte-compares each SHA-256 against the
    # manifest. Fail-closed after bounded retries; catches manifest/branch
    # drift that pre-push verification cannot see.
    - name: Stage 11c — Post-push raw-CDN re-verification
      if: ${{ !cancelled() && !failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      timeout-minutes: 8
      run: |
        set -euo pipefail
        if [ ! -f bridge/telegram_manifest.json ]; then
          echo "self no-op: no publication contract on this run"
          exit 0
        fi
        bash scripts/post_push_verification.sh bridge
        echo "- post-push raw-CDN re-verification: passed (all payload files byte-match the manifest)" >> "${GITHUB_STEP_SUMMARY}"

    # Self-healing: a degraded publication (empty-output guard restored
    # last-known-good files, or a stage reported degraded) must leave a
    # durable, human-visible trail beyond the run logs. Best-effort: a
    # failure here never affects publication itself. Mirrors the verdict
    # the guard wrote into data/run_manifest.json + the step summary.
    - name: Stage 11b — degraded publication tracking issue
      if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      continue-on-error: true
      timeout-minutes: 3
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ ! -f data/run_manifest.json ]; then
          echo "no run manifest — run never reached the publication guard; nothing to track"
          exit 0
        fi
        title="[self-heal] Degraded bridge publication — hourly pipeline"
        if [ "$(jq -r '.degraded // false' data/run_manifest.json)" != "true" ]; then
          # Healthy publication: the tracking issue promises "Close this issue
          # once the funnel is healthy again". Honor that promise automatically
          # so a recovered funnel never leaves a stale degradation thread open
          # (issue #257 stayed open for hours after the funnel healed).
          echo "healthy publication — closing any open degraded-publication tracking issue"
          existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "${existing}" ]; then
            restored="$(jq -r '.restored_last_known_good[]?' data/run_manifest.json | sed 's/^/- /' | head -20)"
            files="$(jq -r '.files | length' data/run_manifest.json 2>/dev/null || echo 0)"
            tested_total=0
            for name in obfs4_tested.txt vanilla_tested.txt webtunnel_tested.txt \
                        snowflake_tested.txt meek_lite_tested.txt conjure_tested.txt \
                        meek-azure_tested.txt iran_likely_working_all.txt; do
              count="$(jq -r --arg n "${name}" '.files[$n].count // .files[$n].lines // 0' data/run_manifest.json 2>/dev/null || echo 0)"
              case "${count}" in ''|*[!0-9]*) count=0 ;; esac
              tested_total=$((tested_total + count))
            done
            body="$(mktemp)"
            {
              echo "The hourly Bridge Intelligence run published a **healthy** payload — the funnel recovered, so this tracking issue is being closed automatically."
              echo ""
              echo "- healthy run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "- commit published: ${GITHUB_SHA}"
              echo "- restored last-known-good files this run: ${restored:-(none)}"
              echo "- publication contract files: ${files}"
              echo "- evidence-backed tested/advisory entries this run: ${tested_total}"
              echo ""
              echo "Evidence remains runner-side and advisory. If a later run degrades"
              echo "again, a new comment will be appended here or a fresh tracking issue"
              echo "will be opened."
              echo ""
              echo "<!-- degraded-publication-tracking -->"
            } >"${body}"
            gh issue close "${existing}" --comment "$(cat "${body}")" || \
              echo "::warning::failed to close tracking issue #${existing} automatically"
            rm -f "${body}"
            echo "closed degraded-publication tracking issue #${existing} (healthy run)"
          else
            echo "no open degraded-publication tracking issue"
          fi
          exit 0
        fi
        run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        reasons="$(jq -r '.degraded_reasons[]?' data/run_manifest.json | sed 's/^/- /' | head -10)"
        restored="$(jq -r '.restored_last_known_good[]?' data/run_manifest.json | sed 's/^/- /' | head -20)"
        body="$(mktemp)"
        {
          echo "The hourly Bridge Intelligence run published a **degraded** payload:"
          echo ""
          echo "- run: ${run_url}"
          echo "- commit attempted: ${GITHUB_SHA}"
          echo "- restored last-known-good files (empty-output guard, v42 §A):"
          if [ -n "${restored}" ]; then echo "${restored}"; else echo "- (none)"; fi
          echo "- degradation signals:"
          if [ -n "${reasons}" ]; then echo "${reasons}"; else echo "- (unspecified)"; fi
          echo ""
          echo "The published tree stays internally consistent (manifest/ZIP/README"
          echo "re-attested to the restored bytes), but at least one upstream source"
          echo "needs attention. Close this issue once the funnel is healthy again."
          echo ""
          echo "<!-- degraded-publication-tracking -->"
        } >"${body}"
        title="[self-heal] Degraded bridge publication — hourly pipeline"
        existing="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number' 2>/dev/null || true)"
        if [ -n "${existing}" ]; then
          gh issue comment "${existing}" --body-file "${body}"
          echo "appended degraded-run evidence to tracking issue #${existing}"
        else
          gh issue create --title "${title}" --body-file "${body}"
          echo "opened degraded-publication tracking issue"
        fi
        rm -f "${body}"

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: bridge-intelligence-report
        path: |
          data/pipeline_metrics.json
          data/latest-results.json
          data/pt_results.json
          data/best_transports.json
          data/transport_weight_history.json
          data/quantum_safe_report.json
          data/warp_status.json
          data/dpi_intelligence.json
          data/next_gen_bridges.json
          data/ech_report.json
          data/nin_advanced_report.json
          data/anti_ai_dpi_report.json
          data/iran_siam_report.json
          data/smart_iran_results.json
          docs/iran-bridge-status.md
          docs/iran-siam-analysis.md
          bridge/iran_results.json
          export/iran_cut_pack.txt
          export/iran_phantom_bridges.txt
          export/iran_stealth_bridges.txt
          export/iran_siam_best_bridges.txt
          export/warp_bridges.txt
          export/ech_top_bridges.txt
          export/nin_cut_bridges.txt
          export/anti_ai_dpi_bridges.txt
          export/iran_anti_dpi_elite.txt
          export/iran_anti_dpi_elite.json
          data/nin_cut_report.json
          data/reality_report.json
          data/ai_consensus_report.json
          data/pq_bridge_scores.json
          data/ja3_rotation_plan.json
          data/ja3_rotation_report.md
          data/ct_monitor_report.json
          data/zig_scan.json
          data/collector_yield_report.json
          data/collector_yield_summary.md
          data/collector_yield_history.json
          data/failsafe_activations.json
          diagnostics/torshield_ir_self_heal.json
          export/nin_cut_survivable.txt
          export/reality_configs.json
          export/nin_recommended_transport.json
          export/ct_flagged_domains.txt
          export/ct_clean_bridges.txt
          docs/ebpf_xdp_blueprint.md
          data/funnel_advisory.json
          data/collection_mode.json
        retention-days: 7
        if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────

  # Independent join: Quality Gate does not inspect later jobs. This job runs
  # unless the workflow was cancelled and fails on unexpected skipped / failed /
  # cancelled required jobs. rerank_only dispatch is a documented skip of the
  # collection graph; only ai-rerank / package / cleanup are required then.
  ci-contract:
    name: CI contract
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs:
    - quality-gate
    - build-rust
    - rust-parity-tests
    - scrape-and-test
    - analytics-ml-zig
    - analytics-scoring
    - analytics-ech
    - analytics-nin-advanced
    - analytics-nin
    - analytics-static
    - scrape-and-test-finalize
    - ai-rerank
    - package-final-artifact
    - cleanup
    steps:
    - name: Require expected job results
      env:
        RERANK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.rerank_only == true }}
        QUALITY_GATE: ${{ needs.quality-gate.result }}
        BUILD_RUST: ${{ needs.build-rust.result }}
        RUST_PARITY: ${{ needs.rust-parity-tests.result }}
        SCRAPE: ${{ needs.scrape-and-test.result }}
        ML_ZIG: ${{ needs.analytics-ml-zig.result }}
        SCORING: ${{ needs.analytics-scoring.result }}
        ECH: ${{ needs.analytics-ech.result }}
        NIN_ADV: ${{ needs.analytics-nin-advanced.result }}
        NIN: ${{ needs.analytics-nin.result }}
        STATIC: ${{ needs.analytics-static.result }}
        FINALIZE: ${{ needs.scrape-and-test-finalize.result }}
        RERANK: ${{ needs.ai-rerank.result }}
        PACKAGE: ${{ needs.package-final-artifact.result }}
        CLEANUP: ${{ needs.cleanup.result }}
      run: |
        set -euo pipefail
        fail=0
        check() {
          name="$1"
          result="$2"
          expected="$3"
          echo "${name}=${result} (expected ${expected})"
          if [ "${result}" != "${expected}" ]; then
            echo "::error::${name} result is ${result} (expected ${expected})"
            fail=1
          fi
        }
        {
          echo "### CI contract"
          echo "- rerank_only: \`${RERANK_ONLY}\`"
          echo "- quality-gate: \`${QUALITY_GATE}\`"
          echo "- build-rust: \`${BUILD_RUST}\`"
          echo "- rust-parity-tests: \`${RUST_PARITY}\`"
          echo "- scrape-and-test: \`${SCRAPE}\`"
          echo "- analytics-ml-zig: \`${ML_ZIG}\`"
          echo "- analytics-scoring: \`${SCORING}\`"
          echo "- analytics-ech: \`${ECH}\`"
          echo "- analytics-nin-advanced: \`${NIN_ADV}\`"
          echo "- analytics-nin: \`${NIN}\`"
          echo "- analytics-static: \`${STATIC}\`"
          echo "- scrape-and-test-finalize: \`${FINALIZE}\`"
          echo "- ai-rerank: \`${RERANK}\`"
          echo "- package-final-artifact: \`${PACKAGE}\`"
          echo "- cleanup: \`${CLEANUP}\`"
        } >> "${GITHUB_STEP_SUMMARY}"
        if [ "${RERANK_ONLY}" = "true" ]; then
          check ai-rerank "${RERANK}" success
          check package-final-artifact "${PACKAGE}" success
          check cleanup "${CLEANUP}" success
        else
          check quality-gate "${QUALITY_GATE}" success
          check build-rust "${BUILD_RUST}" success
          check rust-parity-tests "${RUST_PARITY}" success
          check scrape-and-test "${SCRAPE}" success
          check analytics-ml-zig "${ML_ZIG}" success
          check analytics-scoring "${SCORING}" success
          check analytics-ech "${ECH}" success
          check analytics-nin-advanced "${NIN_ADV}" success
          check analytics-nin "${NIN}" success
          check analytics-static "${STATIC}" success
          check scrape-and-test-finalize "${FINALIZE}" success
          check ai-rerank "${RERANK}" success
          check package-final-artifact "${PACKAGE}" success
          check cleanup "${CLEANUP}" success
        fi
        if [ "${fail}" -ne 0 ]; then
          echo "::error::CI contract failed: unexpected skipped/cancelled/failed required job"
          exit 1
        fi
        echo "CI contract satisfied."

    - name: Mode-aware funnel contract
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.rerank_only != true }}
      uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.rerank_only != true }}
      with:
        toolchain: '1.90.0'

    - uses: actions/cache@v6
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.rerank_only != true }}
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-parity-${{ hashFiles('Cargo.toml',
          'Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Restore this-run snapshot
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.rerank_only != true }}
      uses: actions/download-artifact@v8
      with:
        name: bridge-snapshot
        path: .

    - name: Check funnel contract
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.rerank_only != true }}
      run: |
        set -euo pipefail
        cargo run --locked --quiet --bin funnel_advisory -- --check-contract
