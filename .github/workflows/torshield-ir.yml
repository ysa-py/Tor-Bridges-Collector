        restore-keys: |
          ${{ runner.os }}-cargo-pipeline-
          ${{ runner.os }}-cargo-

    - uses: actions/download-artifact@v8
      with:
        name: bridge-snapshot
        path: snapshot
    - uses: actions/download-artifact@v8
      with:
        name: analytics-ml-zig
        path: analytics/ml-zig
    - uses: actions/download-artifact@v8
      with:
        name: analytics-ech
        path: analytics/ech
    - uses: actions/download-artifact@v8
      with:
        name: analytics-nin-advanced
        path: analytics/nin-advanced
    - uses: actions/download-artifact@v8
      with:
        name: analytics-static
        path: analytics/static
    - uses: actions/download-artifact@v8
      with:
        name: analytics-scoring
        path: analytics/scoring
    - uses: actions/download-artifact@v8
      with:
        name: analytics-nin
        path: analytics/nin
    - name: Merge parallel stage outputs (deterministic precedence)
      run: "\nset -euo pipefail\necho \"Restoring snapshot baseline\"\ncp -a snapshot/.
        .\necho \"Merging analytics outputs in precedence order\"\n# ml-zig first
        (updates data/latest-results.json + model/transport/zig files)\ncp -a analytics/ml-zig/.
        . || true\ncp -a analytics/ech/. . || true\n# nin-advanced BEFORE nin so 8p's
        final nin_cut_bridges.txt / nin_eligible /\n# bridge/iran_likely_working_nin.txt
        / iran_cut_pack.txt win where they overlap.\ncp -a analytics/nin-advanced/.
        . || true\ncp -a analytics/static/. . || true\n# scoring last: anti_ai_dpi_report,
        iran_siam_report, smart_iran_results,\n# ja3_rotation_plan (after 8n->8r),
