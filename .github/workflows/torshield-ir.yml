      run: cargo run --quiet --bin pipeline -- --stage dpi --stage anti-ai-dpi 
        --stage rotation --report data/ai_dpi_mutator_report.json

      # Bounded 64-worker pool fixes the former sequential 1,584 × 3-second
      # path that produced the 20-minute timeout shown in IMG_20260803_195634.
      # The module records its configured cap/worker/timeout values in the JSON
      # report, so a future regression is visible rather than silently hanging.
    - name: Stage 8r — Iran SIAM/NGFW Anti-AI DPI evasion analysis
      continue-on-error: true
      timeout-minutes: 6
      run: cargo run --quiet --bin iran_anti_siam

      # Stage 8s fuses the per-run Iran intelligence reports (Stage 8i
      # anti-AI-DPI scoring, Stage 8r SIAM evasion tiers, Stage 8i-smart
      # Smart-Iran AI scores) into ONE deduplicated, DPI-hardened,
      # priority-ordered pack. Deterministic and advisory (runner-side
      # evidence). Emits the whole surviving pool unless the
      # AI_ANTI_DPI_TOP_N repository variable caps it — dynamic by default.
    - uses: actions/upload-artifact@v6
      with:
        name: analytics-scoring
        path: "data/dpi_intelligence.json\ndata/ja3_rotation_plan.json\ndata/ja3_pipeline_report.json\n\
          data/ja3_rotation_report.md\ndata/anti_ai_dpi_report.json\nexport/anti_ai_dpi_bridges.txt\n\
          data/smart_iran_results.json\ndata/iran_siam_report.json\ndata/ai_dpi_mutator_report.json\n\
          data/iran_rotation_plan.json\nexport/iran_rotation_bridges.txt\nexport/iran_phantom_bridges.txt\n\
          export/iran_stealth_bridges.txt\nexport/iran_siam_best_bridges.txt\ndocs/iran-siam-analysis.md"
        retention-days: 7
        if-no-files-found: ignore
