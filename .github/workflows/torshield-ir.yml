        bash scripts/github_actions_env_bootstrap.sh

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: '1.90.0'

    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
         # Scope the cache to the FULL workspace: any crate manifest or
          # lockfile change invalidates the key. Hashing only the root
          # 'Cargo.toml'/'Cargo.lock' missed member manifests under crates/,
          # bridge-probe/ and rust/, so an unchanged lockfile with a changed
          # member manifest silently reused a stale compiled target.
        key: ${{ runner.os }}-cargo-pipeline-${{ hashFiles('**/Cargo.toml',
          '**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-pipeline-
          ${{ runner.os }}-cargo-

    - uses: actions/download-artifact@v8
      with:
        name: bridge-snapshot
        path: .
    - name: Stage 8b — DPI intelligence report
      continue-on-error: true
      timeout-minutes: 5
      run: cargo run --locked --quiet --bin dpi_evasion_advanced

    - name: Stage 8n — JA3/TLS fingerprint rotation engine
      continue-on-error: true
      timeout-minutes: 5
      run: cargo run --locked --quiet --bin pipeline -- --stage ja3 --report
        data/ja3_pipeline_report.json

    - name: Stage 8i — Anti-AI DPI scoring
      continue-on-error: true
      timeout-minutes: 5
      run: cargo run --locked --quiet --bin anti_ai_dpi

    - name: Stage 8i-smart — Smart Iran AI re-ranker (v9.0)
      continue-on-error: true
      timeout-minutes: 8
      env:
          # 0 = dynamic: rank/publish the whole deduplicated pool (documented
          # default); set the AI_RERANK_TOP_N repository variable to cap it.
        AI_RERANK_TOP_N: ${{ vars.AI_RERANK_TOP_N }}
      run: |
        set -euo pipefail
        cargo run --locked --quiet --bin ai_bridge_reranker -- \
          --input bridge/iran_results.json \
          --output data/smart_iran_results.json \
          --top-n "${AI_RERANK_TOP_N:-0}"

      # Stage 8j reads data/dpi_intelligence.json from Stage 8b and rewrites
      # obfuscation parameters when active blocking patterns are detected.
    - name: Stage 8j — Agentic AI DPI mutator (self-heal loop)
      continue-on-error: true
      timeout-minutes: 10
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
        CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: cargo run --locked --quiet --bin pipeline -- --stage dpi --stage anti-ai-dpi
        --stage rotation --report data/ai_dpi_mutator_report.json

      # Bounded 64-worker pool fixes the former sequential 1,584 × 3-second
      # path that produced the 20-minute timeout shown in IMG_20260803_195634.
      # The module records its configured cap/worker/timeout values in the JSON
      # report, so a future regression is visible rather than silently hanging.
    - name: Stage 8r — Iran SIAM/NGFW Anti-AI DPI evasion analysis
      continue-on-error: true
      timeout-minutes: 6
      run: cargo run --locked --quiet --bin iran_anti_siam

      # Stage 8s fuses the per-run Iran intelligence reports (Stage 8i
      # anti-AI-DPI scoring, Stage 8r SIAM evasion tiers, Stage 8i-smart
      # Smart-Iran AI scores) into ONE deduplicated, DPI-hardened,
      # priority-ordered pack. Deterministic and advisory (runner-side
      # evidence). Emits the whole surviving pool unless the
      # AI_ANTI_DPI_TOP_N repository variable caps it — dynamic by default.
    - uses: actions/upload-artifact@v7
      with:
        name: analytics-scoring
        path: "data/dpi_intelligence.json\ndata/ja3_rotation_plan.json\ndata/ja3_pipeline_report.json\n\
          data/ja3_rotation_report.md\ndata/anti_ai_dpi_report.json\nexport/anti_ai_dpi_bridges.txt\n\
          data/smart_iran_results.json\ndata/iran_siam_report.json\ndata/ai_dpi_mutator_report.json\n\
          data/iran_rotation_plan.json\nexport/iran_rotation_bridges.txt\nexport/iran_phantom_bridges.txt\n\
          export/iran_stealth_bridges.txt\nexport/iran_siam_best_bridges.txt\ndocs/iran-siam-analysis.md"
        retention-days: 7
        if-no-files-found: ignore
