# ══════════════════════════════════════════════════════════════════════════
# TorShield-IR Bridge Intelligence — RUST-NATIVE EDITION (2026-08-02)
#
# FIX: this workflow previously declared ONLY `schedule` + `workflow_dispatch`
# triggers, so `git push` and pull requests never started a run (the workflow
# appeared "dead" in the Actions tab). `push` (all branches) and
# `pull_request` triggers have been added.
#
# Python→Rust migration: the last 0.4% of Python has been ported to Rust.
# Every inline Python heredoc and every `actions/setup-python` / `pip` step
# has been replaced by a Rust binary built from this workspace:
#   _yaml_lint.py              -> quality_gate yaml-lint      (src/quality_gate.rs)
#   _validate_requirements.py  -> quality_gate requirements   (src/quality_gate.rs)
#   py_compile sweep           -> quality_gate py-check       (src/quality_gate.rs)
#   _quality_report.py         -> quality_gate report         (src/quality_gate.rs)
#   _failsafe_bridges.py       -> failsafe_bridges            (src/failsafe_bridges.rs)
#   _vercel_cleanup.py         -> vercel_cleanup              (src/vercel_cleanup.rs)
#   scripts/ai_bridge_reranker.py (retired) -> ai_bridge_reranker binary
#
# build-go: the `iran_tester` and `probe_scheduler` binaries are now built
# from source by the scrape-and-test job (via `go build`) before Stages 2
# and 3 every run — no longer trusting committed pre-built binaries. Go
# source vetting/tests remain fully covered by main-ci.yml.
#
# NOTHING ELSE WAS DROPPED: every pipeline stage (0→11), every artifact,
# every output path (bridge/, data/, export/, docs/), the Telegram sync,
# the release packaging, and the cleanup call are preserved.
#
# DUAL PUBLICATION CONTRACT (bridge/ + README.md + Telegram, one verified payload):
#   Stage 9 rebuilds and verifies the complete REQUIRED_FILES inventory in
#   bridge/ — including explicit IPv4/IPv6/all-family projections, historical
#   aliases, JSON inputs/reports, telegram_manifest.json and tor_bridges.zip —
#   via the Rust publisher
#   (src/bridge_publication.rs, driven by sync_bridge_outputs). The same
#   step re-renders README.md from the verified snapshot and, when the
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are configured, delivers
#   the byte-identical verified tor_bridges.zip to Telegram inside the very
#   same run whose Stage 11 commits the payload to git ("dual persist":
#   GitHub and Telegram always receive the same bytes).
#   Full bridge collection/publication and Telegram delivery run only on the
#   main branch (hourly schedule, main push, or main dispatch); pull_request and
#   non-main refs run validation without production collection or deployment.
#   Delivery is ON by default for eligible main runs. It can be disabled per-run
#   with upload_to_telegram=false or repo-wide with TELEGRAM_AUTO_UPLOAD=false.
#   Stage 11 has the same main-only guard, so Telegram and GitHub persistence
#   cannot diverge. Missing Telegram secrets degrade to repo-only publication.
#   Stage 9b re-verifies the complete contract with --verify-only (JSON
#   shapes, every SHA-256 manifest entry, byte-identical ZIP contents), and
#   Stage 10 reads that inventory from telegram_manifest.json and fails the
#   run if any contract file is missing — a broken publication cannot commit.
#   Collection/publication is scheduled hourly (UTC). Runs targeting the same
#   branch serialize without cancellation so every artifact starts from the
#   latest committed state; a full run over an hour can delay/coalesce refreshes.
# ══════════════════════════════════════════════════════════════════════════
name: TorShield-IR Bridge Intelligence

'on':
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      upload_to_telegram:
        # Default ON: scheduled/push/dispatch runs dual-persist the verified
        # tor_bridges.zip to Telegram (same bytes as the git commit). Pick
        # 'false' for a repo-only run, or set the TELEGRAM_AUTO_UPLOAD
        # repository variable to false to disable delivery repo-wide.
        description: 'Upload the verified bridge package to Telegram (requires TELEGRAM_BOT_TOKEN
          + TELEGRAM_CHAT_ID secrets)'
        required: false
        default: 'true'
        type: choice
        options:
        - 'true'
        - 'false'
      bridge_file:
        # Merged from ai_bridge_reranker.yml's own workflow_dispatch.
        description: 'AI re-rank job: path to the bridge JSON file to re-rank'
        required: false
        default: 'bridge/iran_results.json'
      rerank_only:
        # Merged from ai_bridge_reranker.yml. Lets you re-run just the
        # AI re-rank job (against bridge_file above, or whatever
        # bridge/iran_results.json is already committed) without repeating
        # the full ~50-minute collection pipeline. quality-gate, build-rust,
        # rust-parity-tests and scrape-and-test all skip themselves when
        # this is true; ai-rerank runs regardless.
        description: 'Skip collection — only run the AI re-rank job'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_NO_WARNINGS: '1'

permissions:
  actions: write
  contents: write

concurrency:
  # PR validation shares main's group, while only main can enter the live
  # collection/deployment job; serialize against scheduled production runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.base.ref || github.ref_name }}
  cancel-in-progress: false

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  quality-gate:
    # Skips on a rerank_only dispatch (see workflow_dispatch.inputs above).
    # Python tooling (py_compile / PyYAML lint / mypy / ruff / pytest) is
    # retired: the tree is 100% Rust now, and `cargo fmt`/`clippy`/`test` in
    # the rust-parity-tests job below are the strict superset of those gates.
    name: "Quality Gate"
    if: github.event_name != 'workflow_dispatch' || inputs.rerank_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v5

    - name: Bootstrap environment defaults
      run: |
        set -euo pipefail
        bash scripts/github_actions_env_bootstrap.sh

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 'stable'

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
          key: ${{ runner.os }}-cargo-gate-debug-${{ hashFiles('Cargo.toml',
          'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-gate-debug-

    - name: Build quality-gate tooling (Rust)
      id: quality_gate_tooling
      run: |
        set -euo pipefail
        cargo build --bin quality_gate --bin security_scan --bin validate_workflows

      # ── Python-free tree check (replaces the py_compile sweep) ────────────
    - name: Python-free gate (py-check)
      id: python_free_gate
      run: cargo run --quiet --bin quality_gate -- py-check .

      # ── YAML linting (replaces the PyYAML heredoc) ────────────────────────
    - name: YAML linting
      id: yaml_lint
      run: cargo run --quiet --bin quality_gate -- yaml-lint .

      # ── Workflow structural validation (port of validate_workflows.py) ────
    - name: Validate GitHub Actions workflows (structure + platform-shell rules)
      id: workflow_validation
      run: cargo run --quiet --bin validate_workflows -- .github/workflows

      # ── Requirements.txt validation (unchanged schema, Rust engine) ───────
    - name: Validate requirements.txt
      id: requirements_validation
      run: cargo run --quiet --bin quality_gate -- requirements requirements.txt

      # ── Secrets static scan (port of security_scan.py) ────────────────────
    - name: Security scan (dangerous sinks + hard-coded credentials)
      id: security_scan
      run: cargo run --quiet --bin security_scan -- .

      # ── Optional-secret telemetry passes booleans only, never secret values ─
    - name: Test optional-secret reporter
      run: bash scripts/test_report_optional_secrets.sh
    - name: Test probe relay secret validation
      run: bash scripts/test_validate_probe_relay_secrets.sh
    - name: Test probe relay smoke retries and redaction
      run: bash scripts/test_probe_relay_smoke.sh

    - name: Optional secret availability
      id: secret_presence
      env:
        HAS_CEREBRAS_API_KEY_1: ${{ secrets.CEREBRAS_API_KEY_1 != '' }}
        HAS_PORTKEY_API_KEY_1: ${{ secrets.PORTKEY_API_KEY_1 != '' }}
        HAS_CF_ACCOUNT_ID_1: ${{ secrets.CF_ACCOUNT_ID_1 != '' }}
        HAS_CF_API_TOKEN_1: ${{ secrets.CF_API_TOKEN_1 != '' }}
        HAS_GH_PAT_AUTOFIX: ${{ secrets.GH_PAT_AUTOFIX != '' }}
      run: bash scripts/report_optional_secrets.sh

      # ── Generate a legacy-compatible report with actual step outcomes ────
    - name: Generate quality report
      if: ${{ always() && steps.quality_gate_tooling.outcome == 'success' }}
      env:
        PYTHON_SYNTAX_RESULT: ${{ steps.python_free_gate.outcome }}
        YAML_LINT_RESULT: ${{ steps.yaml_lint.outcome }}
        WORKFLOW_VALIDATION_RESULT: ${{ steps.workflow_validation.outcome }}
        REQUIREMENTS_VALIDATION_RESULT: ${{ steps.requirements_validation.outcome }}
        SECURITY_SCAN_RESULT: ${{ steps.security_scan.outcome }}
        SECRET_PRESENCE_RESULT: ${{ steps.secret_presence.outputs.result || steps.secret_presence.outcome }}
        QUALITY_GATE_RESULT: ${{ job.status }}
      run: cargo run --quiet --bin quality_gate -- report .

    - name: Upload quality report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: quality-report-${{ github.run_id }}
        path: data/quality_report.json
        retention-days: 7
        if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────────
  build-rust:
    # Builds the bridge-probe pluggable-transport prober (unchanged).
    if: github.event_name != 'workflow_dispatch' || inputs.rerank_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5

    - name: Bootstrap environment defaults
      run: |
        set -euo pipefail
        bash scripts/github_actions_env_bootstrap.sh

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 'stable'
        components: rustfmt, clippy

      # Cargo.lock is kept deterministic so the cache key below is stable.
    - name: Generate Cargo.lock (required for deterministic builds + cache)
      working-directory: bridge-probe
      run: |
        set -euo pipefail
        if [ ! -f Cargo.lock ]; then
          cargo generate-lockfile
          echo "Cargo.lock generated"
        else
          echo "Cargo.lock already present"
        fi

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          bridge-probe/target
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('bridge-probe/Cargo.lock', 
          'bridge-probe/Cargo.toml', 'Cargo.toml', 'Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Build bridge-probe (release)
      working-directory: bridge-probe
      env:
        RUSTFLAGS: "-D warnings"
      run: |
        set -euo pipefail
        cargo build --release 2>&1

    - name: Stage bridge-probe artifact
      run: |
        set -euo pipefail
        rm -rf artifact-bin
        mkdir -p artifact-bin
        if [ -x bridge-probe/target/release/bridge-probe ]; then
          cp bridge-probe/target/release/bridge-probe artifact-bin/bridge-probe
        elif [ -x target/release/bridge-probe ]; then
          cp target/release/bridge-probe artifact-bin/bridge-probe
        else
          echo "::error::bridge-probe binary not found in member or workspace target directory"
          find . -path '*/release/bridge-probe' -type f -print || true
          exit 1
        fi
        cp bridge-probe/Cargo.lock artifact-bin/Cargo.lock

    - uses: actions/upload-artifact@v6
      with:
        name: bridge-probe-bin
        path: artifact-bin/
        retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  rust-parity-tests:
    # Pure Rust gate: fmt + clippy -D warnings + the full cargo test suite
    # (686+ module tests and all integration contracts). The Python originals
    # are retired, so no Python runtime is needed here any more.
    if: github.event_name != 'workflow_dispatch' || inputs.rerank_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v5

    - name: Bootstrap environment defaults
      run: |
        set -euo pipefail
        bash scripts/github_actions_env_bootstrap.sh

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 'stable'
        components: rustfmt, clippy

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-parity-${{ hashFiles('Cargo.toml', 
          'Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

    - name: Format check
      run: cargo fmt --all -- --check

    - name: Clippy (all features, deny warnings)
      id: clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    # GitHub does not automatically turn rustc's JSON diagnostics into check
    # annotations. Re-run only after a lint failure and publish each warning as
    # an annotation so the exact file, line, and lint remain visible in Checks.
    - name: Annotate Clippy diagnostics
      if: ${{ failure() && steps.clippy.outcome == 'failure' }}
      run: |
        set -euo pipefail
        diagnostic_log="$RUNNER_TEMP/clippy-diagnostics.jsonl"
        set +e
        cargo clippy --workspace --all-targets --all-features --message-format=json -- -D warnings >"$diagnostic_log" 2>&1
        clippy_status=$?
        set -e
        if command -v jq >/dev/null 2>&1; then
          set +e
          jq -Rr '
            fromjson?
            | select(.reason == "compiler-message" and (.message.level == "warning" or .message.level == "error"))
            | .message as $message
            | ([ $message.spans[]? | select(.is_primary) ][0] // {}) as $span
            | [($span.file_name // ""), ($span.line_start // 1 | tostring), ($span.line_end // ($span.line_start // 1) | tostring), ($message.code.code // "rustc"), $message.message]
            | @tsv
          ' "$diagnostic_log" | while IFS=$'\t' read -r file line end_line title message; do
            [[ -n "$file" ]] || continue
            file=${file//'%'/'%25'}
            file=${file//','/'%2C'}
            title=${title//'%'/'%25'}
            title=${title//','/'%2C'}
            title=${title//':'/'%3A'}
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            printf '::error file=%s,line=%s,endLine=%s,title=%s::%s\n' "$file" "$line" "$end_line" "$title" "$message"
          done
          set -e
        fi
        echo "Clippy diagnostic replay exited with status $clippy_status; see the annotations above."

    - name: Full Rust test suite (all features)
      run: cargo test --workspace --all-targets --all-features

    - name: Release build verification
      run: cargo build --workspace --release

  # ────────────────────────────────────────────────────────────────────────────
  scrape-and-test:
    # Full bridge collection + testing pipeline. All stages preserved.
    # iran_tester / probe_scheduler are built from source via `go build` before
    # Stages 2 and 3 every run — no longer trusting committed pre-built binaries.
    # NOTE: timeout raised from 50→90 min because the full pipeline
    # (collect → test → probe → nin-advanced → scoring → export) needs
    # ~74+ min; the old 50-min budget killed Stage 8h before it finished.
    #
    # Only quality-gate + build-rust are true prerequisites (bridge-probe-bin
    # artifact + workflow validation). rust-parity-tests stays an independent
    # gate: it still runs and any failure still fails the workflow, but it no
    # longer delays the ~1h collection pipeline behind a full fmt/clippy/test
    # suite that shares no files with it. Collection is restricted to main so
    # PR/non-main validation cannot deploy to production or consume live secrets.
    # In `rerank_only` dispatch mode, the AI re-ranker uses committed input.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.rerank_only != true)
    runs-on: ubuntu-latest
    needs: [quality-gate, build-rust]
    timeout-minutes: 90
    name: scrape-and-test (core)
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Bootstrap environment defaults
      run: |
        set -euo pipefail
        bash scripts/github_actions_env_bootstrap.sh

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 'stable'

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
         # Scope the cache to the FULL workspace: any crate manifest or
          # lockfile change invalidates the key. Hashing only the root
          # 'Cargo.toml'/'Cargo.lock' missed member manifests under crates/,
          # bridge-probe/ and rust/, so an unchanged lockfile with a changed
          # member manifest silently reused a stale compiled target.
        key: ${{ runner.os }}-cargo-pipeline-${{ hashFiles('**/Cargo.toml', 
          '**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-pipeline-
          ${{ runner.os }}-cargo-

    - name: Remove Vercel secrets (cleanup — additive step, Rust port)
      env:
        GH_PAT_AUTOFIX: ${{ secrets.GH_PAT_AUTOFIX }}
        GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
        GH_REPO_NAME: ${{ secrets.GH_REPO_NAME }}
      run: cargo run --quiet --features network --bin vercel_cleanup

      # IPv4 obfs4 verification is protocol-level: the collector starts this
      # client and confirms SOCKS CONNECT after the obfs4 layer. Package names
      # vary between Ubuntu releases, so absence is explicitly safe and the
      # collector applies its OBFS4_VERIFY_MIN_FRACTION TCP fallback.
    - name: Install obfs4proxy / lyrebird for protocol verification
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y obfs4proxy || true
        if ! command -v obfs4proxy >/dev/null 2>&1; then
          echo "obfs4proxy unavailable; attempting lyrebird"
          sudo apt-get install -y lyrebird || echo "lyrebird unavailable; collector will use documented safe fallback"
        fi

    - name: Build unified collector (release)
      run: cargo build --release --bin tor-bridges-collector

    - name: Stage 00 — Autonomous self-heal pipeline diagnostics
      timeout-minutes: 5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
        CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: cargo run --quiet --bin self_heal -- --heal --strict --output 
        diagnostics/torshield_ir_self_heal.json

    - uses: actions/download-artifact@v8
      with:
        name: bridge-probe-bin
        path: downloaded-bin/

    - name: Restore bridge-probe artifact
      run: |
        set -euo pipefail
        mkdir -p bridge-probe/target/release
        cp downloaded-bin/bridge-probe bridge-probe/target/release/bridge-probe

    - name: Set executable permissions
      run: |
        set -euo pipefail
        for file in \
          bridge-probe/target/release/bridge-probe; do
          if ! test -f "$file"; then
            echo "::error::Missing expected executable: $file"
            find bridge-probe -maxdepth 5 -type f -print
            find . -maxdepth 2 -type f \( -name iran_tester -o -name probe_scheduler \) -print
            exit 1
          fi
          chmod +x "$file"
        done

      # High-volume seeding — runs BEFORE the collector stages to guarantee the
      # full 1500+ real-bridge pool is ingested. refresh_bridge_seed.sh fetches
      # fresh real Tor bridges from the public Delta-Kronecker mirror (via
      # api.github.com) and merges them into bridge/bridge_history.json, which
      # the publisher rebuilds every bridge/*.txt projection from. Non-fatal:
      # an unreachable mirror leaves the existing history untouched. Set the
      # BRIDGE_MIRRORS_REPO repository variable to override the mirror.
    - name: Stage 0s — High-volume bridge seeding (1500+ real bridges)
      continue-on-error: true
      timeout-minutes: 10
      env:
        BRIDGE_MIRRORS_REPO: ${{ vars.BRIDGE_MIRRORS_REPO }}
        # Default ON since 2026-09-09 (v42 §0.1): apply the ip_guard-equivalent
        # documentation/reserved-endpoint filter to mirror lines before the
        # merge. The 2026-09-08 funnel audit found the unguarded merge
        # re-seeds 2001:db8::/32 webtunnel placeholders into the pool every
        # run; the 2026-09-09 verification (all 483 skipped lines genuinely
        # reserved, none routable, 0 legitimate lines dropped — see
        # docs/ZERO_YIELD_ROOT_CAUSE_2026-09-09.md §3) cleared the flip. Set
        # the SEED_STRICT_IP_GUARD repo variable to false to restore the
        # pre-2026-09-09 unguarded merge (fallback path preserved).
        SEED_STRICT_IP_GUARD: ${{ vars.SEED_STRICT_IP_GUARD || 'true' }}
      run: |
        set -euo pipefail
        bash scripts/refresh_bridge_seed.sh
        echo "✅ Seeded the high-volume real-bridge pool into bridge_history.json"

      # Stage 0t (ADDITIVE 2026-09-08): community mirror expansion source.
      # Fetches curated bridge/<transport>.txt projections from additional
      # public community mirrors via the GitHub contents API and validates
      # every line through the SAME format + ip_guard gates as the core
      # sources. ADVISORY BY DEFAULT: per-mirror yield is reported to
      # data/community_mirrors_report.json + ::notice annotations, and
      # bridge_history.json is only touched when the repository variable
      # COMMUNITY_MIRRORS_MERGE=true. Disable entirely with
      # COMMUNITY_MIRRORS=none. No existing source path is modified.
    - name: Stage 0t — Community mirror expansion (additive, advisory default)
      continue-on-error: true
      timeout-minutes: 10
      env:
        COMMUNITY_MIRRORS: ${{ vars.COMMUNITY_MIRRORS || 'center2055/OnionHop-Bridges-Collector' }}
        COMMUNITY_MIRRORS_MERGE: ${{ vars.COMMUNITY_MIRRORS_MERGE || 'false' }}
      run: |
        set -euo pipefail
        cargo run --quiet --features network --bin community_mirrors

    - name: Stage 0 — Direct scraper (bridges.torproject.org seed)
      continue-on-error: true
      timeout-minutes: 5
      run: cargo run --quiet --features network --bin scraper

      # One Rust entry point merges OnionHop.py's source/protocol behavior and
      # vip.py's history/README/ZIP/Telegram behavior. No Python collector is
      # invoked and no capability is duplicated in a second scraper stage.
    - name: Stage 0b — Unified OnionHop + VIP bridge collector
      continue-on-error: true
      # The collector probes many bridge endpoints asynchronously; 96 concurrent
      # workers (over the runner-detected ~16-32 on the default 4-vCPU runner)
      # lets it finish the same candidate set within the step instead of being
      # cut at the stage deadline. AdaptiveConcurrency still backs off per
      # transport when a transport has a low success rate, so this only raises
      # the ceiling — it does not change which bridges are tested or how they
      # are classified.
      timeout-minutes: 14
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_UPLOAD: ${{ secrets.TELEGRAM_UPLOAD }}
        RUST_LOG: info
        MAX_WORKERS: '96'
        # The collector's own graceful guard (STAGE_DEADLINE_SECS) defaults to
        # 660s and writes a *partial* set when it fires, which is why the old
        # Stage 0b always stopped at exactly 11:00. Give it the full step budget
        # (14 min = 840s, minus a 20s safety margin) so the work completes and
        # is published rather than truncated. The step above remains the hard
        # outer bound; if the collector still cannot finish, the existing
        # partial-result fallback fires as designed.
        STAGE_DEADLINE_SECS: '820'
      run: |
        set -euo pipefail
        DETECTED_WORKERS=$(( $(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4) * 8 ))
        [ "$DETECTED_WORKERS" -lt 16 ] && DETECTED_WORKERS=16
        [ "$DETECTED_WORKERS" -gt 512 ] && DETECTED_WORKERS=512
        ./target/release/tor-bridges-collector \
          --max-workers "${MAX_WORKERS:-$DETECTED_WORKERS}" \
          --max-test-per-list "${MAX_TEST_PER_LIST:-0}"

      # Kept as a separate broad-source enrichment pass: it consumes the
      # collector's output and contributes pipeline-specific sources, but no
      # longer duplicates legacy VIP collection/notification behavior.
    - name: Stage 0c — Broad source enrichment scraper
      continue-on-error: true
      timeout-minutes: 5
      run: cargo run --quiet --bin scraper

    - name: Stage 1 — Scraper (all sources)
      timeout-minutes: 10
      run: |
        set -euo pipefail
        cargo run --quiet --features network --bin scraper

    - name: Stage 1x — Extended low-supply source draws + supply diagnostics (additive)
      continue-on-error: true
      timeout-minutes: 8
      env:
        # Bounded, rate-limit-aware extra draws (self-limited; see
        # docs/SUPPLY_EXPANSION.md). 0 disables a family entirely.
        SUPPLY_EXTRA_DRAWS: '1'
        MOAT_EXTRA_ROUNDS: '1'
        # Channel-variant MOAT draws (geolocated + `unblocked: ["ir"]`
        # single-transport payloads; docs/SUPPLY_EXPANSION.md section 7).
        MOAT_VARIANT_ROUNDS: '1'
      run: |
        set -euo pipefail
        cargo run --quiet --features network --bin supply_extender

    - name: FAILSAFE — ensure bridge files always have content (Rust port)
      timeout-minutes: 3
      run: |
        set -euo pipefail
        cargo run --quiet --bin failsafe_bridges

    - uses: actions/setup-go@v6
      with:
        go-version: '1.24'
        # Enable Go module + build-cache reuse across runs. go.sum is
        # intentionally empty (the Go tools use only stdlib), so a
        # go.sum-derived cache key would be a constant; key off the actual
        # dependency manifest instead.
        cache: true
        cache-dependency-path: go.mod

    - name: Build iran_tester and probe_scheduler from source
      run: |
        set -euo pipefail
        CGO_ENABLED=0 GOOS=linux go build -o iran_tester ./cmd/iran_tester/
        CGO_ENABLED=0 GOOS=linux go build -o probe_scheduler ./cmd/probe_scheduler/
        echo "✅ iran_tester and probe_scheduler built from source"

    - name: Stage 2 — iran_tester (TCP/ASN/OONI/CDN analysis)
      timeout-minutes: 12
      run: |
        set -euo pipefail
        ./iran_tester \
          --input  bridge/bridge_list_for_testing.json \
          --output bridge/iran_results.json \
          --workers 100 \
          --timeout 8s

      # probe_scheduler starts an HTTP server that never exits on its own:
      # `timeout 300` force-kills it after 5 min, the PID is captured for
      # the explicit cleanup step, and /tmp/sched_started marks liveness.
    - name: Stage 3 — probe_scheduler (RIPE Atlas + MOAT merge)
      continue-on-error: true
      timeout-minutes: 12
      env:
        RIPE_ATLAS_API_KEY: ${{ secrets.RIPE_ATLAS_API_KEY }}
      run: |
        timeout 300 ./probe_scheduler \
          --bridges data/iran_bridges.json \
          --port 8742 &
        SCHED_PID=$!
        echo "$SCHED_PID" > /tmp/probe_sched.pid
        echo "probe_scheduler PID=$SCHED_PID"
        touch /tmp/sched_started
        sleep 10

      # ── Stage 4-prep — Deploy probe relay Worker + smoke test ─────────────
      #
      # Before the bridge batch, deploy only with the dedicated
      # CF_WORKER_ACCOUNT_ID / CF_WORKER_API_TOKEN secrets (never the
      # CF_ACCOUNT_ID_1..11 rotation slots), then require authenticated live
      # content controls. Missing relay auth skips Stage 4; missing deploy auth
      # skips deployment but still permits a secure smoke test of the live Worker.
    - name: Stage 4-prep — Deploy probe relay + live smoke test
      id: relay_prep
      env:
        PROBE_RELAY_URL: ${{ secrets.PROBE_RELAY_URL }}
        PROBE_RELAY_TOKEN: ${{ secrets.PROBE_RELAY_TOKEN }}
        CF_WORKER_ACCOUNT_ID: ${{ secrets.CF_WORKER_ACCOUNT_ID }}
        CF_WORKER_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
        HAS_PROBE_RELAY_URL: ${{ secrets.PROBE_RELAY_URL != '' }}
        HAS_PROBE_RELAY_TOKEN: ${{ secrets.PROBE_RELAY_TOKEN != '' }}
        HAS_CF_WORKER_ACCOUNT_ID: ${{ secrets.CF_WORKER_ACCOUNT_ID != '' }}
        HAS_CF_WORKER_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN != '' }}
        PROBE_RELAY_SMOKE_REPORT_PATH: ${{ runner.temp }}/probe-relay-smoke.json
        PROBE_RELAY_SMOKE_EVIDENCE_LABEL: live_edge
      run: |
        set -euo pipefail
        echo "═══ Stage 4-prep: Probe Relay Deployment + Smoke Test ═══"

        # Validate explicit secret-presence booleans and formats without
        # printing values. Relay endpoint/token are mandatory; deployment
        # credentials are optional only for reusing an already-deployed Worker.
        if ! bash scripts/validate_probe_relay_secrets.sh; then
          echo "::error::Stage 4 secret validator failed unexpectedly."
          exit 1
        fi
        if grep -Fqx 'PROBE_RELAY_SKIP=true' "${GITHUB_OUTPUT}"; then
          mkdir -p data
          printf '[]\n' > data/pt_results.json
          echo "Relay skipped because required auth/config was invalid; discarded prior-run PT observations."
          exit 0
        fi

        # ── Version-safe deploy guard (additive, 2026-09-08) ──────────
        # Historical failure: main once overwrote a newer relay deployed from a
        # PR branch (confirmed in Wrangler logs on 2026-09-08). Production
        # deployments are now main-only at both the job and step levels; this
        # version check additionally prevents a stale main checkout from
        # replacing a newer deployment made outside this workflow.
        #
        # GUARD: the Worker (v2.8+) exposes its deploy identity additively on
        # the unauthenticated non-POST 405 path as
        #   {"version": {"service", "git_sha", "git_ts"}}
        # where git_sha/git_ts identify the last commit that touched
        # probe-relay/ (injected at deploy time via `wrangler deploy --var`).
        # Before deploying, compare the live version with the version THIS
        # checkout would deploy:
        #   * live reports no version (pre-v2.8 Worker or query failure)
        #       → deploy only when optional deployment credentials are valid
        #   * live sha == incoming sha → skip (identical code; smoke test
        #       still runs below)
        #   * live is strictly newer (incoming is an ancestor of live, or —
        #       for divergent histories — live's commit timestamp is newer)
        #       → SKIP with a warning: the older checkout must not overwrite
        #       the newer deployment
        #   * otherwise → deploy (incoming is newer or equal-lineage)
        # Defense in depth: even if the job-level main-branch condition is
        # changed later, preview refs must never mutate the production Worker.
        RELAY_BASE_URL="${PROBE_RELAY_URL%/}"
        RELAY_BASE_URL="${RELAY_BASE_URL%/probe}"
        INCOMING_SHA="$(git log -1 --format=%H -- probe-relay/ 2>/dev/null || true)"
        INCOMING_TS="$(git log -1 --format=%ct -- probe-relay/ 2>/dev/null || echo 0)"
        if [ -z "${INCOMING_SHA}" ]; then
          # No probe-relay/ history reachable (should not happen: fetch-depth 0)
          # — fall back to the checkout commit so the version is still honest.
          INCOMING_SHA="${GITHUB_SHA}"
          INCOMING_TS="$(git log -1 --format=%ct 2>/dev/null || echo 0)"
        fi
        echo "Incoming relay version: sha=${INCOMING_SHA} ts=${INCOMING_TS} (last commit touching probe-relay/)"

        VERSION_TMP_DIR="$(mktemp -d)"
        trap 'rm -rf "${VERSION_TMP_DIR}"' EXIT
        VERSION_BODY="${VERSION_TMP_DIR}/live-version.json"
        VERSION_CURL_CONFIG="${VERSION_TMP_DIR}/version.curl.conf"
        printf 'url = "%s/"\n' "${RELAY_BASE_URL}" > "${VERSION_CURL_CONFIG}"
        chmod 600 "${VERSION_CURL_CONFIG}"
        LIVE_HTTP_CODE=000
        if LIVE_HTTP_CODE="$(curl --config "${VERSION_CURL_CONFIG}" --silent --show-error --max-time 15 \
            --output "${VERSION_BODY}" --write-out '%{http_code}' 2>/dev/null)"; then
          :
        else
          LIVE_HTTP_CODE=000
        fi
        LIVE_SHA_RAW="$(jq -r '.version.git_sha // empty' "${VERSION_BODY}" 2>/dev/null || true)"
        LIVE_TS_RAW="$(jq -r '.version.git_ts // empty' "${VERSION_BODY}" 2>/dev/null || true)"
        LIVE_SHA=""
        LIVE_TS=""
        if [[ "$LIVE_SHA_RAW" =~ ^[0-9a-f]{40}$ ]]; then
          LIVE_SHA="$LIVE_SHA_RAW"
        fi
        if [[ "$LIVE_TS_RAW" =~ ^[0-9]{1,12}$ ]]; then
          LIVE_TS="$LIVE_TS_RAW"
        fi
        echo "Live relay version query: HTTP ${LIVE_HTTP_CODE} sha=${LIVE_SHA:-<none>} ts=${LIVE_TS:-<none>}"

        DEPLOY_RELAY=true
        SKIP_REASON=""
        if [ -z "${LIVE_SHA}" ]; then
          echo "Live relay did not report a version; deployment will be attempted only if the optional deployment credentials are valid."
        elif [ "${LIVE_SHA}" = "${INCOMING_SHA}" ]; then
          DEPLOY_RELAY=false
          SKIP_REASON="live relay is already at the incoming version ${INCOMING_SHA}"
        else
          LIVE_NEWER=false
          LIVE_NEWER_BECAUSE=""
          if git cat-file -e "${LIVE_SHA}^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "${INCOMING_SHA}" "${LIVE_SHA}" 2>/dev/null \
               && ! git merge-base --is-ancestor "${LIVE_SHA}" "${INCOMING_SHA}" 2>/dev/null; then
              LIVE_NEWER=true
              LIVE_NEWER_BECAUSE="live ${LIVE_SHA:0:10} is a descendant of incoming ${INCOMING_SHA:0:10} (same history line, strictly newer relay code)"
            fi
          fi
          if [ "${LIVE_NEWER}" != "true" ] && [ -n "${LIVE_TS}" ] && [ -n "${INCOMING_TS}" ] \
             && printf '%s' "${LIVE_TS}${INCOMING_TS}" | grep -qE '^[0-9]+$' \
             && [ "${LIVE_TS}" -gt "${INCOMING_TS}" ]; then
            LIVE_NEWER=true
            LIVE_NEWER_BECAUSE="live commit timestamp ${LIVE_TS} > incoming ${INCOMING_TS} (divergent histories: newer relay code stays)"
          fi
          if [ "${LIVE_NEWER}" = "true" ]; then
            DEPLOY_RELAY=false
            SKIP_REASON="${LIVE_NEWER_BECAUSE}"
          fi
        fi
        if [ "${GITHUB_REF}" != "refs/heads/main" ] || [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
          DEPLOY_RELAY=false
          SKIP_REASON="production relay deployment is restricted to main-branch runs"
          echo "::notice::non-main/PR run will smoke-test the live relay but cannot deploy or rotate its token"
        fi
        if grep -Fqx 'PROBE_RELAY_DEPLOY_SKIP=true' "${GITHUB_OUTPUT}"; then
          DEPLOY_RELAY=false
          SKIP_REASON="optional Cloudflare deployment credentials are missing or invalid"
        fi
        if [ "${DEPLOY_RELAY}" != "true" ]; then
          echo "::notice::relay deploy SKIPPED: ${SKIP_REASON}. The smoke test below still runs against the live (newer) deployment."
        fi

        # ── Deploy / re-deploy the Worker via wrangler ──────────────
        # Uses ONLY the dedicated CF_WORKER_ACCOUNT_ID / CF_WORKER_API_TOKEN
        # secrets. The CF_ACCOUNT_ID_1..11 / CF_API_TOKEN_1..11 slots are
        # reserved for the AI Gateway provider rotation system and must not
        # be referenced here.
        if [ -z "${CF_WORKER_ACCOUNT_ID:-}" ] || [ -z "${CF_WORKER_API_TOKEN:-}" ]; then
          echo "::warning::CF_WORKER_ACCOUNT_ID/TOKEN not configured — skipping wrangler deploy"
          echo "::warning::The probe relay Worker may be stale if redeployed outside CI"
        elif ! command -v npx >/dev/null 2>&1; then
          echo "::warning::npx not available — skipping wrangler deploy; using existing Worker deployment"
        elif [ "${DEPLOY_RELAY}" != "true" ]; then
          echo "probe-relay deploy skipped by the version-safe guard: ${SKIP_REASON}"
        else
          echo "Deploying probe-relay Worker via wrangler…"
          export CLOUDFLARE_ACCOUNT_ID="${CF_WORKER_ACCOUNT_ID}"
          export CLOUDFLARE_API_TOKEN="${CF_WORKER_API_TOKEN}"

          # Sync the PROBE_RELAY_TOKEN secret to the Worker so that
          # X-Probe-Token authentication matches between CI (sender)
          # and Worker (validator). This keeps the two in sync
          # automatically every deploy cycle — the owner never needs
          # to run `wrangler secret put` by hand. Skipped together with
          # the deploy when the version guard decides the live Worker is
          # already at this or a newer version (the live Worker's token
          # already matches this repo secret — verified by the smoke test).
          echo "Syncing required PROBE_RELAY_TOKEN to Worker secret…"
          SECRET_SYNC_LOG="${VERSION_TMP_DIR}/secret-sync.log"
          if printf '%s' "${PROBE_RELAY_TOKEN}" | npx wrangler@latest secret put PROBE_RELAY_TOKEN --config probe-relay/wrangler.toml >"${SECRET_SYNC_LOG}" 2>&1; then
            echo "Worker authentication secret synchronized."
          else
            echo "::warning::wrangler secret put failed (details redacted); the authenticated smoke test will fail closed if the live Worker secret does not match."
          fi

          # v2.8: the deploy stamps the Worker with the relay-code version
          # (last commit touching probe-relay/) so future runs — including
          # scheduled runs on other branches — can compare before deploying.
          DEPLOY_LOG="${VERSION_TMP_DIR}/deploy.log"
          if npx wrangler@latest deploy --config probe-relay/wrangler.toml \
               --var "RELAY_GIT_SHA:${INCOMING_SHA}" \
               --var "RELAY_GIT_TS:${INCOMING_TS}" >"${DEPLOY_LOG}" 2>&1; then
            echo "✅ wrangler deploy succeeded (version ${INCOMING_SHA:0:10})"
          else
            echo "::warning::wrangler deploy failed (details redacted); the authenticated smoke test will decide whether Stage 4 can proceed."
          fi
        fi

        # ── Live smoke test: bounded, redacted gate ─────────────────
        # The helper sends authenticated live-open/refused and repository-derived
        # timeout-candidate controls. It requires a fresh Worker-vantage timeout,
        # correlates every echoed target, and validates typed content while
        # redacting endpoints, tokens, bodies, raw curl stderr, and bridge IDs.
        if bash scripts/probe_relay_smoke.sh; then
          echo "✅ Authenticated probe relay content controls passed — Stage 4 will proceed"
          echo "PROBE_RELAY_SKIP=false" >> "${GITHUB_OUTPUT}"
        else
          echo "::notice::Required probe relay canary did not pass; Stage 4 is explicitly skipped for this run. Collection and publication continue."
          echo "PROBE_RELAY_SKIP=true" >> "${GITHUB_OUTPUT}"
          mkdir -p data
          printf '[]\n' > data/pt_results.json
          echo "Prior-run PT observations discarded; no relay result is claimed for this run."
          exit 0
        fi

        # Loopback addresses are intentionally rejected by the public-target
        # validator, so do not send ::1/127.0.0.1 to the deployed relay. IPv6
        # bridge collection/probing remains covered by the normal public-target
        # pipeline; this smoke gate is deliberately IPv4-only.

    - name: Upload redacted live probe-relay canary evidence
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v6
      with:
        name: probe-relay-smoke-${{ github.run_id }}
        path: ${{ runner.temp }}/probe-relay-smoke.json
        if-no-files-found: ignore
        retention-days: 14

      # Stage 4 — External Probe Relay (CI Egress Fix)
      #
      # GitHub Actions runners have restricted outbound egress and cannot
      # reliably complete raw TCP/TLS handshakes to arbitrary Tor bridge
      # IP:port pairs. The in-runner bridge-probe binary is preserved as a
      # fallback when the relay is unreachable, but the primary path now
      # delegates PT handshake verification to an external always-on relay
      # service (Cloudflare Worker, free tier) that has real outbound
      # network access via the cloudflare:sockets connect() API.
      #
      # The relay performs:
      #   - TCP connect for vanilla/obfs4 (prefilter) endpoints
      #   - TLS handshake for domain-fronted transports
      #   - TLS + HTTP WebSocket Upgrade (101 check) for WebTunnel bridges
      #
      # Full obfs4 PT handshake verification remains local (via
      # obfs4proxy/lyrebird SOCKS5 harness) against TCP-reachable endpoints
      # that the relay confirms.
    - name: Stage 4 — External Probe Relay (CI egress fix)
      if: steps.relay_prep.outputs.PROBE_RELAY_SKIP != 'true'
      timeout-minutes: 25
      env:
        PROBE_RELAY_URL: ${{ secrets.PROBE_RELAY_URL }}
        PROBE_RELAY_TOKEN: ${{ secrets.PROBE_RELAY_TOKEN }}
        # Six descriptors per invocation match the Worker's six-socket ceiling
        # and keep each invocation to one bounded wave. Eight request-level
        # workers preserve throughput; the client deterministically merges
        # typed outcomes in input order. The measured per-source funnel records
        # request counts for free-tier budget review.
        PROBE_RELAY_CHUNK_SIZE: '6'
        PROBE_RELAY_PARALLELISM: '8'
      run: |
        set -euo pipefail

        # Bound the authenticated client inside the 25-minute Actions step.
        # On timeout, preserve complete typed chunk outcomes; no missing or
        # invalid response is silently converted into a positive result.
        relay_status=0
        timeout --signal=TERM --kill-after=30s 20m \
          bash scripts/probe_relay.sh \
            bridge/bridge_list_for_testing.json \
            data/pt_results.json || relay_status=$?

        # Explicit truncation accounting distinguishes source candidates from
        # typed outcome records (which can include relay-unavailable S0 entries).
        INPUT_COUNT=$(jq 'length' bridge/bridge_list_for_testing.json 2>/dev/null || echo 0)
        RESULT_COUNT=$(jq 'length' data/pt_results.json 2>/dev/null || echo 0)

        if [ "$relay_status" -eq 124 ] || [ "$relay_status" -eq 137 ]; then
          echo "::warning::Probe relay reached its 20-minute budget; continuing with partial results"
          echo "::warning::Truncation check: ${RESULT_COUNT} typed outcome records for ${INPUT_COUNT} input candidates (budget exhausted before all chunks finished)"
        elif [ "$relay_status" -ne 0 ]; then
          echo "::warning::Probe relay exited with status ${relay_status}; continuing with available results"
        fi

        if ! jq -e 'type == "array"' data/pt_results.json >/dev/null 2>&1; then
          echo "::warning::Probe relay did not leave a valid result array; using an empty supplementary result set"
          printf '[]\n' > data/pt_results.json
          RESULT_COUNT=0
        fi

        RESULT_S2PLUS=$(jq '[.[] | select(.status == "connected" and (.stage == "S2" or .stage == "S3" or .stage == "S4"))] | length' data/pt_results.json 2>/dev/null || echo 0)
        echo "Stage 4 completed with ${RESULT_COUNT} typed outcome records from ${INPUT_COUNT} source candidates; S2+ transport/Tor evidence records=${RESULT_S2PLUS}"

      # WebTunnel-focused automation (strictly additive). Consumes
      # data/pt_results.json written by Stage 4 above and the bridge/
      # history files. Bounded extra draws of the canonical webtunnel pages
      # (WEBTUNNEL_EXTRA_DRAWS=1 round = 2 requests, paced; merged through
      # the exact existing validation/dedup pipeline), an automatic audit of
      # the official rdsys/webtunnel documentation for any NEW canonical
      # distribution mechanism (rdsys distributors today: moat/https/email),
      # and the probe-history sidecar (data/webtunnel_probe_history.json)
      # recording per-transport/per-host relay observations so temporary-down
      # webtunnel fronts are provably re-probed on every run's schedule.
      # Extends the job's supply-diagnostics step summary with a per-channel
      # table; never modifies Stage 1x's data/supply_diagnostics.json.
    - name: Stage 4b — Advanced WebTunnel supply automation (additive)
      continue-on-error: true
      timeout-minutes: 8
      env:
        WEBTUNNEL_EXTRA_DRAWS: '1'
        WEBTUNNEL_DOCS_AUDIT: 'true'
      run: |
        set -euo pipefail
        cargo run --quiet --features network --bin webtunnel_supply_advanced

      # Unconditional cleanup of the backgrounded probe_scheduler; three
      # escalating kill signals plus fuser as the final fallback for port 8742.
    - name: Stage 4 cleanup — kill probe_scheduler
      if: always()
      run: |
        if [ -f /tmp/probe_sched.pid ]; then
          PID=$(cat /tmp/probe_sched.pid)
          echo "Terminating probe_scheduler PID=$PID"
          kill -TERM "$PID" 2>/dev/null || true
          sleep 2
          kill -KILL "$PID" 2>/dev/null || true
          rm -f /tmp/probe_sched.pid
        fi
        fuser -k 8742/tcp 2>/dev/null || true
        echo "probe_scheduler cleanup complete."

    - name: Stage 5 — OONI correlator
      continue-on-error: true
      timeout-minutes: 8
      run: cargo run --quiet --features network --bin ooni_correlator

    - name: Stage 6a — Score bridges
      timeout-minutes: 8
      run: |
        set -euo pipefail
        cargo run --quiet --bin pipeline -- --stage ml --stage rotation --report data/stage6a_score_report.json

    - name: Stage 6b — Export bridge files
      timeout-minutes: 5
      run: |
        set -euo pipefail
        cargo run --quiet --bin pipeline -- --stage results --report data/stage6b_export_report.json

    - uses: actions/upload-artifact@v6
      with:
        name: bridge-snapshot
        path: "bridge/\ndata/\nexport/\ndocs/\ndiagnostics/"
        retention-days: 1
        if-no-files-found: ignore
  ai-rerank:
    # MERGED from ai_bridge_reranker.yml (2026-08-01 consolidation), ported to
    # the Rust-native ai_bridge_reranker binary (the retired
    # scripts/ai_bridge_reranker.py no longer exists). The standalone
    # "just re-rank an existing file" entry point is preserved via the
    # rerank_only workflow_dispatch input — quality-gate, build-rust,
    # rust-parity-tests and scrape-and-test all skip themselves in that mode,
    # and this job runs anyway (if: always()) against whatever
    # bridge/iran_results.json is already checked out.
    name: "AI Bridge Re-Ranker (Iran)"
    needs:
    - scrape-and-test-finalize
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Bootstrap environment defaults
      run: |
        set -euo pipefail
        bash scripts/github_actions_env_bootstrap.sh

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 'stable'

    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-rerank-${{ hashFiles('Cargo.toml', 
          'Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-

      # Same-run artifact pull — replaces the old cross-workflow
      # `gh run download`. Skipped in rerank_only mode or when
      # scrape-and-test failed; the next step then falls back to the
      # bridge/iran_results.json committed in the repo.
    - name: Download this run's bridge intelligence artifact
      if: needs.scrape-and-test-finalize.result == 'success'
      uses: actions/download-artifact@v8
      with:
        name: bridge-intelligence-report
        path: bridge-artifact-tmp/
      continue-on-error: true

    - name: Ensure bridge dir and fallback files
      run: |
        set -euo pipefail
        mkdir -p bridge data export
        if [ -f bridge-artifact-tmp/bridge/iran_results.json ]; then
          cp bridge-artifact-tmp/bridge/iran_results.json bridge/iran_results.json
          echo "Using this run's freshly-collected bridge/iran_results.json"
        elif [ -f bridge/iran_results.json ]; then
          echo "scrape-and-test produced no fresh artifact (skipped or failed) — using bridge/iran_results.json already committed in the repo"
        else
          echo '{"bridges":[],"summary":{"total_tested":0}}' > bridge/iran_results.json
          echo "WARNING: bridge/iran_results.json not found anywhere — created empty placeholder"
        fi

    - name: Run AI Re-Ranking (Rust-native scorer)
      timeout-minutes: 8
      env:
        GITHUB_RUN_ID: ${{ github.run_id }}
        BRIDGE_FILE: ${{ inputs.bridge_file || 'bridge/iran_results.json' }}
          # 0 = dynamic (documented default): rank/publish the whole
          # deduplicated pool. Cap via the AI_RERANK_TOP_N repository variable.
        AI_RERANK_TOP_N: ${{ vars.AI_RERANK_TOP_N }}
      run: |
        set -euo pipefail
        cargo run --quiet --bin ai_bridge_reranker -- \
          --input "$BRIDGE_FILE" \
          --output bridge/bridges_ai_iran_ranked.json \
          --censorship-level 4 \
          --top-n "${AI_RERANK_TOP_N:-0}" || {
            echo "::warning::ai_bridge_reranker failed (advisory rerank job) — not failing the workflow, but the failure is visible here"
          }
        if [ -f bridge/bridges_ai_iran_ranked.json ]; then
          echo "bridge/bridges_ai_iran_ranked.json written (see scorer summary above)"
        fi

    - name: Upload AI-Ranked Bridges
      uses: actions/upload-artifact@v6
      with:
        name: ai-iran-ranked-bridges-${{ github.run_id }}
        path: bridge/bridges_ai_iran_ranked.json
        retention-days: 30
        if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  package-final-artifact:
    name: "Package Final Artifact"
    needs:
    - scrape-and-test-finalize
    - ai-rerank
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Checkout full repo
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Bootstrap environment defaults
      run: |
        set -euo pipefail
        bash scripts/github_actions_env_bootstrap.sh

    - name: Download all stage artifacts
      uses: actions/download-artifact@v8
      with:
        path: all_artifacts/

    - name: Bundle everything into tar.gz
      run: |
        mkdir -p dist/
        tar --exclude='.git' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='bridge-probe/target' \
            --exclude='./dist' \
            --exclude='dist' \
            -czf dist/Tor-Bridges-Collector-main-ultra-quantum-vip-vip-super-ultra-vip-ultra-quantum-ultra-vip-ultra-quantum.tar.gz \
            . all_artifacts/
        echo "Archive size: $(du -sh dist/*.tar.gz | cut -f1)"

    - name: Upload Final Package
      uses: actions/upload-artifact@v6
      with:
        name: TorShield-IR-Final-Package-${{ github.run_id }}
        path: 
          dist/Tor-Bridges-Collector-main-ultra-quantum-vip-vip-super-ultra-vip-ultra-quantum-ultra-vip-ultra-quantum.tar.gz
        retention-days: 90

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
