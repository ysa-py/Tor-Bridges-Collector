      run: |
        set -euo pipefail
        {
          echo "### finalize contract"
          echo "- rerank_only: \`${RERANK_ONLY}\`"
          echo "- scrape-and-test: \`${SCRAPE}\`"
          echo "- analytics-ml-zig: \`${ML_ZIG}\`"
          echo "- analytics-scoring: \`${SCORING}\`"
          echo "- analytics-ech: \`${ECH}\`"
          echo "- analytics-nin-advanced: \`${NIN_ADV}\`"
          echo "- analytics-nin: \`${NIN}\`"
          echo "- analytics-static: \`${STATIC}\`"
        } >> "${GITHUB_STEP_SUMMARY}"
        if [ "${RERANK_ONLY}" = "true" ]; then
          echo "self no-op: rerank_only dispatch does not collect"
          exit 0
        fi
        fail=0
        check() {
          name="$1"
          result="$2"
          echo "${name}=${result}"
          if [ "${result}" != "success" ]; then
            echo "::error::${name} result is ${result} (expected success)"
            fail=1
          fi
        }
        check scrape-and-test "${SCRAPE}"
        check analytics-ml-zig "${ML_ZIG}"
        check analytics-scoring "${SCORING}"
        check analytics-ech "${ECH}"
        check analytics-nin-advanced "${NIN_ADV}"
        check analytics-nin "${NIN}"
        check analytics-static "${STATIC}"
        exit "${fail}"

    - uses: actions/checkout@v7
