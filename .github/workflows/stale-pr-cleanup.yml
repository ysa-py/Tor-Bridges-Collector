concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Stale PR Cleanup

# اجرای خودکار هر شب ساعت ۰۳:۰۰ UTC + امکان اجرای دستی از تب Actions
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      days_old:
        description: "چند روز بدون فعالیت = قدیمی"
        required: false
        default: "30"
      dry_run:
        description: "فقط نمایش بده، چیزی حذف نکن؟"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  pull-requests: write   # برای بستن PR
  contents: write        # برای حذف برنچ

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (فقط برای دسترسی به اسکریپت)
        uses: actions/checkout@v4

      - name: Close stale PRs and delete their branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DAYS_OLD: ${{ github.event.inputs.days_old || '30' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
        run: |
          chmod +x ./.github/scripts/close-stale-prs.sh
          ./.github/scripts/close-stale-prs.sh
