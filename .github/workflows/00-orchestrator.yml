---
name: "00 · Tor-Bridges-Collector Orchestrator"
# ══════════════════════════════════════════════════════════════════════════
# MASTER ORCHESTRATOR — single source of truth.
# Calls every reusable workflow in dependency order:
#   10 → 20 → 30 → 40 → 50 → 60 → 70
# Every job is `needs:`-chained so failures cascade cleanly.
# Triggers: push (all branches), pull_request (main/master), hourly schedule,
#           workflow_dispatch with task selector.
# ══════════════════════════════════════════════════════════════════════════

'on':
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      skip_pipeline:
        description: 'Skip the heavy TorShield-IR pipeline (stages 0-11)?'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  NODE_NO_WARNINGS: '1'
  PYTHONPATH: ${{ github.workspace }}

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: orchestrator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Quality Gate
    uses: ./.github/workflows/10-rust-quality-gate.yml
    secrets: inherit
    with:
      enable-cross-compile: ${{ github.ref == 'refs/heads/main' }}

  build:
    name: Build Binaries
    needs: [quality-gate]
    uses: ./.github/workflows/20-build-binaries.yml
    secrets: inherit

  ai-health:
    name: AI Gateway Health
    needs: [quality-gate]
    uses: ./.github/workflows/30-ai-gateway-health.yml
    secrets: inherit
    with:
      task: general

  legacy-multilang-gate:
    name: Legacy Multi-Language Gate (Go + Python + Rust-parity)
    needs: [quality-gate]
    if: always() && !cancelled()
    uses: ./.github/workflows/15-legacy-multilang-quality.yml
    secrets: inherit

  sentinel-validate:
    name: Autonomous Sentinel (LocalAI validate-and-self-heal)
    needs: [quality-gate]
    if: always() && !cancelled()
    uses: ./.github/workflows/16-autonomous-sentinel.yml
    secrets: inherit

  pipeline:
    name: TorShield-IR Pipeline
    needs: [build, ai-health]
    if: ${{ !github.event.inputs.skip_pipeline }}
    uses: ./.github/workflows/40-torshield-pipeline.yml
    secrets: inherit

  rerank:
    name: AI Bridge Re-Ranker
    needs: [pipeline]
    if: always() && !cancelled()
    uses: ./.github/workflows/50-ai-bridge-reranker.yml
    secrets: inherit

  self-heal:
    name: Self-Healing Engine
    needs: [quality-gate, build, ai-health, legacy-multilang-gate, sentinel-validate, pipeline, rerank]
    if: always() && !cancelled()
    uses: ./.github/workflows/60-self-healing.yml
    secrets: inherit

  cleanup:
    name: Cleanup Engine
    needs: [quality-gate, build, ai-health, legacy-multilang-gate, sentinel-validate, pipeline, rerank, self-heal]
    if: always()
    uses: ./.github/workflows/70-cleanup-engine.yml
    secrets: inherit
    with:
      keep_last_n: '2'
      dry_run: ${{ github.event_name == 'workflow_dispatch' }}

