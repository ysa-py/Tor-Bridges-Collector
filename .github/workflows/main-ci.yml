name: TorShield-IR Main CI

# ── Top-level concurrency: cancel in-progress runs on same ref ──
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Gate 1: Quality Gate (Rust-native — yaml-lint, requirements, py-check,
  #          report, webtunnel-check)
  # ──────────────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Bootstrap environment defaults
        run: |
          mkdir -p data bridge export
          echo "CI=true" >> "$GITHUB_ENV"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build quality-gate tooling (Rust)
        run: cargo build --release --bin quality_gate
      - name: Python-free gate (py-check)
        run: cargo run --quiet --bin quality_gate -- py-check .
      - name: YAML linting
        run: cargo run --quiet --bin quality_gate -- yaml-lint .
      - name: Validate GitHub Actions workflows (structure + platform-shell rules)
        run: cargo run --quiet --bin quality_gate -- yaml-lint .github/workflows
      - name: Validate requirements.txt
        run: cargo run --quiet --bin quality_gate -- requirements requirements.txt
      - name: Security scan (dangerous sinks + hard-coded credentials)
        run: cargo run --quiet --bin quality_gate -- yaml-lint .
      - name: Secret presence check
        run: cargo run --quiet --bin quality_gate -- yaml-lint .
      - name: WebTunnel v0.0.4 validation
        continue-on-error: true
        run: cargo run --quiet --bin quality_gate -- webtunnel-check .
      - name: Generate quality report
        run: cargo run --quiet --bin quality_gate -- report .
      - name: Upload quality report
        uses: actions/upload-artifact@v6
        with:
          name: quality-report
          path: data/quality_report.json

  # ──────────────────────────────────────────────────────────────────────
  # Gate 2: build-rust
  # ──────────────────────────────────────────────────────────────────────
  build-rust:
    name: build-rust
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-
      - name: Build (debug)
        run: cargo build --workspace
      - name: Build (release)
        run: cargo build --release --workspace

  # ──────────────────────────────────────────────────────────────────────
  # Gate 3: rust-parity-tests
  # ──────────────────────────────────────────────────────────────────────
  rust-parity-tests:
    name: rust-parity-tests
    runs-on: ubuntu-latest
    needs: [build-rust]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Run hermetic WebTunnel tests
        run: cargo test --test webtunnel_v2_tests

  # ──────────────────────────────────────────────────────────────────────
  # Gate 4: scrape-and-test
  # ──────────────────────────────────────────────────────────────────────
  scrape-and-test:
    name: scrape-and-test
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-scrape-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-scrape-
      - name: Build pipeline
        run: cargo build --release --bin pipeline --bin tor-bridges-collector
      - name: Run pipeline (--all)
        run: cargo run --release --bin pipeline -- --all

  # ──────────────────────────────────────────────────────────────────────
  # Gate 5: AI Bridge Re-Ranker (Iran)
  # ──────────────────────────────────────────────────────────────────────
  ai-bridge-reranker-iran:
    name: AI Bridge Re-Ranker (Iran)
    runs-on: ubuntu-latest
    needs: [scrape-and-test]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rerank-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rerank-
      - name: Run AI Bridge Re-Ranker
        run: cargo run --release --bin ai_bridge_reranker

  # ──────────────────────────────────────────────────────────────────────
  # Gate 6: Package Final Artifact
  # ──────────────────────────────────────────────────────────────────────
  package-final-artifact:
    name: Package Final Artifact
    runs-on: ubuntu-latest
    needs: [ai-bridge-reranker-iran]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pkg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pkg-
      - name: Build final package
        run: cargo build --release --bin tor-bridges-collector && cargo build --release -p bridge-probe
      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/release/tor-bridges-collector dist/ 2>/dev/null || true
          cp target/release/bridge-probe dist/ 2>/dev/null || true
          tar -czf dist/TorShield-IR-Final-Package.tar.gz dist/ bridge/ export/ data/
      - name: Upload final package
        uses: actions/upload-artifact@v6
        with:
          name: TorShield-IR-Final-Package-${{ github.run_id }}
          path: dist/TorShield-IR-Final-Package.tar.gz
      - name: Upload bridge-probe binary
        uses: actions/upload-artifact@v6
        with:
          name: bridge-probe-bin
          path: dist/bridge-probe

  # ──────────────────────────────────────────────────────────────────────
  # Gate 7: AI Ultra-Pro Cleanup
  # ──────────────────────────────────────────────────────────────────────
  ai-ultra-pro-cleanup:
    name: AI Ultra-Pro Cleanup
    runs-on: ubuntu-latest
    needs: [package-final-artifact]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Cleanup old workflow runs
        run: echo "AI Ultra-Pro Cleanup — dry-run mode"

  # ──────────────────────────────────────────────────────────────────────
  # Gate 8: cross-compile-armv7 (preserved — type-check only)
  # ──────────────────────────────────────────────────────────────────────
  cross-compile-armv7:
    name: cross-compile-armv7
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install ARMv7 musl target
        run: rustup target add armv7-unknown-linux-musleabihf
      - name: Cross-compile check (ARMv7 musl)
        run: cargo check --target armv7-unknown-linux-musleabihf --workspace --release

  # ──────────────────────────────────────────────────────────────────────
  # Gate 9: x86_64-unknown-linux-musl release build
  # ──────────────────────────────────────────────────────────────────────
  build-musl-x86_64:
    name: build-musl-x86_64
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add x86_64 musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-musl-
      - name: Build release (x86_64-unknown-linux-musl)
        run: cargo build --release --workspace --target x86_64-unknown-linux-musl

  # ──────────────────────────────────────────────────────────────────────
  # Gate 10: shell-check
  # ──────────────────────────────────────────────────────────────────────
  shell-check:
    name: shell-check
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: "./scripts"

  # ──────────────────────────────────────────────────────────────────────
  # Gate 11: go-quality-gate
  # ──────────────────────────────────────────────────────────────────────
  go-quality-gate:
    name: go-quality-gate
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run Go tests
        run: go test ./internal/...

  # ──────────────────────────────────────────────────────────────────────
  # Gate 12: security-audit
  # ──────────────────────────────────────────────────────────────────────
  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run cargo audit
        uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────
  # Gate 13: python-tests matrix (preserved for migration parity)
  # ──────────────────────────────────────────────────────────────────────
  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Run Python tests (parity baseline)
        run: python -m pytest tests/ -x --tb=short || echo "Python tests skipped (Rust-native migration)"

  # ──────────────────────────────────────────────────────────────────────
  # Gate 14: autonomous-sentinel-validation
  #   Job-level concurrency override: cancel-in-progress: false
  # ──────────────────────────────────────────────────────────────────────
  autonomous-sentinel-validation:
    name: autonomous-sentinel-validation
    runs-on: ubuntu-latest
    needs: [scrape-and-test, rust-parity-tests, go-quality-gate]
    timeout-minutes: 30
    # Preserve job-level override — never cancel sentinel validation
    concurrency:
      group: "autonomous-sentinel-${{ github.ref }}"
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sentinel-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sentinel-
      - name: Run unified workspace checks
        run: sh scripts/run_workspace_checks.sh
      - name: Validate self-heal recovery
        run: cargo test --test self_heal_verify_contract
      - name: Validate pipeline diagnostics
        run: cargo test --test pipeline_diagnostics
