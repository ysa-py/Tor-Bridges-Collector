name: TorShield-IR Main CI

# ── Top-level concurrency: cancel in-progress runs on same ref ──
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Gate 1: Quality Gate (Rust-native — yaml-lint, requirements, py-check,
  #          report, webtunnel-check)
  # ──────────────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Bootstrap environment defaults
        run: |
          mkdir -p data bridge export
          echo "CI=true" >> "$GITHUB_ENV"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-gate-debug-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-gate-debug-
      - name: Build quality-gate tooling (Rust)
        id: quality_gate_tooling
        run: |
          set -o pipefail
          if ! cargo build --bin quality_gate --bin security_scan --bin validate_workflows 2>&1 | tee "${RUNNER_TEMP}/cargo-gate.log"; then
            python3 - <<'PY'
          from pathlib import Path
          import os, re
          log = Path(os.environ["RUNNER_TEMP"]) / "cargo-gate.log"
          text = log.read_text(errors="replace") if log.exists() else ""
          plain = re.sub(r"\x1b\[[0-9;]*m", "", text)
          lines = plain.splitlines()
          emitted = 0
          for i, line in enumerate(lines):
              if "error[" in line or line.startswith("error:"):
                  for chunk in lines[i:i+16]:
                      print(f"::error::{chunk[:900]}")
                      emitted += 1
                  if emitted > 80:
                      break
          if emitted == 0:
              print("::error::cargo build failed without a rustc error line")
          PY
            exit 101
          fi
      - name: Python-free gate (py-check)
        id: python_free_gate
        run: ./target/debug/quality_gate py-check .
      - name: YAML linting
        id: yaml_lint
        run: ./target/debug/quality_gate yaml-lint .
      - name: Validate GitHub Actions workflows (structure + platform-shell rules)
        id: workflow_validation
        run: ./target/debug/validate_workflows .github/workflows
      - name: Validate requirements.txt
        id: requirements_validation
        run: ./target/debug/quality_gate requirements requirements.txt
      - name: Security scan (dangerous sinks + hard-coded credentials)
        id: security_scan
        run: ./target/debug/security_scan .
      - name: Test optional-secret reporter
        run: bash scripts/test_report_optional_secrets.sh
      - name: Test probe relay secret validation
        run: bash scripts/test_validate_probe_relay_secrets.sh
      - name: Test probe relay smoke retries and redaction
        run: bash scripts/test_probe_relay_smoke.sh
      - name: Optional secret availability
        id: secret_presence
        env:
          HAS_CEREBRAS_API_KEY_1: ${{ secrets.CEREBRAS_API_KEY_1 != '' }}
          HAS_PORTKEY_API_KEY_1: ${{ secrets.PORTKEY_API_KEY_1 != '' }}
          HAS_CF_ACCOUNT_ID_1: ${{ secrets.CF_ACCOUNT_ID_1 != '' }}
          HAS_CF_API_TOKEN_1: ${{ secrets.CF_API_TOKEN_1 != '' }}
          HAS_GH_PAT_AUTOFIX: ${{ secrets.GH_PAT_AUTOFIX != '' }}
        run: bash scripts/report_optional_secrets.sh
      - name: WebTunnel v0.0.4 validation
        id: webtunnel_validation
        continue-on-error: true
        run: ./target/debug/quality_gate webtunnel-check .
      - name: Generate quality report
        if: ${{ always() && steps.quality_gate_tooling.outcome == 'success' }}
        env:
          PYTHON_SYNTAX_RESULT: ${{ steps.python_free_gate.outcome }}
          YAML_LINT_RESULT: ${{ steps.yaml_lint.outcome }}
          WORKFLOW_VALIDATION_RESULT: ${{ steps.workflow_validation.outcome }}
          REQUIREMENTS_VALIDATION_RESULT: ${{ steps.requirements_validation.outcome }}
          SECURITY_SCAN_RESULT: ${{ steps.security_scan.outcome }}
          SECRET_PRESENCE_RESULT: ${{ steps.secret_presence.outputs.result || steps.secret_presence.outcome }}
          WEBTUNNEL_VALIDATION_RESULT: ${{ steps.webtunnel_validation.outcome }}
          QUALITY_GATE_RESULT: ${{ job.status }}
        run: ./target/debug/quality_gate report .
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-report
          path: data/quality_report.json
          retention-days: 7
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────────
  # Gate 2: build-rust
  # ──────────────────────────────────────────────────────────────────────
  build-rust:
    name: build-rust
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-
      - name: Build (debug)
        run: |
          set -o pipefail
          if ! cargo build --workspace 2>&1 | tee "${RUNNER_TEMP}/cargo-workspace.log"; then
            python3 - <<'PY'
          from pathlib import Path
          import os, re
          log = Path(os.environ["RUNNER_TEMP"]) / "cargo-workspace.log"
          text = log.read_text(errors="replace") if log.exists() else ""
          plain = re.sub(r"\x1b\[[0-9;]*m", "", text)
          lines = plain.splitlines()
          emitted = 0
          for i, line in enumerate(lines):
              if "error[" in line or line.startswith("error:"):
                  for chunk in lines[i:i+16]:
                      print(f"::error::{chunk[:900]}")
                      emitted += 1
                  if emitted > 80:
                      break
          PY
            exit 101
          fi
      - name: Build (release)
        run: cargo build --release --workspace

  # ──────────────────────────────────────────────────────────────────────
  # Gate 3: rust-parity-tests
  # ──────────────────────────────────────────────────────────────────────
  rust-parity-tests:
    name: rust-parity-tests
    runs-on: ubuntu-latest
    needs: [build-rust]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - name: Run Rust tests
        run: |
          set -o pipefail
          if ! cargo test --workspace 2>&1 | tee "${RUNNER_TEMP}/cargo-test.log"; then
            bash scripts/annotate_cargo_log.sh "${RUNNER_TEMP}/cargo-test.log"
            exit 101
          fi
      - name: Run hermetic WebTunnel tests
        run: cargo test --test webtunnel_v2_tests

  # ──────────────────────────────────────────────────────────────────────
  # Gate 3b: probe-relay-vitest (ADDITIVE 2026-09-08)
  #
  # probe-relay/src/index.test.ts is a real vitest suite (49 tests over the
  # Cloudflare Worker probe relay: concurrency queue, fronted-probe class
  # ordering, safeConnect reader-lock release, MAX_CONCURRENT_PROBES
  # semantics) that NO workflow ever executed before — the relay deployed
  # to Cloudflare was only ever covered by the deploy smoke test. This gate
  # runs the suite on every push/PR so a Worker regression fails CI before
  # it can silently regress the live probe stage (the exact cron-redeploy
  # failure mode the project already hit once).
  # ──────────────────────────────────────────────────────────────────────
  probe-relay-vitest:
    name: probe-relay-vitest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: probe-relay/package-lock.json
      - name: Install dependencies
        working-directory: probe-relay
        run: npm ci
      - name: Run vitest suite
        working-directory: probe-relay
        run: npm test

  # ──────────────────────────────────────────────────────────────────────
  # Gate 4: scrape-and-test
  # ──────────────────────────────────────────────────────────────────────
  scrape-and-test:
    name: scrape-and-test
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-scrape-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-scrape-
      - name: Build pipeline
        run: cargo build --release --bin pipeline --bin tor-bridges-collector
      # PRs still compile/validate; only main may run live pipeline stages.
      - name: Run pipeline (--all)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: cargo run --release --bin pipeline -- --all

  # ──────────────────────────────────────────────────────────────────────
  # Gate 5: AI Bridge Re-Ranker (Iran)
  # ──────────────────────────────────────────────────────────────────────
  ai-bridge-reranker-iran:
    name: AI Bridge Re-Ranker (Iran)
    runs-on: ubuntu-latest
    needs: [scrape-and-test]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rerank-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-rerank-
      - name: Ensure bridge dir and fallback input
        run: |
          set -euo pipefail
          mkdir -p bridge
          if [[ ! -f bridge/iran_results.json ]]; then
            printf '%s\n' '{"bridges":[],"summary":{"total_tested":0}}' > bridge/iran_results.json
            echo "No checked-out bridge snapshot; using an empty input for the reranker smoke test."
          fi
      - name: Run AI Bridge Re-Ranker
        run: cargo run --release --bin ai_bridge_reranker -- --input bridge/iran_results.json --output bridge/bridges_ai_iran_ranked.json --censorship-level 4 --top-n 0

  # ──────────────────────────────────────────────────────────────────────
  # Gate 6: Package Final Artifact
  # ──────────────────────────────────────────────────────────────────────
  package-final-artifact:
    name: Package Final Artifact
    runs-on: ubuntu-latest
    needs: [ai-bridge-reranker-iran]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pkg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pkg-
      - name: Build final package
        run: cargo build --release --bin tor-bridges-collector && cargo build --release -p bridge-probe
      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist bridge export data
          cp target/release/tor-bridges-collector dist/ 2>/dev/null || true
          cp target/release/bridge-probe dist/ 2>/dev/null || true
          tar -czf TorShield-IR-Final-Package.tar.gz --exclude='*.tar.gz' dist/ bridge/ export/ data/
          mv TorShield-IR-Final-Package.tar.gz dist/
      - name: Upload final package
        uses: actions/upload-artifact@v6
        with:
          name: TorShield-IR-Final-Package-${{ github.run_id }}
          path: dist/TorShield-IR-Final-Package.tar.gz
      - name: Upload bridge-probe binary
        uses: actions/upload-artifact@v6
        with:
          name: bridge-probe-bin
          path: dist/bridge-probe

  # ──────────────────────────────────────────────────────────────────────
  # Gate 7: AI Ultra-Pro Cleanup
  # ──────────────────────────────────────────────────────────────────────
  ai-ultra-pro-cleanup:
    name: AI Ultra-Pro Cleanup
    runs-on: ubuntu-latest
    needs: [package-final-artifact]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Cleanup old workflow runs
        run: echo "AI Ultra-Pro Cleanup — dry-run mode"

  # ──────────────────────────────────────────────────────────────────────
  # Gate 8: cross-compile-armv7 (preserved — type-check only)
  # ──────────────────────────────────────────────────────────────────────
  cross-compile-armv7:
    name: cross-compile-armv7
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install ARMv7 musl target
        run: bash scripts/retry_cmd.sh rustup target add armv7-unknown-linux-musleabihf
      - name: Cross-compile check (ARMv7 musl)
        run: cargo check --target armv7-unknown-linux-musleabihf --workspace --release

  # ──────────────────────────────────────────────────────────────────────
  # Gate 9: x86_64-unknown-linux-musl release build
  # ──────────────────────────────────────────────────────────────────────
  build-musl-x86_64:
    name: build-musl-x86_64
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install musl tools
        run: bash scripts/retry_cmd.sh sudo apt-get update && bash scripts/retry_cmd.sh sudo apt-get install -y musl-tools
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add x86_64 musl target
        run: bash scripts/retry_cmd.sh rustup target add x86_64-unknown-linux-musl
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-musl-
      - name: Build release (x86_64-unknown-linux-musl)
        run: cargo build --release --workspace --target x86_64-unknown-linux-musl

  # ──────────────────────────────────────────────────────────────────────
  # Gate 10: shell-check
  # ──────────────────────────────────────────────────────────────────────
  shell-check:
    name: shell-check
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: "./scripts"

  # ──────────────────────────────────────────────────────────────────────
  # Gate 10b: invariant-audit — always-on static/data integrity magnifier.
  # Verifies JSON parse-ability, the manifest-driven bridge publication
  # contract, the lib.rs module graph, pipeline STAGES<->dispatch<->workflow
  # wiring, per-bridge
  # evidence stamps, duplicate-free bridge lists, shell syntax, and that the
  # committed Stage 8s Anti-DPI Elite artifacts are fresh (identical to a
  # regeneration from the committed reports). Offline, fast, fail-loud.
  # ──────────────────────────────────────────────────────────────────────
  invariant-audit:
    name: invariant-audit
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run repository invariant audit
        run: bash scripts/verify_repo_invariants.sh

  # ──────────────────────────────────────────────────────────────────────
  # Gate 11: go-quality-gate
  # ──────────────────────────────────────────────────────────────────────
  go-quality-gate:
    name: go-quality-gate
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
      - name: Run Go tests
        run: go test ./internal/...

  # ──────────────────────────────────────────────────────────────────────
  # Gate 12: security-audit
  # ──────────────────────────────────────────────────────────────────────
  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit

  # ──────────────────────────────────────────────────────────────────────
  # Gate 13: python-tests matrix (preserved for migration parity)
  # ──────────────────────────────────────────────────────────────────────
  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    needs: [quality-gate]
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Run Python tests (parity baseline)
        run: python -m pytest tests/ -x --tb=short || echo "Python tests skipped (Rust-native migration)"

  # ──────────────────────────────────────────────────────────────────────
  # Gate 14: autonomous-sentinel-validation
  #   Job-level concurrency override: cancel-in-progress: false
  # ──────────────────────────────────────────────────────────────────────
  autonomous-sentinel-validation:
    name: autonomous-sentinel-validation
    runs-on: ubuntu-latest
    needs: [scrape-and-test, rust-parity-tests, go-quality-gate]
    timeout-minutes: 30
    # Preserve job-level override — never cancel sentinel validation
    concurrency:
      group: "autonomous-sentinel-${{ github.ref }}"
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: probe-relay/package-lock.json
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sentinel-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sentinel-
      - name: Run unified workspace checks
        run: bash scripts/run_workspace_checks.sh
      - name: Validate self-heal recovery
        run: cargo test --test self_heal_verify_contract
      - name: Validate pipeline diagnostics
        run: cargo test --test pipeline_diagnostics
