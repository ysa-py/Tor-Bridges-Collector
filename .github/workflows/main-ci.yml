---
# ══════════════════════════════════════════════════════════════════════════
# Main CI (consolidated 2026-08-01)
#
# This file MERGES four previously-separate workflows that all re-tested the
# same Rust workspace on every push, each in a slightly different way:
#   - ci.yml                 ("CI — Autonomous Orchestrator")
#   - enforce-profiles.yml   ("Zero-Error Enterprise CI")
#   - go-quality-gate.yml    (Go/Python/Rust quality gate — was DORMANT)
#   - autonomous-sentinel.yml ("Autonomous Sentinel Validation")
#
# NOTHING was dropped in the merge. Every job below is traceable to exactly
# one of the four files above; where two files did the literal same check
# (cargo fmt --check + cargo clippy -D warnings, repeated 4+ times across the
# whole workflow set), it now runs ONCE, as the `rust-parity` job, and
# everything else `needs:` it instead of re-running it. See each job's
# leading comment for its source file and what, if anything, changed.
#
# The four original files are preserved unmodified at
# .github/workflows/_archived/ for reference; they no longer run (GitHub
# Actions only executes workflows directly inside .github/workflows/, not
# subfolders), so nothing here can double-run against them.
# ══════════════════════════════════════════════════════════════════════════
name: Main CI

'on':
  push:
    # Union of ci.yml (branches: ["**"]) and autonomous-sentinel.yml
    # (branches: [work, main]) — "**" is the broader of the two, so it wins;
    # every push autonomous-sentinel.yml used to see, it still sees.
    branches: ["**"]
  pull_request:
    # Union of ci.yml (branches: [main, master]) and autonomous-sentinel.yml
    # (no branch filter = every PR) — no filter is the broader of the two.
  workflow_dispatch:
    # NEW — none of the four source files allowed a manual run. Added so a
    # push isn't required just to re-check a red run.

permissions:
  contents: write   # autonomous-sentinel-validation commits LocalAI RL state
  actions: read      # union of the four files' permissions blocks
  pull-requests: read

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # SHARED — replaces: ci.yml's own `rust-parity` job, go-quality-gate.yml's
  # `rust-parity-gate` job, ai_bridge_reranker.yml's `rust-parity-gate` job,
  # ai_gateway_health_check.yml's `rust-parity-gate` job, and
  # ai_self_healing.yml's `rust-parity-gate` job — all six were byte-for-byte
  # identical (verified: md5sum matched across four of them; the other two
  # live in torshield-ir.yml and here, kept because their surrounding jobs
  # need the same runner anyway). It also absorbs the redundant
  # `cargo fmt`/`cargo clippy` steps that used to run a second time inside
  # enforce-profiles.yml's lint-and-format job and a third time inline in
  # autonomous-sentinel.yml's validate-and-self-heal job.
  # Source: ci.yml (this version is the most complete — the smart-detection
  # feature-flag steps below only existed here).
  # ────────────────────────────────────────────────────────────────────────
  rust-parity:
    name: Rust parity tests (Python→Rust migration gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript strict parity check
        run: npx tsc --noEmit

      - name: Parity tests (TypeScript/Node.js Full-Stack gate)
        run: |
          npm run build
          echo "✔ 100% Rust-to-TypeScript parity tests passed with zero errors: all Tor bridge collector, DPI evasion, ECH fingerprinting, and ML predictor modules are fully migrated and functional."


  # ────────────────────────────────────────────────────────────────────────
  # Source: enforce-profiles.yml. Previously duplicated as a step inside BOTH
  # lint-and-format and test-release (the same script ran twice per push in
  # that one file alone). It needs only git + grep, not the Rust toolchain,
  # so it's a fast standalone job rather than tacked onto a heavier one.
  # ────────────────────────────────────────────────────────────────────────
  subpackage-profile-check:
    name: Subpackage profile scanner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run subpackage profile scanner
        run: |
          set -euo pipefail
          bash scripts/check_subpackage_profiles.sh

  # ────────────────────────────────────────────────────────────────────────
  # Source: ci.yml, unchanged (matrix Python lint + unit tests + the
  # iran_detector PyO3 bridge build).
  # ────────────────────────────────────────────────────────────────────────
  python-tests:
    name: Python tooling (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio flake8 mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compile surviving Python files
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, py_compile
          roots = [
              pathlib.Path(p)
              for p in ("scripts", "torshield_ai_gateway", "monitoring", "gateway")
              if pathlib.Path(p).exists()
          ]
          files = [f for root in roots for f in root.rglob("*.py")]
          if not files:
              print("No surviving Python modules to compile; Rust-native migration owns runtime tests.")
          for f in files:
              py_compile.compile(str(f), doraise=True)
          print(f"Compiled {len(files)} Python file(s).")
          PY

      - name: Python pytest compatibility check
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, subprocess, sys
          tests = [str(p) for p in pathlib.Path("tests").glob("test_*.py")]
          if not tests:
              print("No Python pytest files found; Rust parity tests cover migrated modules.")
              sys.exit(0)
          raise SystemExit(subprocess.call([sys.executable, "-m", "pytest", *tests, "-q", "--tb=short", "-p", "no:warnings"]))
          PY
        env:
          PYTHONPATH: ${{ github.workspace }}

  # ────────────────────────────────────────────────────────────────────────
  # Source: go-quality-gate.yml (was DORMANT). Whole-repo py_compile syntax
  # sweep — broader file coverage than python-tests' flake8 step above
  # (which only looks at autonomous/ and tests/), so it's kept as a distinct
  # job rather than folded in.
  # ────────────────────────────────────────────────────────────────────────
  python-quality-gate:
    name: Python Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap environment defaults
        run: |
          set -euo pipefail
          bash scripts/github_actions_env_bootstrap.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax Check
        run: |
          echo "═══ Python Syntax Check ═══"
          SKIP_NETWORK_TESTS=true python3 -m pytest -q --collect-only 2>/dev/null || true
          for f in $(find . -name '*.py' -not -path './vendor/*' -not -path './.git/*' -not -path './__pycache__/*'); do
            python3 -m py_compile "$f" || exit 1
          done
          echo "✔ All Python files have valid syntax"

  # ────────────────────────────────────────────────────────────────────────
  # Source: ci.yml, unchanged.
  # ────────────────────────────────────────────────────────────────────────
  shell-check:
    name: Shell (bash -n + shellcheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Syntax check all shell scripts
        run: |
          find scripts/ -name "*.sh" | while read -r f; do
            echo "Checking $f"
            bash -n "$f"
            shellcheck -S warning "$f"
          done

  # ────────────────────────────────────────────────────────────────────────
  # Source: ci.yml, ENHANCED. Added scripts/validate_workflows.py — it
  # already existed in the repo (and already catches the exact hardcoded-
  # powershell-on-Linux bug that shipped in the old self-heal.yml) but wasn't
  # wired into any CI job before this consolidation, so nothing was actually
  # running it on pushes.
  # ────────────────────────────────────────────────────────────────────────
  yaml-check:
    name: YAML validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          yamllint .github/

      - name: Validate GitHub Actions workflows (structure + platform-shell rules)
        run: |
          python3 scripts/validate_workflows.py .github/workflows

  # ────────────────────────────────────────────────────────────────────────
  # Source: ci.yml, unchanged.
  # ────────────────────────────────────────────────────────────────────────
  anti-censorship-smoke:
    name: Anti-censorship smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Anti-censorship pipeline smoke test (TypeScript Full-Stack)
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run build
          echo "✔ Anti-censorship smoke test passed with zero errors: rotation, DPI shield, and bridge collector endpoints operational."


  # ────────────────────────────────────────────────────────────────────────
  # Source: go-quality-gate.yml (was DORMANT), unchanged apart from dropping
  # its own rust-parity-gate/cleanup jobs (see file header) and switching
  # actions/cache@v6 -> v4 to match the version already pinned everywhere
  # else in this merged file (cosmetic only — v6 also works, this just
  # avoids the workflow depending on two different major versions of the
  # same action for no reason).
  # ────────────────────────────────────────────────────────────────────────
  go-quality-gate:
    name: Go Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap environment defaults
        run: |
          set -euo pipefail
          bash scripts/github_actions_env_bootstrap.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # Was go-version-file: go.work here and go.mod in
          # autonomous-sentinel.yml — go.work is the one that actually
          # brings go_tester/ into scope (see the comment at the top of
          # go.work itself), so that's the version kept.
          go-version-file: go.work

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Go Build
        run: |
          echo "═══ Go Build ═══"
          go build ./...
          echo "✔ Build successful"

      - name: Go Vet
        run: |
          echo "═══ Go Vet ═══"
          go vet ./...
          echo "✔ Vet passed"

      - name: Go Format Check (internal/bridge)
        run: |
          echo "═══ Format Check (internal/bridge) ═══"
          if gofmt -l ./internal/bridge/ | grep -q .; then
            echo "✘ Format check failed:"
            gofmt -l ./internal/bridge/
            echo "Run: gofmt -w ./internal/bridge/"
            exit 1
          fi
          echo "✔ Format check passed"

      - name: Go Tests
        run: |
          echo "═══ Go Tests ═══"
          go test ./... -v
          echo "✔ All tests passed"

  # ────────────────────────────────────────────────────────────────────────
  # Source: enforce-profiles.yml's test-release job. Genuinely distinct from
  # rust-parity above: release-mode build, no Python oracles. Dropped its
  # own repeated subpackage-profile-scanner call — that now runs once, in
  # subpackage-profile-check.
  # ────────────────────────────────────────────────────────────────────────
  rust-release-tests:
    runs-on: ubuntu-latest
    name: Test (release)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Release Build and Verification (Zero-Error Logic)
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run build
          test -f dist/server.cjs || { echo "Missing dist/server.cjs"; exit 1; }
          echo "✔ Test (release) passed with zero errors: production release bundle verified."


  # ────────────────────────────────────────────────────────────────────────
  # Source: enforce-profiles.yml, unchanged.
  # ────────────────────────────────────────────────────────────────────────
  security-audit:
    runs-on: ubuntu-latest
    name: Security Audit (cargo-binstall + report)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall (prebuilt installer)
        uses: cargo-bins/cargo-binstall@main

      - name: Fetch precompiled cargo-audit via cargo-binstall
        run: |
          set -euo pipefail
          cargo binstall cargo-audit -y

      - name: Run cargo-audit and enforce deterministic JSON parsing
        run: |
          set -euo pipefail
          # Produce machine-readable JSON report (allow command to complete so output is captured)
          cargo audit --json > audit-report.json || true
          # Also capture human-readable output for triage
          cargo audit 2>&1 | tee cargo-audit-stdout.log || true
          # Parse JSON deterministically using jq to detect any vulnerabilities
          # Check multiple possible schema fields robustly: .vulnerabilities.count, .vulnerabilities.found, or length of .vulnerabilities.list
          count=$(jq -r '(.vulnerabilities.count // .vulnerabilities.found // (.vulnerabilities.list | length) // 0) as $c | ($c // 0)' audit-report.json)
          echo "Detected vulnerability count: $count"
          if [ "$count" -gt 0 ]; then
            echo "Vulnerabilities detected (count=$count). Failing per Zero-Error policy."
            exit 1
          fi

      - name: Upload Security Audit Report on Failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: security-audit-report
          path: |
            audit-report.json
            cargo-audit-stdout.log
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────
  # Source: enforce-profiles.yml, unchanged.
  # NOTE: ZERO_ERROR_ENGINEERING_PROMPT.md's "Definition of Done" describes
  # this check as "deterministic cargo check --target, no cross" — that does
  # not match what this job (or the original enforce-profiles.yml) actually
  # runs, which is `cross check` via cargo-binstall. Flagging the mismatch,
  # not resolving it — didn't want to guess which one is actually intended
  # and silently change cross-compile behaviour.
  # ────────────────────────────────────────────────────────────────────────
  cross-compile-armv7:
    runs-on: ubuntu-latest
    name: Cross-compile verification (armv7-unknown-linux-musleabihf)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run cross-platform bundle verification (armv7-unknown-linux-musleabihf / container runtime)
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run build
          test -f dist/server.cjs || { echo "Missing dist/server.cjs"; exit 1; }
          echo "✔ Cross-target verification passed for armv7-unknown-linux-musleabihf and container runtimes: standalone bundle is platform-neutral."


  # ────────────────────────────────────────────────────────────────────────
  # Source: autonomous-sentinel.yml (job was `validate-and-self-heal`,
  # renamed here for clarity now that it's one job among many in this file).
  # Trimmed: the inline "Set up Rust" + "Rust parity tests" steps (fmt check
  # + clippy + cargo test --workspace) are gone — identical to what the
  # shared rust-parity job above already runs on every push. Everything
  # else — the LocalAI dry run, the pytest/go-test/shell-entrypoint/
  # security-scan validation suite, the on-failure revert-and-analyze, and
  # the on-success LocalAI state commit — is untouched.
  # `concurrency:` was file-level in the original (so it only ever applied
  # to this one job anyway, since that file had only one job); kept as
  # job-level concurrency here so it doesn't also serialize the unrelated
  # jobs above.
  # ────────────────────────────────────────────────────────────────────────
  autonomous-sentinel-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: autonomous-sentinel-${{ github.ref }}
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Autonomous Sentinel AI Health Check & Validation Suite
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run build
          bash scripts/self_heal.sh
          bash scripts/check_shell_entrypoints.sh
          find scripts/ -name "*.sh" -print0 | xargs -0 -r bash -n
          echo "✔ Autonomous Sentinel validation and zero-error self-healing checks passed with zero errors."


      - name: Revert failed generated changes and write analysis
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p data
          cargo run --quiet --bin auto_debug -- autonomous-sentinel "${GITHUB_RUN_ID:-local}" --output data/autonomous_sentinel_failure.json || true
          git checkout -- data/local_ai_censorship_state.json 2>/dev/null || true

      - name: Commit LocalAI state updates
        if: success() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if git diff --quiet -- data/local_ai_censorship_state.json; then
            echo 'No LocalAI state changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/local_ai_censorship_state.json
          git commit -m 'auto(local-ai): update censorship RL state [skip ci]'
          git push
