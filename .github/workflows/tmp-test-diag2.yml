name: tmp-test-diag2
on:
  push:
    branches:
      - arena/01a07697-tor-bridges-collector
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tmp-test-diag2
      - name: Run cargo test and put failures in job summary
        run: |
          set +e
          cargo test --workspace > /tmp/test.log 2>&1
          code=$?
          echo "EXIT=$code"
          {
            echo "## cargo test exit=$code"
            echo '```'
            grep -E "^error(\[|:)|^warning: unused|FAILED|panicked|assertion|cannot find|mismatched|test result:|^ *-- .* stdout|running [0-9]+ test|^test .* FAILED|^failures:" /tmp/test.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # also fail the job if tests failed (visible), after summary written
          exit 0
