name: orbot-conformance

# Guards the user-visible promise of this repository: every line of the
# paste-ready publication (export/orbot/) can be pasted into Orbot without
# "Invalid bridge format". Read-only: data files stay owned by
# auto-bridge-fusion.yml.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "export/orbot/**"
      - "bridge/**"
      - "export/**"
      - "scripts/orbot_validate.mjs"
      - ".github/workflows/orbot-conformance.yml"
  push:
    branches: [main]
    paths:
      - "export/orbot/**"
      - "scripts/orbot_validate.mjs"
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: orbot-conformance
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Hard gate: what users actually paste into Orbot.
      - name: Hard gate - export/orbot paste-ready lists
        run: node scripts/orbot_validate.mjs --dir export/orbot --json orbot-conformance-report.json

      # Soft report: collector data sets and export/ reports intentionally use
      # other column layouts, so they are measured but never fail the gate.
      - name: Full repository report (soft)
        if: always()
        run: node scripts/orbot_validate.mjs --all --soft --json orbot-conformance-full.json

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: orbot-conformance-reports
          path: |
            orbot-conformance-report.json
            orbot-conformance-full.json
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Paste-ready lists (export/orbot)"
            echo '```'
            node scripts/orbot_validate.mjs --dir export/orbot || true
            echo '```'
            echo "### Full repository (soft report)"
            echo '```'
            node scripts/orbot_validate.mjs --all --soft | tail -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
