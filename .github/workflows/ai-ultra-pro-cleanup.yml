---
name: AI Ultra-Pro Cleanup

'on':
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      keep_last_n:
        description: 'Completed runs to keep per workflow'
        required: false
        default: '2'
      dry_run:
        description: 'Preview deletions without deleting runs'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  workflow_call:
    inputs:
      keep_last_n:
        required: false
        type: string
        default: '2'
      dry_run:
        required: false
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  # Main cleanup has its own group. A branch run must never be able to cancel
  # a main/scheduled cleanup just because both target the same repository.
  # Within non-main refs, a newer commit supersedes the older validation run.
  group: ai-ultra-pro-cleanup-${{ github.repository }}-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cleanup:
    name: Cleanup old workflow runs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cleanup completed workflow runs
        uses: actions/github-script@v9
        env:
          KEEP_LAST_N: ${{ inputs.keep_last_n || github.event.inputs.keep_last_n || '2' }}
          DRY_RUN_RAW: ${{ github.event_name == 'workflow_call' && (inputs.dry_run == false && 'false' || 'true') || github.event.inputs.dry_run || 'true' }}
        with:
          script: |
            const keepLast = Math.max(0, Number.parseInt(process.env.KEEP_LAST_N || '2', 10) || 2);
            const dryRaw = String(process.env.DRY_RUN_RAW || 'true').toLowerCase();
            let dryRun = ['1', 'true', 'yes', 'y'].includes(dryRaw);
            const onMain = context.ref === 'refs/heads/main' && context.eventName !== 'pull_request';
            if (!onMain && !dryRun) {
              core.info('Refusing to delete workflow runs off main; forcing dry-run');
              dryRun = true;
            }
            // PR/feature-branch invocations are validation-only. Do not scan
            // thousands of historical runs from a non-production CI job; this
            // reusable workflow must not delay the parent pipeline's CI contract.
            if (!onMain) {
              core.info('Non-main validation run: cleanup is a safe no-op (no history scan, no deletions).');
              await core.summary
                .addHeading('AI Ultra-Pro Cleanup')
                .addRaw('Mode: validation no-op (non-main ref)\n\n')
                .addRaw('Candidates: 0; Deleted: 0; Scanned: 0\n')
                .write();
              core.setOutput('candidates', '0');
              core.setOutput('deleted', '0');
              core.setOutput('scanned_runs', '0');
              core.setOutput('truncated_workflows', '0');
              return;
            }
            const {owner, repo} = context.repo;
            const currentRunId = context.runId;
            const workflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner,
              repo,
              per_page: 100,
            });
            const PAGE_SIZE = 100;
            const MAX_PAGES_PER_WORKFLOW = 2;
            const MAX_CANDIDATES_PER_WORKFLOW = 25;
            const MAX_CANDIDATES_PER_INVOCATION = 200;
            const MAX_DELETIONS_PER_INVOCATION = 100;
            const summary = [];
            let deleted = 0;
            let scannedRuns = 0;
            let truncatedWorkflows = 0;
            let candidateCapReached = false;
            for (const workflow of workflows) {
              if (summary.length >= MAX_CANDIDATES_PER_INVOCATION || deleted >= MAX_DELETIONS_PER_INVOCATION) {
                candidateCapReached = true;
                core.info('Global cleanup batch cap reached; older candidates will be handled in a later cleanup pass.');
                break;
              }
              // Bound API work. Listing every historical run for every workflow
              // made this reusable job scan an unbounded number of pages and
              // hold up the parent pipeline's final CI contract. Scan the newest
              // 200 completed runs per workflow per invocation; active deletion
              // runs can be repeated to prune older batches incrementally.
              const runs = [];
              let pagesRead = 0;
              for (let page = 1; page <= MAX_PAGES_PER_WORKFLOW; page++) {
                const response = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflow.id,
                  status: 'completed',
                  per_page: PAGE_SIZE,
                  page,
                });
                const batch = response.data.workflow_runs || [];
                runs.push(...batch);
                scannedRuns += batch.length;
                pagesRead = page;
                if (batch.length < PAGE_SIZE) break;
              }
              if (pagesRead === MAX_PAGES_PER_WORKFLOW && runs.length === PAGE_SIZE * MAX_PAGES_PER_WORKFLOW) {
                truncatedWorkflows += 1;
                core.info(`Scan cap reached for ${workflow.name}; older runs remain for a later cleanup pass.`);
              }
              const oldRuns = runs
                .filter(run => run.id !== currentRunId)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
                .slice(keepLast, keepLast + MAX_CANDIDATES_PER_WORKFLOW);
              for (const run of oldRuns) {
                if (summary.length >= MAX_CANDIDATES_PER_INVOCATION || (!dryRun && deleted >= MAX_DELETIONS_PER_INVOCATION)) {
                  candidateCapReached = true;
                  core.info('Global cleanup batch cap reached; remaining candidates stay for a later cleanup pass.');
                  break;
                }
                summary.push({workflow: workflow.name, id: run.id, created_at: run.created_at, dry_run: dryRun});
                if (!dryRun) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({owner, repo, run_id: run.id});
                    deleted += 1;
                  } catch (error) {
                    core.warning(`Could not delete run ${run.id} from ${workflow.name}: ${error.message}`);
                  }
                }
              }
              if (candidateCapReached) break;
            }
            await core.summary
              .addHeading('AI Ultra-Pro Cleanup')
              .addRaw(`Mode: ${dryRun ? 'dry-run' : 'delete'}\n\n`)
              .addRaw(`Keep last completed runs per workflow: ${keepLast}\n\n`)
              .addRaw(`Candidates: ${summary.length}; Deleted: ${deleted}; Scanned: ${scannedRuns}\n\n`)
              .addRaw(`Scan cap: ${PAGE_SIZE * MAX_PAGES_PER_WORKFLOW} newest completed runs per workflow. Workflows at cap: ${truncatedWorkflows}.\n\n`)
              .addRaw(`Batch caps: ${MAX_CANDIDATES_PER_WORKFLOW} candidates/workflow, ${MAX_CANDIDATES_PER_INVOCATION} candidates/invocation, ${MAX_DELETIONS_PER_INVOCATION} deletions/invocation. Cap reached: ${candidateCapReached}.\n`)
              .write();
            core.setOutput('candidates', String(summary.length));
            core.setOutput('deleted', String(deleted));
            core.setOutput('scanned_runs', String(scannedRuns));
            core.setOutput('truncated_workflows', String(truncatedWorkflows));
