name: tmp-test-diag3
on:
  push:
    branches:
      - arena/01a07697-tor-bridges-collector
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: tmp-test-diag3
      - name: Run cargo test and emit failure as annotations
        run: |
          set +e
          cargo test --workspace > /tmp/test.log 2>&1
          code=$?
          echo "EXIT=$code"
          # Emit a single error annotation carrying the failure excerpt.
          excerpt=$(grep -E "^error(\[|:)|^warning: unused|FAILED|panicked|assertion|cannot find|mismatched|test result:|^failures:|^test .* FAILED" /tmp/test.log | head -40 | tr '\n' '~' | sed 's/~/  ;;  /g')
          if [ $code -ne 0 ]; then
            echo "::error title=cargo-test-failures::${excerpt}"
          fi
          exit 0
