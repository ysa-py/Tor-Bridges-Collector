# Allow warnings to be just warnings, not errors.
# CI uses `cargo clippy -- -D warnings` which turns every lint into a hard error.
# During the Rust migration phase we cap lints at 'warn' so the project compiles
# with all rustc + clippy versions (1.75 through 1.97+).
# When every lint is fixed, this file can be removed.
[target.'cfg(all())']
rustflags = ["--cap-lints", "warn"]
