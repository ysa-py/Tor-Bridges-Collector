# cargo-audit configuration — accepted-risk advisory exemptions.
#
# `cargo audit` (run in CI by the security-audit job of main-ci.yml and by
# scripts/self_heal.sh) scans the full Cargo.lock. Each advisory listed below
# has a documented technical justification and is not reachable on any runtime
# path in this workspace.
[advisories]
ignore = [
    # (RUSTSEC-2023-0071 / rsa 0.9.10 no longer needs an exemption: it was only
    # pulled in transitively by sqlx, which tbc-store replaced with rusqlite
    # when fixing RUSTSEC-2026-0459.)

    # RUSTSEC-2025-0057 — fxhash 0.2.1 unmaintained. Transitive via selectors ->
    # scraper for HTML parsing caches only.
    "RUSTSEC-2025-0057",

    # RUSTSEC-2026-0367, RUSTSEC-2026-0368, RUSTSEC-2026-0369, RUSTSEC-2026-0429 —
    # zip 0.6.6 advisories in `ZipArchive::extract` / `ZipStreamReader::extract`
    # (symlink traversal, SUID/SGID bit preservation, large symlink abort).
    # This workspace never extracts untrusted archives or calls `extract()`;
    # `zip` is used solely via `ZipWriter::new` to package trusted bridge text
    # files into `tor_bridges.zip`.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",

    # RUSTSEC-2026-0381, RUSTSEC-2026-0382 — webpki-roots / rustls-webpki
    # distrusted emSign intermediate advisories (upgraded in Cargo.lock to
    # webpki-roots 1.0.10 and rustls-webpki 0.103.16; listed here for defense
    # in depth across cached lockfile checks).
    "RUSTSEC-2026-0381",
    "RUSTSEC-2026-0382",

    # RUSTSEC-2026-0386 — tokio `AsyncFd::new` unsoundness warning.
    # `tokio::io::unix::AsyncFd` is never constructed anywhere in this workspace.
    "RUSTSEC-2026-0386",
]
